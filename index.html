                    `;
                    
                    modal.dataset.origTitle = title;
                    modal.dataset.origText = ev.text;

                window.renderCurrentBroadcastEvent(); // 🚨 કોઈ જ ડીલે વગર તરત જ બતાવો

                window.closePantryBroadcastPopup = function() {
                    if (cycleInterval) clearInterval(cycleInterval);
                    if (autoCloseTimeout) clearTimeout(autoCloseTimeout);
                    const m = document.getElementById('pantryBroadcastPopup');
                    if (m) m.remove();
                };

                window.translateBroadcast = async function(lang) {
                    if(lang === 'en') {
                        window.renderCurrentBroadcastEvent();
                        return;
                    }
                    const titleEl = document.getElementById('broadcastTitleText');
                    const bodyEl = document.getElementById('broadcastBodyText');
                    if(!titleEl || !bodyEl) return;
                    
                    const origTitle = modal.dataset.origTitle;
                    const origText = modal.dataset.origText;
                    
                    titleEl.innerText = "⏳ Translating...";
                    bodyEl.innerHTML = "<div style='text-align:center; padding:10px; color:#0A56D0; font-weight:bold; font-size:12px;'>Please wait...</div>";
                    
                    if (cycleInterval) clearInterval(cycleInterval); 
                    if (autoCloseTimeout) clearTimeout(autoCloseTimeout);

                    const translate = async (text, target) => {
                        try {
                            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${target}&dt=t&q=${encodeURIComponent(text)}`);
                            const data = await res.json();
                            return data[0].map(x => x[0]).join('');
                        } catch(e) { return text; }
                    };
                    
                    const tTitle = await translate(origTitle, lang);
                    const tText = await translate(origText, lang);
                    
                    titleEl.innerText = tTitle;
                    bodyEl.innerHTML = tText.replace(/\n/g, '<br>');
                };

                if (activeEvents.length > 1) {
                    cycleInterval = setInterval(() => {
                        currentIndex++;
                        if (currentIndex >= activeEvents.length) {
                            clearInterval(cycleInterval);
                            autoCloseTimeout = setTimeout(() => { window.closePantryBroadcastPopup(); }, 5000);
                        } else {
                            window.renderCurrentBroadcastEvent();
                        }
                    }, 3000);
                } else {
                    autoCloseTimeout = setTimeout(() => {
                        window.closePantryBroadcastPopup();
                    }, 5000);
                }
            };

                        <!-- 3. BOTTOM DRINK SELECTION (ALL IN ONE LINE) & SEND -->
                        <div style="flex-shrink:0; background:#F8FAFC; padding:4px; border-radius:6px; border:1px solid #CBD5E1;">
                            <input type="hidden" id="csSelectedDrinkValue" value="">
                            
                            <div style="display:flex; gap:2px; margin-bottom:4px; width:100%;">
                                <button onclick="window.setCsDrink('Tea', this)" class="cs-drink-btn" style="flex:1; background:#EFF6FF; color:#1E3A8A; border:1px solid #BFDBFE; padding:4px 0; border-radius:4px; font-weight:bold; font-size:10px; min-height:34px; line-height:1;">Tea</button>
                                <button onclick="window.setCsDrink('Coffee', this)" class="cs-drink-btn" style="flex:1; background:#F1F5F9; color:#475569; border:1px solid #CBD5E1; padding:4px 0; border-radius:4px; font-weight:bold; font-size:10px; min-height:34px; line-height:1;">Coffee</button>
                                <button onclick="window.setCsDrink('Green Tea', this)" class="cs-drink-btn" style="flex:1; background:#ECFDF5; color:#065F46; border:1px solid #A7F3D0; padding:2px 0; border-radius:4px; font-weight:bold; font-size:9.5px; min-height:34px; line-height:1.1;">Green<br>Tea</button>

            window.sendCrossServeRequest = function() {
                const dateInputs = document.querySelectorAll('.cs-multi-date');
                let dateArr = [];
                dateInputs.forEach(inp => { if(inp.value) dateArr.push(inp.value); });
                dateArr = [...new Set(dateArr)]; 
                if(dateArr.length === 0) return appAlert('Error', 'Please keep at least one valid date.');

                const selectedChks = document.querySelectorAll('.cs-emp-chk:checked');
                if(selectedChks.length === 0) return appAlert('Error', 'Please check (select) at least one employee from the list.');

                // નવા રેડિયો બટન પરથી વેલ્યુ વાંચવા માટે
                const sessionRadio = document.querySelector('input[name="csSessionRadio"]:checked');
                const sessionStr = sessionRadio ? sessionRadio.value : (new Date().getHours() < 14 ? 'Morning' : 'Afternoon');
                
                const drink = document.getElementById('csSelectedDrinkValue').value;
                if(!drink) return appAlert('Error', 'Please select which Drink (Tea/Coffee) you served from the bottom menu.');
                
                const updates = {};
                const conflictMsgs = [];
                let validCount = 0;

                selectedChks.forEach(chk => {
                    const empId = chk.value;
                    const empName = chk.dataset.name;
                    const toPantryId = chk.dataset.pantry;

                    dateArr.forEach(ymd => {
                        const dateDMY = window.convertYMDtoDMY ? window.convertYMDtoDMY(ymd) : ymd;
                        
                        const alreadyLogged = logsData.find(l => l.employeeId === empId && l.date === dateDMY && l.session === sessionStr);
                        if (alreadyLogged) {
                            conflictMsgs.push(`• ${empName} (Already served by 🧑‍🍳 ${alreadyLogged.pantryName})`);
                            return;
                        }

                        const alreadyPending = crossRequestsData.find(r => r.empId === empId && r.date === dateDMY && r.session === sessionStr && r.status === 'Pending');
                        if (alreadyPending) {
                            conflictMsgs.push(`• ${empName} (Request already sent to 🧑‍🍳 ${alreadyPending.toPantryName || 'Pantry Boy'})`);
                            return;
                        }

                        const reqId = 'creq_' + Date.now() + Math.random().toString(36).substring(2, 7);
                        updates['crossPantryRequests/' + reqId] = {
                            id: reqId,
                            fromPantryId: currentUser.id,
                            fromPantryName: currentUser.name,
                            toPantryId: toPantryId,
                            empId: empId,
                            empName: empName,
                            drink: drink,
                            session: sessionStr,
                            date: dateDMY, 
                            status: 'Pending',
                            timestamp: Date.now()
                        };
                        validCount++;
                    });
                });

                if (conflictMsgs.length > 0) {
                    appAlert('Action Blocked - Already Served', `The following entries were blocked because they already exist or are pending:\n\n${conflictMsgs.join('\n')}\n\nPlease uncheck them and try again.`);
                    return;
                }

                if (validCount > 0) {
                    appConfirm('Send Requests', `You are sending <b>${validCount}</b> requests.<br><br>Proceed?`, () => {
                        db.ref().update(updates).then(() => {
                            document.querySelectorAll('.cs-emp-chk:checked').forEach(c => c.checked = false);
                            window.updateCsSelectedCount();
                            window.setCsDrink('', document.querySelector('.cs-drink-btn:last-child')); 
                            
                            appAlert('Sent Successfully!', `<b>${validCount}</b> Notifications sent to the assigned pantry boys. Once they approve, entries will be logged.`);
                            if (typeof window.updateCrossServeAlerts === 'function') window.updateCrossServeAlerts();
                            
                            document.getElementById('pantryContentBackBtn').click();
                        });
                    });
                }
            };


            window.approveCrossRequest = function(reqId) {
                const req = crossRequestsData.find(r => r.id === reqId);
                if(!req) return;

                const targetDMY = req.date || getTodayInDMY();
                const sessionStr = req.session || (new Date().getHours() < 14 ? 'Morning' : 'Afternoon');
                const newLogId = 'log_' + req.empId + '_' + targetDMY.replace(/\//g,'') + '_' + sessionStr.substring(0,4) + '_Con';

                const logData = {
                    id: newLogId, 
                    employeeId: req.empId, 
                    employeeName: req.empName,
                    drink: req.drink, 
                    session: sessionStr, 
                    date: targetDMY,
                    pantryId: currentUser.id, 
                    pantryName: currentUser.name, 
                    supplySource: 'Contractor'
                };

                const updates = {};
                updates['logs/' + newLogId] = logData;
                updates['crossPantryRequests/' + reqId + '/status'] = 'Approved'; 

                db.ref().update(updates).then(() => {
                    appAlert('Approved', `Successfully Logged ${req.drink} for ${req.empName}.`);
                    if (typeof window.updateCrossServeAlerts === 'function') window.updateCrossServeAlerts();
                });
            };

            window.rejectCrossRequest = function(reqId) {
                appConfirm('Deny Request', 'Are you sure you want to completely reject this request?', () => {
                    db.ref('crossPantryRequests/' + reqId).remove().then(() => {
                        if (typeof window.updateCrossServeAlerts === 'function') window.updateCrossServeAlerts();
                    });
                });
            };

            window.deleteSentCrossRequest = function(reqId) {
                db.ref('crossPantryRequests/' + reqId).remove().then(() => {
                    if (typeof window.updateCrossServeAlerts === 'function') window.updateCrossServeAlerts();
                });
            };

            window.dismissApprovedRequest = window.deleteSentCrossRequest;

            // ===== Date Change & Auto Refresh Helpers =====            
            window.refreshAllData = function() {
                if (typeof window.populateServe === 'function') window.populateServe();
                var mPopup = document.getElementById('monthlyGridPopup');
                if (mPopup && !mPopup.classList.contains('hidden') && typeof window.openMonthlyGridPopup === 'function') {
                    window.openMonthlyGridPopup();
                }
            };

            window.changeDateBy = function(days) {
                var dateInput = document.getElementById('beverageEntryDate');
                if (!dateInput || !dateInput.value) return;

                var current = new Date(dateInput.value);
                current.setDate(current.getDate() + days);

                var yyyy = current.getFullYear();
                var mm = String(current.getMonth() + 1).padStart(2, '0');
                var dd = String(current.getDate()).padStart(2, '0');
                var newDate = yyyy + '-' + mm + '-' + dd;
                
                if (dateInput._flatpickr) {
                    dateInput._flatpickr.setDate(newDate, true);
                } else {
                    dateInput.value = newDate;
                    window.refreshAllData();
                }
            };

        })(); // <--- MAIN BRACKET IS NOW SECURELY HERE!

        setTimeout(function() {
            var dateInput = document.getElementById('beverageEntryDate');
            if (dateInput) {
                if (!dateInput.value) {
                    var t = new Date();
                    dateInput.value = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
                }
                if (typeof flatpickr !== 'undefined') {
                    flatpickr(dateInput, {
                        dateFormat: "Y-m-d",
                        altInput: true,          
                        altFormat: "d/m/Y (D)", // 🚨 આનાથી તારીખની બાજુમાં કૌંસમાં વાર (Mon, Tue) દેખાશે[span_1](start_span)[span_1](end_span)
                        disableMobile: true, 
                        onChange: function(selectedDates, dateStr) {
                            window.refreshAllData();
                        }
                    });
                } else {
                    dateInput.addEventListener('change', window.refreshAllData);
                    window.refreshAllData();
                }
            }
        }, 800);       
    </script>    
</body>
</html>
