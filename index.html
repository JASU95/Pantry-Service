    // पुराना लोकल स्टोरेज या ऐप कैशे पूरी तरह मिटाकर सर्वर से लाइव फाइल उठाने का फंक्शन
    async function forceLiveAppUpdate() {
      try {
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map(name => caches.delete(name)));
        }
        
        // गिटहब से लाइव चेक करना कि क्या नया एचटीएमएल उपलब्ध है
        const res = await fetch(window.location.href, { method: 'HEAD', cache: 'no-store' });
        const latestTag = res.headers.get('ETag') || res.headers.get('Last-Modified');
        
        if (latestTag) {
          const localTag = localStorage.getItem('app_html_version_token');
          if (localTag && localTag !== latestTag) {
            localStorage.setItem('app_html_version_token', latestTag);
            window.location.reload(true); // एकदम नया HTML लोड करने के लिए हार्ड रीलोड
          } else if (!localTag) {
            localStorage.setItem('app_html_version_token', latestTag);
          }
        }
      } catch (err) {
        console.log("Live bypass active:", err);
      }
    }

    // ऐप शुरू होते ही कैशे बस्टिंग एक्टिव करें
    forceLiveAppUpdate();
    // हर 3 मिनट में बैकग्राउंड में लाइव गिटहब चेक करें
    setInterval(forceLiveAppUpdate, 3 * 60 * 1000);
  </script>

  function getTodayInDMY() {
    const today = new Date();
    const dd = String(today.getDate()).padStart(2, '0');
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const yyyy = today.getFullYear();
    return `${dd}/${mm}/${yyyy}`;
  }

  function convertYMDtoDMY(ymdString) {
    if (!ymdString || !ymdString.includes('-')) return ymdString;
    const parts = ymdString.split('-');
    return `${parts[2]}/${parts[1]}/${parts[0]}`;
  }

  function convertDMYtoYMD(dmyString) {
    if (!dmyString || !dmyString.includes('/')) return dmyString;
    const parts = dmyString.split('/');
    return `${parts[2]}-${parts[1]}-${parts[0]}`;
  }

  function formatDateToDMY(dateStr) {
    if (!dateStr) return '';
    if (dateStr.includes('/')) return dateStr;
    let parts = dateStr.split('-');
    if (parts.length !== 3) return dateStr;
    return `${parts[2]}/${parts[1]}/${parts[0]}`;
  }
  
  function parseDMYToYMD(dmy) {
    if (!dmy) return '';
    if (dmy.includes('-')) return dmy;
    let parts = dmy.split('/');
    if (parts.length !== 3) return dmy;
    return `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
  }
  
  function getDayFromDateDMY(dmy) {
    if (!dmy) return '';
    const ymd = parseDMYToYMD(dmy);
    if (!ymd) return '';
    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const d = new Date(ymd);
    if (isNaN(d.getTime())) return '';
    return days[d.getDay()];
  }

  window.calcEventTotal = function(prefix) {
    const container = document.getElementById(prefix + 'ItemsContainer');
    const display = document.getElementById(prefix + 'CalcDisplay');
    if (!container || !display) return;
    let total = 0;
    container.querySelectorAll('.dynamic-item-row').forEach(row => {
        const q = Number(row.querySelector('.item-qty').value) || 0;
        const rawRate = row.querySelector('.item-rate').value.trim();
        const r = rawRate === "" ? 0 : (parseFloat(rawRate) || 0);
        total += (q * r);
    });
    display.innerText = "₹ " + total.toFixed(2);
  };

  window.saveMergedEventControlRoomHandler = function(prefix, uId, uName) {
    const canteen = document.getElementById(prefix+'Canteen').value;
    const orderedBy = document.getElementById(prefix+'OrderedBy').value;
    const name = document.getElementById(prefix+'Name').value.trim();
    const rawDate = document.getElementById(prefix+'Date').value; 
    const d = convertYMDtoDMY(rawDate);
    const t = document.getElementById(prefix+'Time').value;
    const venue = document.getElementById(prefix+'Venue').value;
    
    const container = document.getElementById(prefix+'ItemsContainer');
    if (!container) return;
    
    const items = [];
    let totalAmt = 0;
    let summaryTextList = [];

    container.querySelectorAll('.dynamic-item-row').forEach(row => {
        const type = row.querySelector('.item-type').value;
        const iName = row.querySelector('.item-name').value.trim();
        const qty = Number(row.querySelector('.item-qty').value) || 0;
        const rawRate = row.querySelector('.item-rate').value.trim();
        const rate = rawRate === "" ? 0 : (parseFloat(rawRate) || 0);
        const itemTime = row.querySelector('.item-time').value || t;

        if(iName && qty > 0) {
            const amt = qty * rate;
            items.push({type, name: iName, qty, rate, amount: amt, time: itemTime});
            totalAmt += amt;
            summaryTextList.push(`${qty} ${iName} (${itemTime})`);
        }
    });

    if(!name) return appAlert('Missing Field', 'Please enter Event/Meeting Name.');
    if(!orderedBy) return appAlert('Missing Field', 'Please select Requested By Department.');
    if(!venue) return appAlert('Missing Field', 'Please select Venue Location.');
    if(items.length === 0) return appAlert('Table Empty', 'Provide at least 1 valid line item.');

    const generatedTimestampId = Date.now();
    const compiledMenuSummary = summaryTextList.join(', ');
    const billLogId = 'event_' + generatedTimestampId + "_" + Math.floor(Math.random()*1000);
    
    db.ref('eventLogs/' + billLogId).set({
        id: billLogId, canteenSource: canteen, orderedBy, eventName: name, date: d, time: t, venue,
        items: items, amount: totalAmt, pantryId: uId, pantryName: uName, refreshmentSummary: compiledMenuSummary
    });

    const broadcastNoticeId = 'upc_' + generatedTimestampId;
    db.ref('upcomingEvents/' + broadcastNoticeId).set({ id: broadcastNoticeId, title: name, venue: venue || 'Not Specified', refreshment: compiledMenuSummary, date: d, time: t });

    appAlert('Success', 'Event compiled and live announcement broadcasted!');
    document.getElementById(prefix+'Name').value = ''; document.getElementById(prefix+'OrderedBy').value = ''; document.getElementById(prefix+'Venue').value = '';
    if (document.getElementById(prefix+'ScriptTextarea')) document.getElementById(prefix+'ScriptTextarea').value = '';
    container.innerHTML = ''; window.calcEventTotal(prefix);
  };

  window.parseEventScriptText = function(prefix) {
    const rawText = document.getElementById(prefix + 'ScriptTextarea').value;
    const container = document.getElementById(prefix + 'ItemsContainer');
    if(!rawText.trim() || !container) return;

    const lines = rawText.split('\n');
    let parsedAny = false;
    const rightNowTime = new Date().toTimeString().split(' ')[0].substring(0,5);

    lines.forEach(line => {
        const qtyMatch = line.match(/(\d+)\s*(tea|coffee|samosa|biscuit|cookie|water|juice|drink|snack|cup|plate|pkt)/i);
        if(qtyMatch) {
            const qty = qtyMatch[1];
            let itemName = qtyMatch[2]; itemName = itemName.charAt(0).toUpperCase() + itemName.slice(1);
            const row = document.createElement('div');
            row.className = 'dynamic-item-row';
            row.style = "display:flex; gap:6px; margin-bottom:8px; align-items:center; flex-wrap:wrap; background:#f1f5f9; padding:8px; border-radius:8px;";
            row.innerHTML = `
                <select class="item-type" style="flex:1.2; padding:10px; font-size:0.75rem; margin:0; border-radius:6px;">
                  <option ${itemName.toLowerCase().includes('tea')||itemName.toLowerCase().includes('coffee') ? 'selected':''}>☕ Tea/Coffee</option>
                  <option ${itemName.toLowerCase().includes('samosa')||itemName.toLowerCase().includes('biscuit') ? 'selected':''}>🍪 Snacks/Food</option>
                  <option>🥤 Other</option>
                </select>
                <input type="text" class="item-name" value="${itemName}" placeholder="Item Name" style="flex:2; padding:10px; font-size:0.8rem; margin:0; border-radius:6px;">
                <input type="number" class="item-qty" value="${qty}" placeholder="Qty" min="1" style="flex:0.8; padding:10px; font-size:0.8rem; margin:0; border-radius:6px;">
                <input type="number" class="item-rate" placeholder="₹ Rate" min="0" value="" style="flex:0.9; padding:10px; font-size:0.8rem; margin:0; border-radius:6px;">
                <input type="time" class="item-time" value="${rightNowTime}" style="flex:1.1; padding:10px; font-size:0.8rem; margin:0; border-radius:6px;">
                <button type="button" class="danger remove-item-btn" style="padding:8px 12px; box-shadow:none; border-radius:6px; margin:0; font-size:1rem;">X</button>
            `;
            container.appendChild(row);
            row.querySelector('.remove-item-btn').onclick = function() { row.remove(); window.calcEventTotal(prefix); };
            row.querySelectorAll('input').forEach(i => i.addEventListener('input', () => window.calcEventTotal(prefix)));
            parsedAny = true;
        }
    });
    if(parsedAny) { window.calcEventTotal(prefix); document.getElementById(prefix + 'ScriptTextarea').value = ''; appAlert('Script Processed', 'Auto-filled matched items!'); } 
    else { appAlert('Parsing Failed', 'Could not detect item quantities.'); }
  };

  window.handleEventExcelUpload = function(event, prefix) {
    const file = event.target.files[0]; if(!file) return;
    const reader = new FileReader();
    const rightNowTime = new Date().toTimeString().split(' ')[0].substring(0,5);
    reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, {type: 'array'});
        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
        const jsonRows = XLSX.utils.sheet_to_json(worksheet);
        const container = document.getElementById(prefix + 'ItemsContainer');
        if(!container) return;

        jsonRows.forEach(row => {
            const itemName = row['Item Name'] || row['Item'] || row['ItemName'] || '';
            const qty = row['Quantity'] || row['Qty'] || 1;
            const rate = row['Rate'] || row['Price'] || '';
            const rowTime = row['Time'] || rightNowTime;

            if(itemName) {
                const div = document.createElement('div');
                div.className = 'dynamic-item-row';
                div.style = "display:flex; gap:6px; margin-bottom:8px; align-items:center; flex-wrap:wrap; background:#f1f5f9; padding:8px; border-radius:8px;";
                div.innerHTML = `
                    <select class="item-type" style="flex:1.2; padding:10px; font-size:0.75rem; margin:0; border-radius:6px;"><option>☕ Tea/Coffee</option><option>🍪 Snacks/Food</option><option>🥤 Other</option></select>
                    <input type="text" class="item-name" value="${itemName.replace(/"/g, '&quot;')}" placeholder="Item Name" style="flex:2; padding:10px; font-size:0.8rem; margin:0; border-radius:6px;">
                    <input type="number" class="item-qty" value="${qty}" placeholder="Qty" min="1" style="flex:0.8; padding:10px; font-size:0.8rem; margin:0; border-radius:6px;">
                    <input type="number" class="item-rate" value="${rate}" placeholder="₹ Rate" min="0" value="${rate}" style="flex:0.9; padding:10px; font-size:0.8rem; margin:0; border-radius:6px;">
                    <input type="time" class="item-time" value="${rowTime}" style="flex:1.1; padding:10px; font-size:0.8rem; margin:0; border-radius:6px;">
                    <button type="button" class="danger remove-item-btn" style="padding:8px 12px; box-shadow:none; border-radius:6px; margin:0; font-size:1rem;">X</button>
                `;
                container.appendChild(div);
                div.querySelector('.remove-item-btn').onclick = function() { div.remove(); window.calcEventTotal(prefix); };
                div.querySelectorAll('input').forEach(i => i.addEventListener('input', () => window.calcEventTotal(prefix)));
            }
        });
        window.calcEventTotal(prefix); appAlert('Excel Processed', 'Loaded data items directly from sheet!');
    };
    reader.readAsArrayBuffer(file);
  };

  window.populateSharedEventSectionDataViews = function(formPrefix) {
    const alertListFeed = document.getElementById(`${formPrefix}SharedUpcomingNoticeListContainer`);
    const pastArchiveHistoryFeed = document.getElementById(`${formPrefix}SharedPastArchivedEventsHistoryFeedContainer`);
    const rightNowTimestamp = Date.now(); const absoluteFiveHoursInMilliseconds = 5 * 60 * 60 * 1000;
    let completedPastArchivedArray = [];
    let upcomingRemovals = [];

    eventLogsData.forEach(event => {
        const ymdDate = parseDMYToYMD(event.date);
        const eventDateTimeString = `${ymdDate}T${event.time || '00:00'}`;
        const eventScheduleEpochTime = new Date(eventDateTimeString).getTime();
        if (!isNaN(eventScheduleEpochTime) && (rightNowTimestamp - eventScheduleEpochTime) >= absoluteFiveHoursInMilliseconds) {
            completedPastArchivedArray.push(event);
            upcomingEventsData.forEach(noticeTicket => { 
                if (noticeTicket.title === event.eventName && noticeTicket.date === event.date) { 
                    upcomingRemovals.push(noticeTicket.id);
                }
            });
        }
    });

    if (upcomingRemovals.length > 0) {
        upcomingRemovals.forEach(id => { db.ref('upcomingEvents/' + id).remove(); });
    }

    if(alertListFeed) {
        const rightNowTruncatedDate = new Date().setHours(0,0,0,0);
        const liveBroadcastNoticeTickets = upcomingEventsData.filter(u => {
          const ymdDate = parseDMYToYMD(u.date);
          return new Date(ymdDate) >= rightNowTruncatedDate;
        }).sort((a,b) => new Date(parseDMYToYMD(a.date)+' '+a.time) - new Date(parseDMYToYMD(b.date)+' '+b.time));

        if(liveBroadcastNoticeTickets.length === 0) { alertListFeed.innerHTML = `<p style="font-size:0.85rem; color:#74777F; text-align:center;">No pending live events.</p>`; } 
        else { alertListFeed.innerHTML = liveBroadcastNoticeTickets.map(u => `
              <div style="border-left: 3px solid #D97706; padding-left: 8px; margin-bottom: 8px; background:#FFF; padding:6px; border-radius:6px; display:flex; justify-content:space-between; align-items:center;">
                 <div style="width:85%; text-align:left;">
                    <strong style="color:#D97706; font-size:0.95rem;">${safeStr(u.title)}</strong>
                    <div style="font-size:0.75rem; color:#44474E; margin-top:2px;">📍 <strong>${safeStr(u.venue)}</strong> | 📅 ${safeStr(u.date)} ⏰ ${safeStr(u.time)}</div>
                    <div style="margin-top:4px; font-weight:600; color:#B45309; font-size:0.75rem;">Items: ${safeStr(u.refreshment)}</div>
                 </div>
                 <button onclick="window.pantryDeleteHandler('upcoming_event', '${u.id}')" style="background:transparent; color:#DC3545; padding:4px; font-size:1.1rem; cursor:pointer;">🗑</button>
              </div>`).join('');
        }
    }

    if(pastArchiveHistoryFeed) {
        const chronologicallySortedArchive = completedPastArchivedArray.sort((a,b) => new Date(parseDMYToYMD(b.date) + ' ' + b.time) - new Date(parseDMYToYMD(a.date) + ' ' + a.time));
        if(chronologicallySortedArchive.length === 0) { pastArchiveHistoryFeed.innerHTML = `<p style="text-align:center; padding:16px; color:#64748B; font-size:0.85rem;">No past archives found.</p>`; } 
        else { pastArchiveHistoryFeed.innerHTML = chronologicallySortedArchive.map(ev => {
              let parsedLineItemsDetailsStr = '';
              if(ev.items && Array.isArray(ev.items)) { parsedLineItemsDetailsStr = ev.items.map(i => `${i.name} (Qty: ${i.qty}, Time: ${i.time || 'N/A'}${i.rate ? `, Rate: ₹${i.rate}` : ''})`).join(' | '); }
              return `
                 <div class="log-item" style="flex-direction:column; align-items:stretch; gap:4px; font-size:0.85rem; border-left:4px solid #475569; margin: 6px 4px; text-align:left; background:#F8FAFC;">

  function exportIndividualReport(type) {
    const month = document.getElementById('reportMonth')?.value; if(!month) return appAlert('Error', 'Select month');
    const wb = XLSX.utils.book_new();
    if(type === 'regular') {
      const cat = document.getElementById('reportCategory').value;
      const data = [['Employee Name','Category','Morning Regular','Afternoon Regular','Grand Total']];
      employeeList.filter(e => cat === 'All' || e.category === cat).forEach(emp => {
        const m = logsData.filter(l => l.employeeId === emp.id && l.session === 'Morning' && parseDMYToYMD(l.date).startsWith(month)).length;
        const a = logsData.filter(l => l.employeeId === emp.id && l.session === 'Afternoon' && parseDMYToYMD(l.date).startsWith(month)).length;
        data.push([emp.name, emp.category, m, a, m+a]);
      });
      const ws = XLSX.utils.aoa_to_sheet(data); ws['!cols'] = [{wch: 26}, {wch: 15}, {wch: 24}, {wch: 24}, {wch: 26}];
      XLSX.utils.book_append_sheet(wb, ws, 'Regular Daily Tea'); XLSX.writeFile(wb, `Daily_Regular_Tea_Report_${month}.xlsx`);
    } else if(type === 'extra') {
      const data = [['Log ID','Employee Name','Choice','Quantity','Remarks','Date','Served By']];
      extraLogsData.filter(ex => ex.date && parseDMYToYMD(ex.date).startsWith(month)).forEach(ex => data.push([ex.id, ex.employeeName, ex.drink, ex.qty, ex.remarks || 'None', ex.date, ex.pantryName]));
      const ws = XLSX.utils.aoa_to_sheet(data); ws['!cols'] = [{wch: 16}, {wch: 24}, {wch: 18}, {wch: 18}, {wch: 32}, {wch: 14}, {wch: 20}];
      XLSX.utils.book_append_sheet(wb, ws, 'Extra Tea Entries'); XLSX.writeFile(wb, `Extra_Tea_Allocation_Report_${month}.xlsx`);
    } else if(type === 'meeting') {
      const data = [['Log ID', 'Canteen Vendor', 'Ordered By', 'Event Title', 'Date', 'Time', 'Venue Location', 'Detailed Dynamic Items', 'Grand Total (₹)', 'Log Operator']];
      eventLogsData.filter(ev => ev.date && parseDMYToYMD(ev.date).startsWith(month)).forEach(ev => {
        let itemsStr = ''; if(ev.items && Array.isArray(ev.items)) { itemsStr = ev.items.map(i => `${i.name} (Qty:${i.qty}, Time:${i.time || 'N/A'}, Rate:₹${i.rate})`).join(' | '); }
        data.push([ ev.id, ev.canteenSource || '-', ev.orderedBy || '-', ev.eventName, ev.date, ev.time, ev.venue, itemsStr, ev.amount, ev.pantryName ]);
      });
      const ws = XLSX.utils.aoa_to_sheet(data); ws['!cols'] = [{wch: 14}, {wch: 18}, {wch: 18}, {wch: 22}, {wch: 12}, {wch: 10}, {wch: 18}, {wch: 45}, {wch: 16}, {wch: 18}];
      XLSX.utils.book_append_sheet(wb, ws, 'Meeting Refreshments'); XLSX.writeFile(wb, `Meeting_And_Refreshment_Report_${month}.xlsx`);
    }
  }

      const staffSelect = document.getElementById('extraStaffSelect'); const empId = staffSelect.value;
      const empName = staffSelect.options[staffSelect.selectedIndex] ? staffSelect.options[staffSelect.selectedIndex].dataset.name : '';
      const drink = document.getElementById('extraItemSelect').value; const qty = Number(document.getElementById('extraQty').value) || 1;
      const remarks = document.getElementById('extraRemarks').value.trim();
      if(!empId) return appAlert('Error', 'Please select employee.');
      const id = 'extra_' + Date.now();
      db.ref('extraLogs/' + id).set({ id, employeeId: empId, employeeName: empName, drink, qty, remarks, date: todayDMY, pantryId: currentUser.id, pantryName: currentUser.name });
      appAlert('Success', 'Logged!'); document.getElementById('extraRemarks').value = ''; renderExtraTeaSection(true);
    };
    renderExtraTeaSection(true);
  }

  window.refreshLogsHistoryOnly = function() {
    if (activePantryTab === 'logs' && document.getElementById('logsList')) { renderLogsHistoryData(); }
  };

  function renderLogsHistoryData() {
    const filterType = document.getElementById('filterType'), filterValue = document.getElementById('filterValue');
    if (!filterType || !filterValue) return;
    const type = filterType.value;
    let val = filterValue.value;
    
    if (type === 'date' && val.includes('-')) {
      val = convertYMDtoDMY(val);
    }

    const freshLogs = logsData.filter(l => l.pantryId === currentUser.id);
    let filteredLogs = freshLogs.filter(l => { 
      if(!val) return true; 
      if (type === 'date') return l.date === val;
      const ymd = parseDMYToYMD(l.date);
      return ymd.startsWith(val); 
    });

    let tea=0, coffee=0, green=0, other=0;
    filteredLogs.forEach(l => {
      const d = (l.drink || '').toLowerCase().trim();
      if(d === 'tea' || d === 'black tea' || d === 'lemon tea') tea++;
      else if(d === 'coffee' || d === 'black coffee') coffee++;
      else if(d === 'green tea') green++;
      else other++;
    });
    
    const tc = document.getElementById('statTeaCups');
    if(tc) {
      tc.innerText = tea; document.getElementById('statCoffeeCups').innerText = coffee;
      document.getElementById('statGreenTeaCups').innerText = green; document.getElementById('statOtherCups').innerText = other;
      document.getElementById('filteredTotalText').innerText = `Grand Total: ${filteredLogs.length} Distributed`;
    }

    const grouped = {};
    filteredLogs.forEach(l => {
      const key = l.date + '_' + l.employeeId;
      if(!grouped[key]) grouped[key] = { empName: l.employeeName, date: l.date, mDrink: null, aDrink: null, mId: null, aId: null };
      if(l.session === 'Morning') { grouped[key].mDrink = l.drink; grouped[key].mId = l.id; }
      if(l.session === 'Afternoon') { grouped[key].aDrink = l.drink; grouped[key].aId = l.id; }
    });
    
    const groupedArr = Object.values(grouped).sort((a,b) => new Date(parseDMYToYMD(b.date)) - new Date(parseDMYToYMD(a.date)));
    const targetList = document.getElementById('logsList'); if(!targetList) return;
    if(groupedArr.length === 0) { targetList.innerHTML = `<p style="text-align:center; padding:20px; color:#74777F; font-size:0.85rem;">No historical entries.</p>`; return; }
    
    targetList.innerHTML = groupedArr.map(g => `
      <div class="log-item" style="display:flex; flex-direction:column; align-items:flex-start; margin:8px 2px; padding:12px; border-left:4px solid #0A56D0;">
        <div style="width:100%; display:flex; justify-content:space-between; margin-bottom:8px; border-bottom:1px solid #E2E8F0; padding-bottom:6px;"><strong style="color:#0A56D0; font-size:1rem;">${safeStr(g.empName)}</strong><small style="color:#74777F; font-weight:700;">${safeStr(g.date)}</small></div>
        ${g.mDrink ? `<div style="width:100%; display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;"><span style="color:#44474E; font-size:0.85rem;">🌅 Morning: <strong>${safeStr(g.mDrink)}</strong></span><span><button onclick="window.pantryEditLogHandler('${g.mId}', '${safeStr(g.mDrink)}')" style="background:transparent; color:#0A56D0; padding:2px; box-shadow:none; font-size:1.1rem; cursor:pointer;">✏️</button><button onclick="window.pantryDeleteHandler('regular_log', '${g.mId}')" style="background:transparent; color:#DC3545; padding:2px; box-shadow:none; font-size:1.1rem; cursor:pointer;">🗑</button></span></div>` : ''}
        ${g.aDrink ? `<div style="width:100%; display:flex; justify-content:space-between; align-items:center;"><span style="color:#44474E; font-size:0.85rem;">🌇 Afternoon: <strong>${safeStr(g.aDrink)}</strong></span><span><button onclick="window.pantryEditLogHandler('${g.aId}', '${safeStr(g.aDrink)}')" style="background:transparent; color:#0A56D0; padding:2px; box-shadow:none; font-size:1.1rem; cursor:pointer;">✏️</button><button onclick="window.pantryDeleteHandler('regular_log', '${g.aId}')" style="background:transparent; color:#DC3545; padding:2px; box-shadow:none; font-size:1.1rem; cursor:pointer;">🗑</button></span></div>` : ''}
      </div>`).join('');
  }

  function renderLogsHistory() {
    activePantryTab = 'logs'; const todayYMD = new Date().toISOString().split('T')[0];
    document.getElementById('pantryDynamicContent').innerHTML = `
      <div style="display:flex; gap:8px; margin-bottom:12px; flex-shrink:0;"><select id="filterType" style="flex:1; margin:0; padding:10px;"><option value="date">📅 Daily</option><option value="month">🗓 Monthly</option><option value="year">📆 Yearly</option></select><input type="date" id="filterValue" value="${todayYMD}" style="flex:2; margin:0; padding:10px;"></div>
      <div class="card" style="padding:14px; margin-bottom:14px; background:#F8FAFC; border:1px solid #0A56D0; flex-shrink:0;">
          <h4 style="font-size:0.85rem; color:#0A56D0; margin-bottom:8px; text-align:center;">📋 Metrics</h4>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; text-align:center;">
             <div style="background:white; padding:6px; border-radius:8px; border:1px solid #CBD5E1;"><div id="statTeaCups" style="font-size:1.1rem; font-weight:700;">0</div><div style="font-size:0.65rem; color:#64748B;">TEA</div></div>
             <div style="background:white; padding:6px; border-radius:8px; border:1px solid #CBD5E1;"><div id="statCoffeeCups" style="font-size:1.1rem; font-weight:700;">0</div><div style="font-size:0.65rem; color:#64748B;">COFFEE</div></div>
             <div style="background:white; padding:6px; border-radius:8px; border:1px solid #CBD5E1;"><div id="statGreenTeaCups" style="font-size:1.1rem; font-weight:700;">0</div><div style="font-size:0.65rem; color:#64748B;">GREEN TEA</div></div>
             <div style="background:white; padding:6px; border-radius:8px; border:1px solid #CBD5E1;"><div id="statOtherCups" style="font-size:1.1rem; font-weight:700;">0</div><div style="font-size:0.65rem; color:#64748B;">OTHER</div></div>
          </div>
          <div style="text-align:center; margin-top:8px; font-size:0.8rem; font-weight:700; color:#0A56D0;" id="filteredTotalText">Grand Total: 0 Served</div>
      </div>
      <div id="logsList" class="scroll-list-box"></div>`;

    const filterType = document.getElementById('filterType'), filterValue = document.getElementById('filterValue');
    filterType.addEventListener('change', (e) => {
      if(e.target.value === 'date') { filterValue.type = 'date'; filterValue.value = todayYMD; } 
      else if(e.target.value === 'month') { filterValue.type = 'month'; filterValue.value = todayYMD.substring(0, 7); } 
      else if(e.target.value === 'year') { filterValue.type = 'number'; filterValue.placeholder = 'YYYY'; filterValue.value = todayYMD.substring(0, 4); }
      renderLogsHistoryData();
    });
    filterValue.addEventListener('input', renderLogsHistoryData);
    renderLogsHistoryData();
  }

  renderLogin();
})();
</script>
</body>
</html>
