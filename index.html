<!DOCTYPE html>
<html lang="en">
<head>
<script>
    // ⚠️ જ્યારે પણ તમે ગિટહબ પર નવો કોડ નાખો, ત્યારે આ વર્ઝન નંબર બદલી નાખવો (દા.ત. 1.0.1 થી 1.0.2)
    const APP_VERSION = "1.0.2"; 
    const currentAppVersion = localStorage.getItem('dau_pantry_version');

    if (currentAppVersion !== APP_VERSION) {
        // નવું વર્ઝન સેવ કરો
        localStorage.setItem('dau_pantry_version', APP_VERSION);
        
        // 1. Service Worker (PWA) નો જૂનો કેશ કાઢી નાખવા
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                }
            });
        }

        // 2. બ્રાઉઝરને બળજબરીથી નવું પેજ લોડ કરાવવા માટે URL પાછળ ટાઈમસ્ટેમ્પ લગાવવો
        const cleanUrl = window.location.origin + window.location.pathname;
        const freshUrl = cleanUrl + '?update=' + new Date().getTime();
        
        window.location.replace(freshUrl);
    }
</script>

           window.pantryDownloadExcelFile = async function(wb, filename) {

    try {

        const fileNameWithExt =
            filename.endsWith('.xlsx')
                ? filename
                : filename + '.xlsx';

        const wbout = XLSX.write(wb, {
            bookType: 'xlsx',
            type: 'array'
        });

        const bytes = new Uint8Array(wbout);

        let binary = '';

        const chunkSize = 0x8000;

        for (let i = 0; i < bytes.length; i += chunkSize) {
            binary += String.fromCharCode(
                ...bytes.subarray(i, i + chunkSize)
            );
        }

        const base64 = btoa(binary);

        const mime =
            'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';

        // ANDROID APK
        if (
            window.AndroidDownload &&
            typeof window.AndroidDownload.download === 'function'
        ) {

            window.AndroidDownload.download(
                base64,
                fileNameWithExt,
                mime
            );

            appAlert(
                'Downloaded',
                fileNameWithExt + ' saved to Downloads.'
            );

            return;
        }

        // NORMAL BROWSER
        const blob = new Blob(
            [wbout],
            { type: mime }
        );

        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');

        a.href = url;
        a.download = fileNameWithExt;

        document.body.appendChild(a);

        a.click();

        setTimeout(() => {

            URL.revokeObjectURL(url);

            a.remove();

        }, 1000);

    } catch (err) {

        console.error(err);

        appAlert(
            'Download Failed',
            err.message || 'Unable to download file.'
        );
    }
};

            window.getCombinedExtraTea = function() {
                let combined = [];
                if (typeof extraTeaRecords !== 'undefined' && Array.isArray(extraTeaRecords)) {
                    combined = [...extraTeaRecords];
                }
                if (typeof extraLogsData !== 'undefined' && Array.isArray(extraLogsData)) {
                    extraLogsData.forEach(ex => {
                        if (!combined.some(c => c.id === ex.id)) {
                            combined.push({
                                id: ex.id,
                                date: ex.date,
                                time: ex.time || '00:00',
                                employeeId: ex.employeeId,
                                employeeName: ex.employeeName || ex.name || 'Unknown',
                                department: ex.department || '',
                                category: ex.category || '',
                                beverage: ex.drink || ex.beverage || 'Tea',
                                qty: Number(ex.qty) || 1,
                                reason: ex.remarks || ex.reason || 'None',
                                remarks: ex.remarks || '',
                                pantryId: ex.pantryId,
                                pantryName: ex.pantryName || 'Unknown',
                                supplySource: ex.supplySource || 'Contractor',
                                isOldLog: true // આ જૂનો ડેટા છે તેની ઓળખ
                            });
                        }
                    });
                }
                combined.sort((a, b) => {
                    const aDate = parseDMYToYMD(a.date) || '';
                    const bDate = parseDMYToYMD(b.date) || '';
                    if(bDate !== aDate) return bDate.localeCompare(aDate);
                    return (b.time || '').localeCompare(a.time || '');
                });
                return combined;
            };

            window.pantryDeleteHandler = function(type, id) {
                const typeMap = { employee: { ref: 'employees', binRef: 'recycleBin/employees', data: employeeList }, pantry: { ref: 'pantryTeam', binRef: 'recycleBin/pantryTeam', data: pantryTeam }, extra: { ref: 'extraLogs', binRef: 'recycleBin/extraLogs', data: extraLogsData }, event: { ref: 'eventLogs', binRef: 'recycleBin/eventLogs', data: eventLogsData }, regular_log: { ref: 'logs', binRef: 'recycleBin/logs', data: logsData }, canteen: { ref: 'canteens', binRef: null, data: canteenList }, venue: { ref: 'venues', binRef: null, data: venueList }, upcoming_event: { ref: 'upcomingEvents', binRef: null, data: upcomingEventsData }, supervisor_link: { ref: 'supervisorLinks', binRef: null, data: null } };
                const entry = typeMap[type]; 
                if (!entry) return; 
                
                if (type === 'canteen' || type === 'venue' || type === 'upcoming_event' || type === 'supervisor_link') { 
                    appConfirm(`Delete ${type}`, `Permanently remove this ${type}?`, () => { 
                        db.ref(entry.ref + '/' + id).remove().then(() => { 
                            const modal = document.getElementById('eventHistoryModal'); 
                            if (modal && !modal.classList.contains('hidden') && type === 'event' && window.openEventHistoryModal) { 
                                setTimeout(() => window.openEventHistoryModal(), 150); 
                            } 
                        }); 
                    }); 
                    return; 
                } 
                
                appConfirm('Move to Recycle Bin', `Send this ${type} to recycle bin? (Past data remains safe in reports)`, () => { 
                    const target = entry.data.find(e => e.id === id); 
                    if (target) { 
                        db.ref(entry.binRef + '/' + id).set(target); 
                        if (type === 'employee' || type === 'pantry') {
                            // નવું લોજીક: કાયમ માટે ડીલીટ કરવાને બદલે Inactive કરો
                            db.ref(entry.ref + '/' + id).update({ status: 'Inactive', assignedPantryId: "" }).then(() => {
                                appAlert('Archived', `${type} archived. Past data is safe.`);
                            });
                        } else {
                            db.ref(entry.ref + '/' + id).remove().then(() => { 
                                try { 
                                    const modal = document.getElementById('eventHistoryModal'); 
                                    if (modal && !modal.classList.contains('hidden')) { 
                                        const btn = modal.querySelector(`button[onclick*="'${id}'"]`); 
                                        if (btn) { const tr = btn.closest('tr'); if (tr) tr.style.display = 'none'; } 
                                        if (type === 'event' && window.openEventHistoryModal) { setTimeout(() => window.openEventHistoryModal(), 200); } 
                                    } 
                                } catch(e) {} 
                            }); 
                        }
                    } 
                }); 
            };

            // Custom Dropdown JS Helpers (Smart Positioning)
            window.openMyDrop = function(btn) {
                document.querySelectorAll('.my-drop-wrap').forEach(w => w.classList.remove('active'));
                const wrap = btn.parentElement;
                wrap.classList.add('active');
                
                // ડ્રોપડાઉનને એક્ઝેટ બટનની નીચે સેટ કરવા માટેની ગણતરી
                const list = wrap.querySelector('.my-drop-list');
                const rect = btn.getBoundingClientRect();
                
                list.style.top = (rect.bottom + 4) + 'px';
                list.style.left = (rect.left + (rect.width / 2)) + 'px';
                list.style.transform = 'translateX(-50%)';
                list.style.bottom = 'auto'; // Reset

                // જો લિસ્ટ સ્ક્રીનની નીચે દબાઈ જતું હોય, તો તેને બટનની ઉપરની બાજુ ખોલો
                setTimeout(() => {
                    const listRect = list.getBoundingClientRect();
                    if (listRect.bottom > window.innerHeight) {
                        list.style.top = 'auto';
                        list.style.bottom = (window.innerHeight - rect.top + 4) + 'px';
                    }
                }, 0);
            };
            window.closeMyDrop = function(overlay) {
                overlay.parentElement.classList.remove('active');
            };

            window.saveDirectRowEdit = function(empId, targetRow) {
                const mInput = targetRow.querySelector('input.mornDrink');
                const aInput = targetRow.querySelector('input.aftDrink');
                const selectedDateDMY = convertYMDtoDMY(document.getElementById('beverageEntryDate')?.value || new Date().toISOString().split('T')[0]);
                const supplySource = targetRow.dataset.supply || 'Contractor';
                
                const matchedLogs = logsData.filter(l => l.employeeId === empId && l.date === selectedDateDMY && (l.supplySource === supplySource || (!l.supplySource && supplySource === 'Contractor')));
                const morning = matchedLogs.find(l => l.session === 'Morning');
                const afternoon = matchedLogs.find(l => l.session === 'Afternoon');

                const mVal = mInput ? mInput.value : '';
                const aVal = aInput ? aInput.value : '';

                // પર્ફેક્ટ યુનિક આઈડી જનરેટર 
                const genId = (session) => 'log_' + empId + '_' + selectedDateDMY.replace(/\//g,'') + '_' + session + '_' + supplySource.substring(0,3);

                if (morning) {
                    if (mVal === '') db.ref('logs/' + morning.id).remove();
                    else if (mVal && mVal !== morning.drink) db.ref('logs/' + morning.id).update({ drink: mVal });
                } else if (mVal && mVal !== '') {
                    // જો સવારની એન્ટ્રી ખાલી હતી અને પેન્સિલથી નવી નાખી તો સેવ કરવા માટે
                    const newId = genId('Morn');
                    db.ref('logs/' + newId).set({ id: newId, employeeId: empId, employeeName: targetRow.dataset.name, drink: mVal, session: 'Morning', date: selectedDateDMY, pantryId: currentUser.id, pantryName: currentUser.name, supplySource: supplySource });
                }

                if (afternoon) {
                    if (aVal === '') db.ref('logs/' + afternoon.id).remove();
                    else if (aVal && aVal !== afternoon.drink) db.ref('logs/' + afternoon.id).update({ drink: aVal });
                } else if (aVal && aVal !== '') {
                     // જો બપોરની એન્ટ્રી ખાલી હતી અને પેન્સિલથી નવી નાખી તો સેવ કરવા માટે
                    const newId = genId('Aft');
                    db.ref('logs/' + newId).set({ id: newId, employeeId: empId, employeeName: targetRow.dataset.name, drink: aVal, session: 'Afternoon', date: selectedDateDMY, pantryId: currentUser.id, pantryName: currentUser.name, supplySource: supplySource });
                }

                const editBtn = targetRow.querySelector('button');
                if(editBtn) {
                    editBtn.innerHTML = '✅';
                    editBtn.style.background = 'transparent';
                    editBtn.style.color = '#146C43';

                        editBtn.style.color = '#0A56D0';

                            const finalRowDate = convertYMDtoDMY(dateVal);

                            if (locationVal && !venueList.some(v => v.name.toLowerCase() === locationVal.toLowerCase())) {
                                const vId = 'vnu_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
                                db.ref('venues/' + vId).set({ id: vId, name: locationVal });
                            }

                            const vKey = vendor.toLowerCase().trim();
                            const currentCatalog = vendorItemsCatalog[vKey] || [];
                            if (!currentCatalog.some(it => it.name.toLowerCase() === iName.toLowerCase())) {
                                currentCatalog.push({ name: iName, rate: rate });
                                db.ref('vendorItems/' + vKey).set(currentCatalog);
                            }

                            items.push({ 
                                vendor: vendor, 
                                type: '🍪 Snacks/Food', 
                                name: iName, 
                                qty: qty, 
                                unit: 'Nos', 
                                rate: rate, 
                                amount: amt,
                                itemSpecificDate: finalRowDate,
                                servedBy: servedBy,
                                locationNode: locationVal
                            });
                            totalAmt += amt;
                            summary.push(`${qty} ${iName} (${locationVal})`);
                        }
                    });
                    
                    if (hasError) return;
                    if (!items.length) return appAlert('Empty', 'Add at least one refreshment item.');

                    const id = 'event_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
                    const uniqueVendors = [...new Set(items.map(i => i.vendor).filter(Boolean))].join(', ');
                    const uniquePantryBoys = [...new Set(items.map(i => i.servedBy).filter(Boolean))].join(', ');
                    const mainDate = items[0].itemSpecificDate;

                    db.ref('eventLogs/' + id).set({
                        id,
                        canteenSource: uniqueVendors,
                        orderedBy: orderedBy,
                        servedByName: uniquePantryBoys,
                        eventName: purpose,
                        date: mainDate,
                        time: new Date().toTimeString().slice(0, 5),
                        items: items,
                        amount: totalAmt,
                        pantryName: uniquePantryBoys,
                        refreshmentSummary: summary.join(', '),
                        showNotification: document.getElementById(prefix + 'ShowNotification').checked,
                        guestSlipCreated: document.getElementById(prefix + 'CheckGuestSlipCreated_Yes')?.checked || false,
                        guestSlipSigned: document.getElementById(prefix + 'CheckGuestSlipSigned_Yes')?.checked || false,
                        guestSlipReturned: document.getElementById(prefix + 'CheckGuestSlipReturned_Yes')?.checked || false
                    }).then(() => {
                        appAlert('Success', `Meeting saved successfully!`);
                        orderedByInput.value = '';
                        document.getElementById(prefix + 'MeetingPurpose').value = '';
                        container.innerHTML = '';
                        window.addMeetingItemRow(prefix, false);

            window.calcMeetingTotal = function(prefix) {
                const container = document.getElementById(prefix + 'MeetingItemsContainer');
                const display = document.getElementById(prefix + 'MeetingCalcDisplay');

                let total = 0;
                container.querySelectorAll('.entry-card').forEach(row => {
                    const q = Number(row.querySelector('.item-qty').value) || 0;
                    const r = parseFloat(row.querySelector('.item-rate').value) || 0;
                    total += q * r;
                });
                display.innerText = "₹ " + total.toFixed(2);
            };

                        updates[month + '/' + dept2 + '/' + dateStr + '/' + shift + '/' + drink] = null;

                const cellCenter = { alignment: { horizontal: "center", vertical: "center" } };

            window.masterImportWorkersTea = async function(event) {
                const file = event.target.files[0];
                if (!file) return;
                const targetMonth = document.getElementById('workersTeaMonthPicker').value;
                if(!targetMonth) return appAlert('Error', 'Please select a month first.');

                appAlert('Reading File', 'Extracting combined data (Housekeeping, Garden, Security)...');
                try {
                    const data = await file.arrayBuffer();
                    const wb = XLSX.read(data, { cellDates: true });
                    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" });
                    if (rows.length < 3) throw new Error("Invalid format.");

                    const [targetYY, targetMM] = targetMonth.split('-');
                    let validRows = 0;
                    
                    const newMonthData = { Housekeeping: {}, Garden: {}, Security: {} };

                    for (let r = 2; r < rows.length; r++) {
                        const row = rows[r];
                        let rawDate = row[0];
                        if (!rawDate || String(rawDate).trim().toLowerCase() === 'total') continue;
                        
                        let formattedDMY = window.parseExcelDateToDMY(rawDate);
                        if (!formattedDMY) continue;
                        
                        const parts = formattedDMY.split('/');
                        if (parts.length === 3 && parts[1] === targetMM && parts[2] === targetYY) {
                            const dateStr = `${parts[2]}-${parts[1]}-${parts[0]}`;
                            
                            const parseVal = (v) => { const n = parseInt(v, 10); return isNaN(n) ? 0 : n; };

                            const hkTea = parseVal(row[2]); const hkCof = parseVal(row[3]);
                            if (hkTea > 0 || hkCof > 0) {
                                newMonthData.Housekeeping[dateStr] = {};
                                if (hkTea > 0) newMonthData.Housekeeping[dateStr].tea = hkTea;
                                if (hkCof > 0) newMonthData.Housekeeping[dateStr].coffee = hkCof;
                            }

                            const gdTea = parseVal(row[4]); const gdCof = parseVal(row[5]);
                            if (gdTea > 0 || gdCof > 0) {
                                newMonthData.Garden[dateStr] = {};
                                if (gdTea > 0) newMonthData.Garden[dateStr].tea = gdTea;
                                if (gdCof > 0) newMonthData.Garden[dateStr].coffee = gdCof;
                            }

                            const secDayTea = parseVal(row[6]); const secDayCof = parseVal(row[7]);
                            const secNightTea = parseVal(row[8]); const secNightCof = parseVal(row[9]);
                            if (secDayTea > 0 || secDayCof > 0 || secNightTea > 0 || secNightCof > 0) {
                                newMonthData.Security[dateStr] = {};
                                if (secDayTea > 0 || secDayCof > 0) {
                                    newMonthData.Security[dateStr].Day = {};
                                    if (secDayTea > 0) newMonthData.Security[dateStr].Day.tea = secDayTea;
                                    if (secDayCof > 0) newMonthData.Security[dateStr].Day.coffee = secDayCof;
                                }
                                if (secNightTea > 0 || secNightCof > 0) {
                                    newMonthData.Security[dateStr].Night = {};
                                    if (secNightTea > 0) newMonthData.Security[dateStr].Night.tea = secNightTea;
                                    if (secNightCof > 0) newMonthData.Security[dateStr].Night.coffee = secNightCof;
                                }
                            }
                            validRows++;
                        }
                    }
                    
                    if(validRows > 0) {
                        const updates = {};
                        // આ લાઈનથી આખા મહિનાનો જૂનો ખરાબ ડેટા ડીલીટ થઈને 100% નવો જ ડેટા સેવ થશે!
                        updates[`Workers_Tea/${targetMonth}/Housekeeping`] = newMonthData.Housekeeping;
                        updates[`Workers_Tea/${targetMonth}/Garden`] = newMonthData.Garden;
                        updates[`Workers_Tea/${targetMonth}/Security`] = newMonthData.Security;
                        
                        await db.ref().update(updates);
                        appAlert('Success', `✅ Extracted ${validRows} rows.\nAll old duplicate entries are cleared and new data is saved!`);
                        loadWorkersTeaData(targetMonth);
                    } else {
                        appAlert('Notice', 'No valid numeric dates found matching the selected month ('+targetMonth+').');
                    }
                } catch (err) { appAlert('Error', err.message); } finally { if (event.target) event.target.value = ''; }
            };
            window.downloadWorkersTeaFormat = function(dept, month) {
                const [yy, mm] = month.split('-');
                const daysInMonth = new Date(yy, mm, 0).getDate();
                const isSec = dept === 'Security';
                
                const row0 = isSec ? ["Date", "Day", "Day Shift", "", "Night Shift", ""] : ["Date", "Day", dept, ""];
                const row1 = isSec ? ["", "", "Tea", "Coffee", "Tea", "Coffee"] : ["", "", "Tea", "Coffee"];
                const data = [row0, row1];
                
                for (let d = 1; d <= daysInMonth; d++) {
                    const dd = String(d).padStart(2,'0');
                    const dObj = new Date(yy, mm - 1, d);
                    if(isSec) data.push([`${dd}/${mm}/${yy}`, dObj.toLocaleDateString('en-US',{weekday:'long'}), "", "", "", ""]);
                    else data.push([`${dd}/${mm}/${yy}`, dObj.toLocaleDateString('en-US',{weekday:'long'}), "", ""]);
                }
                
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.aoa_to_sheet(data);
                ws['!merges'] = isSec ? [{s:{r:0,c:2},e:{r:0,c:3}}, {s:{r:0,c:4},e:{r:0,c:5}}] : [{s:{r:0,c:2},e:{r:0,c:3}}];
                
                for (let R = 0; R < data.length; ++R) {
                    for (let C = 0; C < data[R].length; ++C) {
                        let ref = XLSX.utils.encode_cell({c:C, r:R});
                        if(!ws[ref]) continue;
                        ws[ref].s = { alignment: { horizontal: "center", vertical: "center" } };
                        if (R === 0 || R === 1) { ws[ref].s.font = { bold: true }; ws[ref].s.fill = { fgColor: { rgb: "F1F5F9" } }; }

                }
                ws['!cols'] = isSec ? [{wch: 12},{wch: 12},{wch: 10},{wch: 10},{wch: 10},{wch: 10}] : [{wch: 12},{wch: 12},{wch: 10},{wch: 10}];
                XLSX.utils.book_append_sheet(wb, ws, "Format");
                window.pantryDownloadExcelFile(wb, `Workers_Tea_${dept}_${yy}_${mm}.xlsx`);
            };

                        <button onclick="window.applyPantryExcelVal('')" style="flex:1; background:#fee2e2; color:#dc3545; border:1px solid #fecaca; padding:4px 0; border-radius:4px; font-weight:bold; font-size:10px; cursor:pointer; line-height:1; min-height:32px;">✕<br>Clear</button>

                `;

                   // 🚨 નવું ફંક્શન: તારીખ અને વારને સમાન બ્લુ કલરમાં એકસાથે (21/09/2026, Mon) બતાવશે
                window.updateDailyCustomDisplay = function() {

                            disp.innerText = `${parts[2]}/${parts[1]}/${parts[0]}, ${dayName}`;
                        }

                container.innerHTML = `

                                <div class="slim-date-wrap" style="flex:1; min-width:0; position:relative; height:28px;">

                                    <!-- પારદર્શક કેલેન્ડર ઇનપુટ (ક્લિક કરતા જ ઓરિજિનલ કેલેન્ડર ખુલશે) -->

                            <button onclick="window.lgRedo()" id="btnLgRedo" class="slim-btn-undo" disabled>↪️</button>

                        ${bottomMenuHtml}
                    </div>
                `;

                // શરૂઆતમાં તારીખ સેટ કરવા માટે
                setTimeout(window.updateDailyCustomDisplay, 50);

                let currentMode = 'name';

                // ડાયનેમિક નેવિગેશન ફંક્શન
                window.changeDateBy = function(days) {
                    if (currentMode === 'name') {
                        const dateInput = document.getElementById('beverageDailyDate');
                        if (!dateInput || !dateInput.value) return;
                        const current = new Date(dateInput.value);
                        current.setDate(current.getDate() + days);
                        dateInput.value = `${current.getFullYear()}-${String(current.getMonth() + 1).padStart(2, '0')}-${String(current.getDate()).padStart(2, '0')}`;
                        window.updateDailyCustomDisplay();
                        renderBeverageModeContent('name');
                    } else {
                        const monthInput = document.getElementById('beverageMonthlyDate');
                        if (!monthInput || !monthInput.value) return;
                        const current = new Date(monthInput.value + '-01');
                        current.setMonth(current.getMonth() + days);
                        monthInput.value = `${current.getFullYear()}-${String(current.getMonth() + 1).padStart(2, '0')}`;
                        renderBeverageModeContent('date');
                    }
                };

                function switchMode(mode) {               
                    currentMode = mode;
                    const btnDaily = document.getElementById('modeNameWise');
                    const btnMonthly = document.getElementById('modeDateWise');
                    const inpDaily = document.getElementById('beverageDailyDate');
                    const dispDaily = document.getElementById('dailyDateCustomDisplay');
                    const inpMonthly = document.getElementById('beverageMonthlyDate');

                    if (mode === 'name') {
                        btnDaily.classList.add('active');
                        btnMonthly.classList.remove('active');
                        if (dispDaily) dispDaily.style.display = 'flex';
                        if (inpDaily) inpDaily.style.display = 'block';
                        if (inpMonthly) inpMonthly.classList.add('hidden');
                        const mVal = inpMonthly.value;
                        if(mVal && !inpDaily.value.startsWith(mVal)) inpDaily.value = mVal + '-01';
                        window.updateDailyCustomDisplay();
                    } else {
                        btnDaily.classList.remove('active');
                        btnMonthly.classList.add('active');
                        if (dispDaily) dispDaily.style.display = 'none';
                        if (inpDaily) inpDaily.style.display = 'none';
                        if (inpMonthly) inpMonthly.classList.remove('hidden');
                        const dVal = inpDaily.value;
                        if(dVal) inpMonthly.value = dVal.substring(0, 7);
                    }
                    renderBeverageModeContent(mode);
                }
                
                document.getElementById('modeNameWise').onclick = () => switchMode('name');
                document.getElementById('modeDateWise').onclick = () => switchMode('date');
                
                const reloadFn = () => {
                    window.updateDailyCustomDisplay();
                    renderBeverageModeContent(currentMode);

                document.getElementById('dailySupplySource').addEventListener('change', function() {

                        this.style.color = '#047857'; this.style.borderColor = '#059669';

                    reloadFn();

                        window.initPantryExcelEvents('bulkServeListContractor');
                    } else {
                        target.innerHTML = `
                            <div id="pantryMonthlyGridWrapper" style="flex:1; display:flex; flex-direction:column; overflow:hidden; min-height:0;"></div>
                        `;
                        window.openPantryLiveGrid();
                    }
                }

                window.populateServe = function() {
                    const container = document.getElementById('bulkServeListContractor');
                    if(!container) return;
                    
                    const cat = document.getElementById('entryCategory')?.value || 'All';
                    const search = document.getElementById('pantryStaffSearch')?.value.toLowerCase().trim() || '';
                    const selectedYMD = document.getElementById('beverageDailyDate')?.value || new Date().toISOString().split('T')[0];
                    const selectedDMY = convertYMDtoDMY(selectedYMD);
                    const supplySource = document.getElementById('dailySupplySource')?.value || 'Contractor';

                    let effectivePantryId = currentUser.id;
                    if(typeof getEffectivePantryId === 'function') effectivePantryId = getEffectivePantryId(currentUser.id);

                    let dayType = '';
                    if (typeof publicHolidaysData !== 'undefined' && publicHolidaysData[selectedYMD]) {
                        dayType = 'Holiday';
                    } else {
                        const dNum = new Date(selectedYMD).getDay();
                        if (dNum === 6) dayType = 'Saturday';
                        else if (dNum === 0) dayType = 'Sunday';
                    }

                    const checkCatAndSearch = (emp) => {
                        if (cat !== 'All') {
                            const empCat = (emp.category || '').trim().toLowerCase();
                            const filterCat = cat.trim().toLowerCase();
                            if (filterCat === 'outsourced' || filterCat === 'outsource') {
                                if (!empCat.includes('outsource')) return false;
                            } else if (empCat !== filterCat) {
                                return false;
                            }
                        }
                        if (search && !(emp.name || '').toLowerCase().includes(search)) return false;
                        return true;
                    };

                    let regularFiltered = employeeList.filter(emp => {
                        const isPermanentlyAssigned = emp.assignedPantryId === effectivePantryId;
                        const hasTempAccess = emp.tempPantryIds && emp.tempPantryIds[effectivePantryId] === true;
                        
                        if (!isPermanentlyAssigned && !hasTempAccess) return false;
                        if (!checkCatAndSearch(emp)) return false;
                        if (supplySource === 'DAU Direct Purchase' && emp.dauTeaEligible !== true) return false;
                        
                        if (emp.status === 'Inactive') {
                            const hasLogToday = logsData.some(l => l.employeeId === emp.id && l.date === selectedDMY);
                            if (!hasLogToday) return false;
                        }
                        return true;
                    });
                    
                    let specialFiltered = [];
                    if (dayType && typeof weekendDutiesData !== 'undefined') {
                        const dayDuties = weekendDutiesData[dayType] || {};
                        specialFiltered = employeeList.filter(emp => {
                            if (dayDuties[emp.id] !== effectivePantryId) return false;
                            if (!checkCatAndSearch(emp)) return false;
                            if (supplySource === 'DAU Direct Purchase' && emp.dauTeaEligible !== true) return false;
                            
                            if (emp.status === 'Inactive') {
                                const hasLogToday = logsData.some(l => l.employeeId === emp.id && l.date === selectedDMY);
                                if (!hasLogToday) return false;
                            }
                            return true;
                        });
                    }
                    
                    const specialIds = specialFiltered.map(e => e.id);
                    regularFiltered = regularFiltered.filter(e => !specialIds.includes(e.id));
                    
                    const formatDrinkHTML = (val) => {
                        if(!val || val === '-') return '-';
                        let v = val.toLowerCase();
                        if(v === 'tea') return '<span style="font-size:9.5px; font-weight:800;">Tea</span>';
                        if(v === 'coffee') return '<span style="font-size:9.5px; font-weight:800;">Coffee</span>';
                        if(v === 'green tea') return '<span style="color:#065F46; font-size:9.5px; font-weight:800;">Green Tea</span>';
                        if(v === 'lemon tea') return '<span style="color:#92400E; font-size:9.5px; font-weight:800;">Lemon Tea</span>';
                        if(v === 'black tea') return '<span style="color:#5B21B6; font-size:9.5px; font-weight:800;">Black Tea</span>';
                        if(v === 'black coffee') return '<span style="color:#991B1B; font-size:9.5px; font-weight:800;">Black Coffee</span>';
                        return `<span style="font-size:9.5px; font-weight:800;">${val}</span>`;
                    };

                    const buildCell = (empId, dateDMY, session, currentDrink, logId) => {
                        return `<div class="l-cell-wrap"><div class="l-cell" tabindex="0" data-emp="${empId}" data-date="${dateDMY}" data-session="${session}" data-logid="${logId || ''}" data-supply="${supplySource}" data-val="${currentDrink || ''}">${formatDrinkHTML(currentDrink)}</div><div class="fill-handle" title="Drag to copy"></div></div>`;
                    };

                    const buildRows = (empList) => {
                        return empList.map(emp => {
                            const logs = logsData.filter(l => l.employeeId === emp.id && l.date === selectedDMY && (l.supplySource === supplySource || (!l.supplySource && supplySource === 'Contractor')));
                            const morn = logs.find(l => l.session === 'Morning');
                            const aft = logs.find(l => l.session === 'Afternoon');
                            
                            const isTemp = emp.tempPantryIds && emp.tempPantryIds[effectivePantryId] === true;
                            const tempBadge = isTemp ? `<span style="background:#FEF3C7; color:#D97706; padding:1px 2px; border-radius:2px; font-size:6px; border:1px solid #FDE68A; margin-left:2px;">Guest</span>` : '';

                            // 🚨 ZERO PADDING & MARGIN (Ultra Compact Row)
                            return `
                            <div class="bulk-entry-row" style="display:flex; align-items:center; border-bottom:1px solid #E2E8F0; padding:0; min-height:24px; box-sizing:border-box; margin:0;">
                                <div style="flex:2; font-size:10px; font-weight:700; color:#1E293B; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:2px; padding-right:2px;">
                                    <div onclick="window.showEmployeePhotoPopup('${emp.id}')" style="flex:1; overflow:hidden; text-overflow:ellipsis; cursor:pointer; color:#0A56D0; line-height:1;">

                // --- SHARED EXCEL LOGIC FOR PANTRY BOY (Both Daily & Monthly) ---
                window.initPantryExcelEvents = function(scrollerId) {
                    const scroller = document.getElementById(scrollerId);
                    if (!scroller) return;

                    // 1. UNDO / REDO MEMORY LOGIC
                    window.updateLgUndoRedoUI = function() {
                        const btnU = document.getElementById('btnLgUndo');
                        const btnR = document.getElementById('btnLgRedo');
                        if(btnU) {
                            btnU.disabled = window.lgPast.length === 0;
                            btnU.style.opacity = window.lgPast.length === 0 ? '0.5' : '1';
                        }
                        if(btnR) {
                            btnR.disabled = window.lgFuture.length === 0;
                            btnR.style.opacity = window.lgFuture.length === 0 ? '0.5' : '1';
                        }
                    };

                    window.lgRecordChange = function(changes) {
                        if(window.lgIsReverting) return;
                        window.lgPast.push(changes);
                        window.lgFuture = [];
                        window.updateLgUndoRedoUI();
                    };

                    const formatDrinkHTML = (val) => {
                        if(!val || val === '-') return '-';
                        let v = val.toLowerCase();
                        if(v === 'tea') return '<span style="font-size:9.5px; font-weight:800;">Tea</span>';
                        if(v === 'coffee') return '<span style="font-size:9.5px; font-weight:800;">Coffee</span>';
                        if(v === 'green tea') return '<span style="color:#065F46; font-size:9.5px; font-weight:800;">Green Tea</span>';
                        if(v === 'lemon tea') return '<span style="color:#92400E; font-size:9.5px; font-weight:800;">Lemon Tea</span>';
                        if(v === 'black tea') return '<span style="color:#5B21B6; font-size:9.5px; font-weight:800;">Black Tea</span>';
                        if(v === 'black coffee') return '<span style="color:#991B1B; font-size:9.5px; font-weight:800;">Black Coffee</span>';
                        return `<span style="font-size:9.5px; font-weight:800;">${val}</span>`;
                    };

                    window.lgUndo = function() {
                        if(!window.lgPast.length) return;
                        const changes = window.lgPast.pop();
                        window.lgIsReverting = true;
                        
                        const redoChanges = [];
                        changes.forEach(ch => {
                            const cell = document.querySelector(`.l-cell[data-emp="${ch.emp}"][data-date="${ch.date}"][data-session="${ch.session}"]`);
                            if(cell) {
                                redoChanges.push({ emp: ch.emp, date: ch.date, session: ch.session, supply: ch.supply, logid: cell.dataset.logid, oldVal: ch.newVal, newVal: ch.oldVal });
                                cell.dataset.val = ch.oldVal;
                                cell.innerHTML = formatDrinkHTML(ch.oldVal);
                                window.saveGridCellChange(cell, ch.oldVal);
                            }
                        });
                        window.lgFuture.push(redoChanges);
                        window.lgIsReverting = false;
                        window.updateLgUndoRedoUI();
                    };

                    window.lgRedo = function() {
                        if(!window.lgFuture.length) return;
                        const changes = window.lgFuture.pop();
                        window.lgIsReverting = true;
                        
                        const undoChanges = [];
                        changes.forEach(ch => {
                            const cell = document.querySelector(`.l-cell[data-emp="${ch.emp}"][data-date="${ch.date}"][data-session="${ch.session}"]`);
                            if(cell) {
                                undoChanges.push({ emp: ch.emp, date: ch.date, session: ch.session, supply: ch.supply, logid: cell.dataset.logid, oldVal: ch.newVal, newVal: ch.oldVal });
                                cell.dataset.val = ch.oldVal;
                                cell.innerHTML = formatDrinkHTML(ch.oldVal);
                                window.saveGridCellChange(cell, ch.oldVal);
                            }
                        });
                        window.lgPast.push(undoChanges);
                        window.lgIsReverting = false;
                        window.updateLgUndoRedoUI();
                    };

                    window.clearPantrySelection = function() {
                        document.querySelectorAll('.l-cell').forEach(c => c.classList.remove('active-cell', 'cell-highlight'));
                        window.pantrySelectedCells = [];
                        window.pantryActiveCell = null;
                    };

                    window.applyPantryExcelVal = function(val) {
                        let nextCell = null;
                        if(window.pantrySelectedCells && window.pantrySelectedCells.length > 0) {
                            const changes = [];
                            window.pantrySelectedCells.forEach(c => {
                                const oldVal = c.dataset.val || '';
                                if(oldVal !== val) {
                                    changes.push({ emp: c.dataset.emp, date: c.dataset.date, session: c.dataset.session, supply: c.dataset.supply, logid: c.dataset.logid, oldVal: oldVal, newVal: val });
                                    c.dataset.val = val;
                                    c.innerHTML = formatDrinkHTML(val);
                                    window.saveGridCellChange(c, val);
                                }
                            });
                            if(changes.length) window.lgRecordChange(changes);
                            window.clearPantrySelection();
                        } else if(window.pantryActiveCell) {
                            const oldVal = window.pantryActiveCell.dataset.val || '';
                            if(oldVal !== val) {
                                window.lgRecordChange([{ emp: window.pantryActiveCell.dataset.emp, date: window.pantryActiveCell.dataset.date, session: window.pantryActiveCell.dataset.session, supply: window.pantryActiveCell.dataset.supply, logid: window.pantryActiveCell.dataset.logid, oldVal: oldVal, newVal: val }]);
                                window.pantryActiveCell.dataset.val = val;
                                window.pantryActiveCell.innerHTML = formatDrinkHTML(val);
                                window.saveGridCellChange(window.pantryActiveCell, val);
                            }
                            
                            const allCells = Array.from(document.querySelectorAll('.l-cell'));
                            const currentIndex = allCells.indexOf(window.pantryActiveCell);
                            
                            window.pantryActiveCell.classList.remove('active-cell');
                            
                            // Auto-advance logic
                            if (currentIndex >= 0 && currentIndex < allCells.length - 1) {
                                nextCell = allCells[currentIndex + 1];
                            }
                            
                            if (nextCell) {
                                window.pantryActiveCell = nextCell;
                                window.pantryActiveCell.classList.add('active-cell');
                                nextCell.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
                            } else {
                                window.pantryActiveCell = null;
                            }
                        }
                    };

                    if(!scroller.dataset.eventsBound) {
                        scroller.dataset.eventsBound = "true";
                        
                        scroller.addEventListener('click', function(e) {
                            if (e.target.classList.contains('l-cell')) {
                                window.clearPantrySelection();
                                window.pantryActiveCell = e.target;
                                window.pantryActiveCell.classList.add('active-cell');
                            }
                        });

                        document.addEventListener('keydown', function(e) {
                            if (window.pantryActiveCell) {
                                if (e.key === 'Backspace' || e.key === 'Delete') {
                                    e.preventDefault();
                                    const oldVal = window.pantryActiveCell.dataset.val || '';
                                    if(oldVal !== '') {
                                        window.lgRecordChange([{ emp: window.pantryActiveCell.dataset.emp, date: window.pantryActiveCell.dataset.date, session: window.pantryActiveCell.dataset.session, supply: window.pantryActiveCell.dataset.supply, logid: window.pantryActiveCell.dataset.logid, oldVal: oldVal, newVal: '' }]);
                                        window.pantryActiveCell.dataset.val = '';
                                        window.pantryActiveCell.innerHTML = '-';
                                        window.saveGridCellChange(window.pantryActiveCell, '');
                                    }
                                }
                            }
                        });

                        // 2D Drag Logic
                        let isDragging = false;
                        let startColIndex = -1, startRowIndex = -1;
                        let fillValue = '';
                        let scrollInterval = null;
                        let lastX = 0, lastY = 0;

                        function getEventPos(e) {
                            if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                            if (e.changedTouches && e.changedTouches.length > 0) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
                            return { x: e.clientX, y: e.clientY };
                        }

                        function handleDragStart(e) {
                            if (e.target.classList.contains('fill-handle')) {
                                e.preventDefault(); e.stopPropagation();
                                isDragging = true;
                                const wrap = e.target.closest('.l-cell-wrap');
                                const startSelect = wrap.querySelector('.l-cell');
                                fillValue = startSelect.dataset.val || '';

                                let parentCell = wrap.closest('td') || wrap.closest('div[style*="flex:1"]');
                                let parentRow = parentCell.closest('tr') || parentCell.closest('.bulk-entry-row');
                                
                                startColIndex = Array.from(parentRow.children).indexOf(parentCell);
                                startRowIndex = Array.from(parentRow.parentElement.children).indexOf(parentRow);
                                
                                window.pantrySelectedCells = [startSelect];
                                startSelect.classList.add('cell-highlight');

                                if (scrollInterval) clearInterval(scrollInterval);
                                scrollInterval = setInterval(() => {
                                    if(!isDragging) return;
                                    const rect = scroller.getBoundingClientRect();
                                    let scrolled = false;
                                    if(lastY > rect.bottom - 40) { scroller.scrollTop += 25; scrolled = true; }
                                    else if(lastY < rect.top + 40) { scroller.scrollTop -= 25; scrolled = true; }
                                    if(lastX > rect.right - 40) { scroller.scrollLeft += 25; scrolled = true; }
                                    else if(lastX < rect.left + 40) { scroller.scrollLeft -= 25; scrolled = true; }
                                    if(scrolled) processDragMove(lastX, lastY);
                                }, 40);
                            }
                        }

                        function processDragMove(clientX, clientY) {
                            const handle = document.querySelector('.active-cell + .fill-handle');
                            if(handle) handle.style.visibility = 'hidden';
                            const elem = document.elementFromPoint(clientX, clientY);
                            if(handle) handle.style.visibility = 'visible';

                            if (!elem) return;
                            let td = elem.closest('td') || elem.closest('div[style*="flex:1"]');
                            if (!td) return;
                            let tr = td.closest('tr') || td.closest('.bulk-entry-row');
                            if (!tr || !tr.parentElement) return;
                            
                            const currentColIndex = Array.from(tr.children).indexOf(td);
                            const currentRowIndex = Array.from(tr.parentElement.children).indexOf(tr);
                            const tbody = tr.parentElement;
                            
                            if(window.pantrySelectedCells) window.pantrySelectedCells.forEach(s => s.classList.remove('cell-highlight'));
                            window.pantrySelectedCells = [];
                            
                            const minRow = Math.min(startRowIndex, currentRowIndex);
                            const maxRow = Math.max(startRowIndex, currentRowIndex);
                            const minCol = Math.min(startColIndex, currentColIndex);
                            const maxCol = Math.max(startColIndex, currentColIndex);
                            
                            for (let r = minRow; r <= maxRow; r++) {
                                const row = tbody.children[r];
                                if (row) {
                                    for (let c = minCol; c <= maxCol; c++) {
                                        const targetTd = row.children[c];
                                        if (targetTd) {
                                            const sel = targetTd.querySelector('.l-cell');
                                            if (sel) {
                                                sel.classList.add('cell-highlight');
                                                window.pantrySelectedCells.push(sel);
                                            }
                                        }
                                    }
                                }
                            }
                        }

                        function handleDragMove(e) {
                            if (!isDragging) return;
                            e.preventDefault(); 
                            const pos = getEventPos(e);
                            lastX = pos.x; lastY = pos.y;
                            processDragMove(lastX, lastY);
                        }

                        function handleDragEnd(e) {
                            if (isDragging) {
                                isDragging = false;
                                clearInterval(scrollInterval);
                                if (window.pantrySelectedCells && window.pantrySelectedCells.length > 0) {
                                    const changes = [];
                                    window.pantrySelectedCells.forEach(sel => {
                                        sel.classList.remove('cell-highlight');
                                        const oldVal = sel.dataset.val || '';
                                        if (oldVal !== fillValue) {
                                            changes.push({ emp: sel.dataset.emp, date: sel.dataset.date, session: sel.dataset.session, supply: sel.dataset.supply, logid: sel.dataset.logid, oldVal: oldVal, newVal: fillValue });
                                            sel.dataset.val = fillValue;
                                            sel.innerHTML = formatDrinkHTML(fillValue);
                                            window.saveGridCellChange(sel, fillValue);
                                        }
                                    });
                                    if(changes.length) window.lgRecordChange(changes);
                                }
                                window.clearPantrySelection();
                            }
                        }

                        scroller.addEventListener('touchstart', handleDragStart, {passive: false});
                        scroller.addEventListener('mousedown', handleDragStart);
                        document.addEventListener('touchmove', handleDragMove, {passive: false});
                        document.addEventListener('mousemove', handleDragMove);
                        document.addEventListener('touchend', handleDragEnd);
                        document.addEventListener('mouseup', handleDragEnd);
                    }
                };

                renderBeverageModeContent('name');
            }

            window.previewPantryMonthlyGrid = function(month, supplySource, pantryId, categoryVal) {
                if (!month) return appAlert('Error', 'Select month.');
                const [yy, mm] = month.split('-');
                const daysInMonth = getDaysInMonth(yy, mm);
                
                // 1. Filter active employees properly + logic for category 'All'
                let emps = employeeList.filter(e => {
                    if (e.assignedPantryId !== pantryId) return false;
                    // Remove Inactive if no logs in this month
                    if (e.status === 'Inactive') {
                        const hasLogThisMonth = logsData.some(l => l.employeeId === e.id && parseDMYToYMD(l.date).startsWith(month));
                        if (!hasLogThisMonth) return false;
                    }
                    return true;
                });
                
                if (categoryVal !== 'All') {
                    const catMatch = categoryVal.trim().toLowerCase();
                    emps = emps.filter(e => {
                        const c = (e.category || '').trim().toLowerCase();
                        if (catMatch === 'outsourced' || catMatch === 'outsource') return c.includes('outsource');
                        return c === catMatch;
                    });
                }
                
                if(!emps.length) return appAlert('Notice', 'No employees found for this selection.');

                // Track individual totals
                let empTotals = {};
                emps.forEach(e => {
                    empTotals[e.id] = { tea:0, coffee:0, green:0, lemon:0, blackTea:0, blackCoffee:0, total:0 };
                });

                let html = `<div style="overflow-x:auto; background:#fff; border:1px solid #CBD5E1; border-radius:8px; box-shadow:inset 0 0 4px rgba(0,0,0,0.05);">
                    <table style="width:100%; border-collapse:separate; border-spacing:0; font-size:11px; text-align:center; min-width:${emps.length * 60 + 45}px;">
                        <thead style="background:#F1F5F9; position:sticky; top:0; z-index:3;">
                            <tr>
                                <th rowspan="2" style="border-bottom:2px solid #0A56D0; border-right:1px solid #CBD5E1; padding:6px; min-width:45px; position:sticky; left:0; background:#F1F5F9; z-index:4;">Date</th>`;
                emps.forEach(emp => {
                    let nameParts = emp.name.split(' ');
                    let shortName = nameParts[0] + (nameParts.length > 1 ? ' ' + nameParts[nameParts.length-1].charAt(0) + '.' : '');
                    html += `<th colspan="2" style="border-bottom:1px solid #CBD5E1; border-right:1px solid #CBD5E1; padding:4px; font-size:10px; color:#1E293B; line-height:1.2;">${safeStr(shortName)}</th>`;
                });
                html += `</tr><tr>`;
                emps.forEach(() => {
                    html += `<th style="border-bottom:2px solid #0A56D0; border-right:1px dashed #CBD5E1; padding:4px; font-weight:800; color:#44474E; background:#F8FAFC;">M</th>
                             <th style="border-bottom:2px solid #0A56D0; border-right:1px solid #CBD5E1; padding:4px; font-weight:800; color:#44474E; background:#F8FAFC;">A</th>`;
                });
                html += `</tr></thead><tbody>`;

                const formatDrink = (val) => {
                    if(!val || val === '-') return '-';
                    let v = val.toLowerCase();
                    if(v === 'tea') return '<span style="font-size:9px; font-weight:800;">Tea</span>';
                    if(v === 'coffee') return '<span style="font-size:9px; font-weight:800;">Coffee</span>';
                    if(v === 'green tea') return '<span style="font-size:9px; font-weight:800; color:#065F46;">Green Tea</span>';
                    if(v === 'lemon tea') return '<span style="font-size:9px; font-weight:800; color:#92400E;">Lemon Tea</span>';
                    if(v === 'black tea') return '<span style="font-size:9px; font-weight:800; color:#5B21B6;">Black Tea</span>';
                    if(v === 'black coffee') return '<span style="font-size:9px; font-weight:800; color:#991B1B;">Black Coffee</span>';
                    return `<span style="font-size:9px; font-weight:800;">${val}</span>`;
                };

                // ઓપ્ટિમાઇઝેશન: સ્પીડ વધારવા માટે Hash Map (Index) બનાવ્યું
                const fastLogMap = {};
                logsData.forEach(l => {
                    if (l.supplySource === supplySource || (!l.supplySource && supplySource === 'Contractor')) {
                        fastLogMap[l.employeeId + '_' + l.date + '_' + l.session] = l;
                    }
                });

                for (let d = 1; d <= daysInMonth; d++) {
                    const dd = String(d).padStart(2,'0');
                    const dmy = `${dd}/${mm}/${yy}`;
                    const dObj = new Date(yy, mm - 1, d);
                    const dayName = dObj.toLocaleDateString('en-US', { weekday: 'short' });
                    
                    html += `<tr><td style="border-bottom:1px solid #E2E8F0; border-right:1px solid #CBD5E1; padding:4px; font-weight:bold; position:sticky; left:0; background:#F8FAFC; z-index:1; color:#0A56D0;">${dd}<br><span style="font-size:8px; font-weight:normal; color:#64748B;">${dayName}</span></td>`;
                    
                    emps.forEach(emp => {
                        // સીધો જ ડેટા મેપમાંથી ઉપાડી લેશે (લૂપ નહિ ફરે)
                        const mLog = fastLogMap[emp.id + '_' + dmy + '_Morning'];
                        const aLog = fastLogMap[emp.id + '_' + dmy + '_Afternoon'];
                        
                        const mVal = mLog ? mLog.drink : '-';
                        const aVal = aLog ? aLog.drink : '-';
                        
                        html += `<td style="border-bottom:1px solid #E2E8F0; border-right:1px dashed #E2E8F0; padding:2px;">${formatDrink(mVal)}</td>`;
                        html += `<td style="border-bottom:1px solid #E2E8F0; border-right:1px solid #CBD5E1; padding:2px;">${formatDrink(aVal)}</td>`;
                        
                        [mVal, aVal].forEach(val => {
                            let v = (val || '').toLowerCase();
                            if(v === 'tea') empTotals[emp.id].tea++;
                            else if(v === 'coffee') empTotals[emp.id].coffee++;
                            else if(v === 'green tea') empTotals[emp.id].green++;
                            else if(v === 'lemon tea') empTotals[emp.id].lemon++;
                            else if(v === 'black tea') empTotals[emp.id].blackTea++;
                            else if(v === 'black coffee') empTotals[emp.id].blackCoffee++;
                            
                            if (v && v !== '-') empTotals[emp.id].total++;
                        });
                    });
                    html += `</tr>`;
                }
                
                // Add Individual Employee Totals Rows
                const drinksArr = [
                    { key: 'tea', label: 'Tea', color: '#1E3A8A', bg: '#EFF6FF' },
                    { key: 'coffee', label: 'Coffee', color: '#475569', bg: '#F1F5F9' },
                    { key: 'green', label: 'Green Tea', color: '#065F46', bg: '#ECFDF5' },
                    { key: 'lemon', label: 'Lemon Tea', color: '#92400E', bg: '#FFFBEB' },
                    { key: 'blackTea', label: 'Black Tea', color: '#5B21B6', bg: '#F5F3FF' },
                    { key: 'blackCoffee', label: 'Black Coffee', color: '#991B1B', bg: '#FEF2F2' }
                ];
                
                drinksArr.forEach(d => {
                    let anyDrank = false;
                    emps.forEach(e => { if(empTotals[e.id][d.key] > 0) anyDrank = true; });
                    
                    if (anyDrank) {
                        html += `<tr><td style="border-bottom:1px solid #CBD5E1; border-right:1px solid #CBD5E1; padding:4px 2px; font-weight:bold; position:sticky; left:0; background:${d.bg}; z-index:1; color:${d.color}; font-size:9px;">${d.label}</td>`;
                        emps.forEach(emp => {
                            let val = empTotals[emp.id][d.key] || '-';
                            html += `<td colspan="2" style="border-bottom:1px solid #CBD5E1; border-right:1px solid #CBD5E1; padding:4px; font-weight:800; background:${d.bg}; color:${d.color}; font-size:12px;">${val}</td>`;
                        });
                        html += `</tr>`;
                    }
                });

                html += `</tbody></table></div>`;

                const container = document.getElementById('printAreaContainer');
                container.style.zIndex = "99999999";
                
                const dateObjForTitle = new Date(month + '-01');
                const monthDisplayStr = dateObjForTitle.toLocaleString('en-US', { month: 'short', year: 'numeric' });

                container.innerHTML = `
                    <div class="preview-card" style="max-width:95vw; width:450px; height:90vh; max-height:90vh; padding:12px; border-radius:12px; display:flex; flex-direction:column; overflow:hidden; background:#F8FAFC;">
                        <div class="preview-header hide-on-print" style="margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; flex-shrink:0;">
                            <div style="display:flex; flex-direction:column; gap:4px;">
                                <h3 style="margin:0; font-size:14px; color:#0A56D0;">📊 Preview (${monthDisplayStr})</h3>
                                <input type="month" value="${month}" onchange="window.previewPantryMonthlyGrid(this.value, '${supplySource}', '${pantryId}', '${categoryVal}')" style="padding:4px 6px; border-radius:6px; border:1px solid #0A56D0; font-size:12px; font-weight:bold; color:#0A56D0; background:#fff; outline:none; max-width:140px;">
                            </div>
                            <button onclick="document.getElementById('printAreaContainer').classList.add('hidden')" style="background:#FEE2E2; border:none; color:#DC3545; padding:6px 12px; font-size:12px; border-radius:6px; font-weight:bold; cursor:pointer;">✕ Close</button>
                        </div>
                        <div class="preview-content" style="padding:0; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; flex:1; background:transparent;">
                            ${html}
                        </div>
                    </div>
                `;
                container.classList.remove('hidden');
            }

            // ============================================================

            // ============================================================
            function renderPantryBoyDailyTable() {
                const cont = document.getElementById('adminContent');
                if (!cont) return;

                const todayYMD = new Date().toISOString().split('T')[0];
                cont.innerHTML = `
              <div class="card" style="border:2px solid #0A56D0; background:#F8FAFC;">
                <h4 style="color:#0A56D0; margin:0 0 12px 0; font-size:1rem;">👨‍🍳 Pantry Boy Daily Tea Entry</h4>
                <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px;">
                  <div style="flex:2; min-width:140px;">
                    <label style="font-size:.75rem; color:#44474E; font-weight:600; display:block;">Select Pantry Boy</label>
                    <select id="pantryBoyDailySelect" style="margin:0; padding:10px 12px; border-radius:8px; border:1px solid #CBD5E1;">
                      <option value="">-- Choose --</option>
                      ${pantryTeam.map(p => `<option value="${p.id}">${safeStr(p.name)}</option>`).join('')}
                    </select>
                  </div>
                  <div style="flex:2; min-width:140px;">
                    <label style="font-size:.75rem; color:#44474E; font-weight:600; display:block;">Select Date</label>
                    <input type="date" id="pantryBoyDailyDate" value="${todayYMD}" style="margin:0; padding:10px 12px; border-radius:8px; border:1px solid #CBD5E1;">
                  </div>
                </div>
                <div id="pantryBoyDailyContainer" class="pantry-daily-table-wrap"></div>
                <button id="printPantryBoyDailyBtn" class="success" style="width:100%; margin-top:12px; padding:14px; font-size:1rem; border-radius:12px; min-height:48px;">🖨️ Print Table</button>
              </div>
            `;

                document.getElementById('pantryBoyDailySelect').addEventListener('change', function() {
                    if (this.value) loadPantryBoyDaily();
                });
                document.getElementById('pantryBoyDailyDate').addEventListener('change', function() {
                    if (document.getElementById('pantryBoyDailySelect').value) loadPantryBoyDaily();
                });

                function loadPantryBoyDaily() {
                    const pantryId = document.getElementById('pantryBoyDailySelect').value;
                    const dateVal = document.getElementById('pantryBoyDailyDate').value;
                    if (!pantryId || !dateVal) return;
                    const selectedDMY = convertYMDtoDMY(dateVal);
                    const pantryName = pantryTeam.find(p => p.id === pantryId)?.name || 'Unknown';

                    const assigned = employeeList.filter(emp => emp.assignedPantryId === pantryId);
                    if (!assigned.length) {
                        document.getElementById('pantryBoyDailyContainer').innerHTML =
                            `<p style="padding:20px; text-align:center; color:#64748B;">No employees assigned to this pantry boy.</p>`;
                        return;
                    }

                    let html =
                        `<table class="pantry-daily-table"><thead><tr><th rowspan="2" style="min-width:120px;">Date</th><th colspan="2" class="merged-header">Morning</th><th colspan="2" class="merged-header">Afternoon</th></tr><tr><th>Tea</th><th>Coffee</th><th>Tea</th><th>Coffee</th></tr></thead><tbody>`;

                    assigned.forEach(emp => {
                        const mLog = logsData.find(l => l.employeeId === emp.id && l.date === selectedDMY &&
                            l.session === 'Morning');
                        const aLog = logsData.find(l => l.employeeId === emp.id && l.date === selectedDMY &&
                            l.session === 'Afternoon');

                        const mTea = mLog && mLog.drink && mLog.drink.toLowerCase().includes('tea') ? 1 : 0;
                        const mCoffee = mLog && mLog.drink && mLog.drink.toLowerCase().includes('coffee') ?
                        1 : 0;
                        const aTea = aLog && aLog.drink && aLog.drink.toLowerCase().includes('tea') ? 1 : 0;
                        const aCoffee = aLog && aLog.drink && aLog.drink.toLowerCase().includes('coffee') ?
                        1 : 0;

                        const hasM = mLog ? mLog.drink : '';
                        const hasA = aLog ? aLog.drink : '';

                        html += `<tr>
                  <td class="date-col" style="font-weight:600; background:#F8FAFC;">${safeStr(emp.name)}</td>
                  <td>${hasM ? (mTea ? '✅' : (mCoffee ? '☕' : hasM)) : '-'}</td>
                  <td>${hasM ? (mCoffee ? '✅' : (mTea ? '☕' : hasM)) : '-'}</td>
                  <td>${hasA ? (aTea ? '✅' : (aCoffee ? '☕' : hasA)) : '-'}</td>
                  <td>${hasA ? (aCoffee ? '✅' : (aTea ? '☕' : hasA)) : '-'}</td>
                </tr>`;
                    });

                    let totalTeaM = 0,
                        totalCoffeeM = 0,
                        totalTeaA = 0,
                        totalCoffeeA = 0;
                    assigned.forEach(emp => {
                        const mLog = logsData.find(l => l.employeeId === emp.id && l.date === selectedDMY &&
                            l.session === 'Morning');
                        const aLog = logsData.find(l => l.employeeId === emp.id && l.date === selectedDMY &&
                            l.session === 'Afternoon');
                        if (mLog) {
                            const d = (mLog.drink || '').toLowerCase();
                            if (d.includes('tea')) totalTeaM++;
                            else if (d.includes('coffee')) totalCoffeeM++;
                        }
                        if (aLog) {
                            const d = (aLog.drink || '').toLowerCase();
                            if (d.includes('tea')) totalTeaA++;
                            else if (d.includes('coffee')) totalCoffeeA++;
                        }
                    });

                    html += `<tr style="font-weight:700; background:#EFF6FF; border-top:2px solid #0A56D0;">
                <td style="text-align:right; padding-right:12px;">TOTAL</td>
                <td>${totalTeaM}</td>
                <td>${totalCoffeeM}</td>
                <td>${totalTeaA}</td>
                <td>${totalCoffeeA}</td>
              </tr>`;
                    html += `</tbody></table>`;

                    const container = document.getElementById('pantryBoyDailyContainer');
                    container.innerHTML = html;

                    const header = document.createElement('div');
                    header.style.cssText =
                        'padding:10px 12px; background:#F8FAFC; border-bottom:2px solid #0A56D0; font-weight:700; color:#0A56D0; font-size:1rem; display:flex; justify-content:space-between; flex-wrap:wrap;';
                    header.innerHTML =
                        `<span>🧑‍🍳 ${safeStr(pantryName)}</span><span>📅 ${getFullDateWithDay(selectedDMY)}</span>`;
                    container.prepend(header);
                }

                document.getElementById('printPantryBoyDailyBtn').onclick = function() {
                    const container = document.getElementById('pantryBoyDailyContainer');
                    const content = container.innerHTML;
                    if (!content || content.trim() === '') return appAlert('Error', 'Load data first.');

                    showPrintPreview(content);
                };

                function showPrintPreview(content) {
                    const container = document.getElementById('printAreaContainer');
                    container.innerHTML = `
                <div class="preview-card">
                  <div class="preview-header hide-on-print">
                    <button onclick="window.print()" class="success" style="font-size:.9rem; padding:10px 18px; border-radius:10px; min-height:40px;">🖨️ Print</button>
                    <button onclick="document.getElementById('printAreaContainer').classList.add('hidden')" class="danger" style="font-size:.9rem; padding:10px 18px; border-radius:10px; min-height:40px;">✕ Cancel</button>
                  </div>
                  <div class="preview-content">
                    <div style="text-align:center; margin-bottom:16px;">
                      <h2 style="color:#0A56D0; font-size:1.5rem;">DAU PANTRY - DAILY TEA ENTRY</h2>
                      <div style="font-weight:600; font-size:1rem;">${content.match(/<div[^>]*>([^<]*)<\/div>/)?.[1] || ''}</div>
                    </div>
                    <table class="print-table">${content.replace(/<div[^>]*>.*?<\/div>/, '')}</table>
                    <p style="margin-top:20px; font-size:12px; color:#64748B; text-align:center;">Generated on: ${new Date().toLocaleString()}</p>
                  </div>
                </div>
              `;
                    container.classList.remove('hidden');
                }

                setTimeout(() => {
                    const sel = document.getElementById('pantryBoyDailySelect');
                    if (sel && sel.value) {
                        loadPantryBoyDaily();
                    }
                }, 300);
            }

            // ============================================================
            //  LEAVE MANAGEMENT WITH DUTY ASSIGNMENT
            // ============================================================
            function renderLeaveControlRoom() {
                const container = document.getElementById('leaveControlRoomContainer');
                if (!container) return;
                if (!pantryTeam.length) { container.innerHTML =
                    `<p style="font-size:.85rem; color:#74777F; padding:8px;">No pantry staff to manage.</p>`; return; }

                db.ref('leaveAssignments').on('value', snap => {
                    leaveAssignments = snap.val() || {};
                    renderLeaveList();
                });

                function renderLeaveList() {
                    container.innerHTML = pantryTeam.map(p => {
                        const isOnLeave = p.onLeave === true;
                        const statusText = isOnLeave ? '🔴 On Leave' : '🟢 Active';
                        const statusColor = isOnLeave ? '#DC3545' : '#146C43';
                        const assignedTo = leaveAssignments[p.id];
                        const assignedName = assignedTo ? pantryTeam.find(pt => pt.id === assignedTo)
                            ?.name || 'Unknown' : 'None';

                        return `
                    <div style="display:flex; flex-direction:column; padding:12px; background:#fff; border-radius:12px; margin-bottom:8px; border:1px solid ${isOnLeave ? '#FECACA' : '#E2E8F0'};">
                      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
                        <div><strong style="color:${isOnLeave ? '#94A3B8' : '#1E293B'};">${safeStr(p.name)}</strong>
                          <span style="font-size:.75rem; color:${statusColor}; font-weight:600; margin-left:8px;">${statusText}</span>
                          ${assignedTo ? `<span style="font-size:.7rem; color:#0A56D0; font-weight:600; margin-left:8px;">→ Duty: ${assignedName}</span>` : ''}
                        </div>
                        <div style="display:flex; gap:6px; flex-wrap:wrap;">
                          <button onclick="window.togglePantryLeave('${p.id}')" style="background:${isOnLeave ? '#146C43' : '#DC3545'}; color:#fff; border:none; padding:4px 14px; border-radius:8px; font-size:.78rem; min-height:30px; cursor:pointer;">${isOnLeave ? '🔄 Mark Active' : '⏸ Set Leave'}</button>
                          ${isOnLeave ? `<button onclick="window.openLeaveAssignPopup('${p.id}')" style="background:#0A56D0; color:#fff; border:none; padding:4px 14px; border-radius:8px; font-size:.78rem; min-height:30px; cursor:pointer;">📋 Assign Duty</button>` : ''}
                          ${assignedTo ? `<button onclick="window.clearLeaveAssignment('${p.id}')" style="background:#D97706; color:#fff; border:none; padding:4px 14px; border-radius:8px; font-size:.78rem; min-height:30px; cursor:pointer;">✕ Clear</button>` : ''}
                        </div>
                      </div>
                    </div>
                  `;
                    }).join('');
                }
            }

            window.togglePantryLeave = function(id) {
                const p = pantryTeam.find(pt => pt.id === id);
                if (!p) return;
                const newStatus = !p.onLeave;
                db.ref('pantryTeam/' + id).update({ onLeave: newStatus });
                if (!newStatus) {
                    db.ref('leaveAssignments/' + id).remove();
                }
                appAlert('Updated', `${p.name} status changed.`);
            };

            window.openLeaveAssignPopup = function(id) {

                function renderLocationList() {
                    const deptFilter = document.getElementById('locDeptFilter').value;
                    const search = document.getElementById('locSearchInput').value.toLowerCase().trim();

                    let html = '';
                    const activeEmps = employeeList.filter(e => e.status !== 'Inactive');
                    
                    // સોર્ટિંગ: જે પહેલેથી લોકેશનમાં છે એ સૌથી ઉપર દેખાશે
                    const sortedEmps = activeEmps.sort((a, b) => {
                        if (a.locationNode === locationName && b.locationNode !== locationName) return -1;
                        if (a.locationNode !== locationName && b.locationNode === locationName) return 1;
                        return (a.name || '').localeCompare(b.name || '');
                    });

                    const filtered = sortedEmps.filter(emp => {
                        if (deptFilter && emp.department !== deptFilter) return false;
                        if (search && !(emp.name || '').toLowerCase().includes(search)) return false;
                        return true;
                    });

                    filtered.forEach(emp => {

                        const currentLoc = emp.locationNode || 'No Location Assigned';

                              <span style="font-size:16px;">✅</span>
                            </div>`;
                        } else {
                            html += `
                            <label style="padding:10px 14px; margin:4px 0; background:#FFF; border-radius:8px; border:1px solid #CBD5E1; display:flex; justify-content:space-between; align-items:center; cursor:pointer;">
