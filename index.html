        if (!name || !orderedBy) return appAlert('Error', 'Organizer and Event Purpose are required.');

        const newItems = [];
        let finalTotalAmount = 0;
        const summarySegments = [];
        let hasError = false;

        itemsContainer.querySelectorAll('.dynamic-item-row-edit').forEach((row, index) => {
            const dateVal = row.querySelector('.e-item-date').value;
            const locVal = row.querySelector('.e-item-location').value.trim();
            const vdr = row.querySelector('.e-item-vendor').value.trim();
            const iName = row.querySelector('.e-item-name').value.trim();
            const iQty = parseInt(row.querySelector('.e-item-qty').value, 10) || 0;
            const iRate = parseFloat(row.querySelector('.e-item-rate').value) || 0;
            const srv = row.querySelector('.e-item-served-by').value.trim();

            if (iName && iQty > 0) {
                if (!dateVal) { appAlert('Error', `Select Date for item ${index+1}`); hasError = true; }
                if (!locVal) { appAlert('Error', `Enter Location for item ${index+1}`); hasError = true; }
                if (!vdr) { appAlert('Error', `Select Vendor for item ${index+1}`); hasError = true; }
                if (!srv) { appAlert('Error', `Select Pantry Boy for item ${index+1}`); hasError = true; }

                const finalRowDate = convertYMDtoDMY(dateVal);
                const itemAmt = iQty * iRate;
                
                finalTotalAmount += itemAmt;

                }

                const vKey = vdr.toLowerCase().trim();
                const currentCatalog = vendorItemsCatalog[vKey] || [];
                if (!currentCatalog.some(it => it.name.toLowerCase() === iName.toLowerCase())) {
                    currentCatalog.push({ name: iName, rate: iRate });
                    db.ref('vendorItems/' + vKey).set(currentCatalog);
                }

                newItems.push({
                    vendor: vdr,
                    type: '🍪 Snacks/Food',
                    name: iName,
                    qty: iQty,
                    unit: 'Nos',
                    rate: iRate,
                    amount: itemAmt,
                    itemSpecificDate: finalRowDate,
                    servedBy: srv,
                    locationNode: locVal
                });
            }
        });

        if (hasError) return;
        if (!newItems.length) return appAlert('Error', 'Please add at least one valid item.');

        const uniqueVendors = [...new Set(newItems.map(i => i.vendor).filter(Boolean))].join(', ');
        const uniquePantryBoys = [...new Set(newItems.map(i => i.servedBy).filter(Boolean))].join(', ');
        const mainDate = newItems[0].itemSpecificDate;

        db.ref('eventLogs/' + id).update({
            eventName: name,
            orderedBy: orderedBy,
            amount: finalTotalAmount,
            refreshmentSummary: summarySegments.join(', '),
            date: mainDate,
            canteenSource: uniqueVendors,
            servedByName: uniquePantryBoys,
            pantryName: uniquePantryBoys,
            items: newItems,
            guestSlipCreated: document.getElementById('editEvtGuestSlipCreated').checked,
            guestSlipSigned: document.getElementById('editEvtGuestSlipSigned').checked,
            guestSlipReturned: document.getElementById('editEvtGuestSlipReturned').checked
        }).then(() => {
            modal.remove();
            appAlert('Updated', 'Meeting Event completely updated!');
            
            setTimeout(() => {
                if (typeof renderAdminMeetingHistory === 'function' && document.getElementById('adminMeetingHistoryTable')) {
                    renderAdminMeetingHistory();
                }
                if (typeof window.openEventHistoryModal === 'function') {
                    window.openEventHistoryModal();
                }
            }, 300);
        }).catch(err => {
            appAlert('Error', 'Update failed: ' + err.message);
        });
    };
};

window.renderWeekendDutyInterface = function() {
    const pSelect = document.getElementById('wDutyPantrySelect');
    const dSelect = document.getElementById('wDutyDayType');
    const searchInp = document.getElementById('wDutyEmpSearch');
    const selectAll = document.getElementById('wDutySelectAll');
    const listContainer = document.getElementById('wDutyEmployeeList');
    function populateList() {
        const pId = pSelect.value;
        const dayType = dSelect.value;
        const q = searchInp.value.toLowerCase().trim();

        if(!pId) {
            listContainer.innerHTML = '<p style="padding:12px; text-align:center; color:#64748B; font-size:12px;">Please select the pantry boy from above.</p>';
            return;
        }

        const filtered = employeeList.filter(e => !q || (e.name || '').toLowerCase().includes(q));
        if(!filtered.length) {
            listContainer.innerHTML = '<p style="padding:12px; text-align:center; color:#64748B; font-size:12px;">No employees match search.</p>';
            return;
        }

        listContainer.innerHTML = filtered.map(emp => {
            const currentAllottedPantry = weekendDutiesData[dayType]?.[emp.id] || '';
            const isChecked = currentAllottedPantry === pId ? 'checked' : '';
            const otherPantryName = currentAllottedPantry && currentAllottedPantry !== pId ? 
                ` <span style="color:#D97706; font-weight:bold;">(Allotted: ${pantryTeam.find(p=>p.id===currentAllottedPantry)?.name || 'Other'})</span>` : '';

            return `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 8px; border-bottom:1px solid #E2E8F0; font-size:12px;">
                    <span><strong>${safeStr(emp.name)}</strong> <small style="color:#64748B;">[${emp.category}]</small>${otherPantryName}</span>
                    <input type="checkbox" class="w-emp-duty-check" data-id="${emp.id}" ${isChecked} style="width:16px; height:16px; accent-color:#0A56D0;">
                </div>
            `;
        }).join('');
    }
        // 📋 લાઈવ સમરી બોર્ડ રેન્ડર કરવાનું ફંક્શન (નીચે લિસ્ટ બતાવશે)
    function renderLiveDutySummary() {
        const summaryContainer = document.getElementById('wDutyLiveSummaryContainer');
        if(!summaryContainer) return;

        const dayTypes = ['Saturday', 'Sunday', 'Holiday'];
        let hasAnyData = false;
        let html = '';

        dayTypes.forEach(day => {
            const dayDuties = weekendDutiesData[day] || {};
            const empIds = Object.keys(dayDuties);

            if(empIds.length > 0) {
                hasAnyData = true;

                // પેન્ટ્રી બોય વાઇઝ ગ્રુપ બનાવવું
                const groupedByPantry = {};
                empIds.forEach(empId => {
                    const pId = dayDuties[empId];
                    if(!groupedByPantry[pId]) groupedByPantry[pId] = [];
                    const empObj = employeeList.find(e => e.id === empId);
                    if(empObj) groupedByPantry[pId].push({ id: empObj.id, name: empObj.name }); // નવી લાઈન
                });

                let dayBadgeBg = day === 'Saturday' ? '#3B82F6' : (day === 'Sunday' ? '#EF4444' : '#10B981');

                html += `
                    <div style="margin-bottom:12px; border:1px solid #E2E8F0; border-radius:8px; overflow:hidden;">
                        <div style="background:${dayBadgeBg}; color:#fff; padding:6px 10px; font-weight:bold; font-size:12px;">
                            📌 ${day} Duty Assignments
                        </div>
                        <div style="padding:6px 8px; background:#FAFAFA;">
                `;

                for (const pId in groupedByPantry) {
                    const pantryName = pantryTeam.find(p => p.id === pId)?.name || 'Unknown Staff';
                    const empsList = groupedByPantry[pId];

                    // દરેક નામની બાજુમાં ડિલીટ બટન ઉમેર્યું
                    const empBadges = empsList.map(e => `
                        <span style="display:inline-flex; align-items:center; background:#EFF6FF; border:1px solid #BFDBFE; color:#1E40AF; padding:2px 6px; border-radius:4px; margin:2px;">
                            ${e.name}
                            <button onclick="window.removeSingleDuty('${e.id}', '${day}')" style="background:transparent; border:none; color:#DC3545; margin-left:4px; cursor:pointer; font-size:10px; font-weight:bold;">✕</button>
                        </span>
                    `).join('');

                    html += `
                        <div style="background:#fff; border:1px solid #CBD5E1; border-radius:6px; padding:8px; margin-bottom:6px;">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; border-bottom:1px dashed #CBD5E1; padding-bottom:4px;">
                                <strong style="color:#0A56D0; font-size:13px;">🧑‍🍳 ${pantryName} <span style="color:#64748B; font-size:11px;">(${empsList.length} Employees)</span></strong>
                                <div>
                                    <button onclick="window.quickEditDutyRoster('${pId}', '${day}')" style="background:#E2E8F0; color:#0A56D0; border:none; padding:3px 8px; border-radius:4px; font-size:11px; cursor:pointer; font-weight:bold; margin-right:4px;">✏️ Edit</button>
                                    <button onclick="window.clearPantryDayDuty('${pId}', '${day}')" style="background:#FEE2E2; color:#DC3545; border:none; padding:3px 8px; border-radius:4px; font-size:11px; cursor:pointer; font-weight:bold;">🗑 Clear</button>
                                </div>
                            </div>
                            <div style="color:#334155; font-size:11px; line-height:1.4; display:flex; flex-wrap:wrap;">
                                ${empBadges}
                            </div>
                        </div>
                    `;
                }

                html += `</div></div>`;
            }
        });

        if(!hasAnyData) {
            summaryContainer.innerHTML = '<p style="padding:12px; text-align:center; color:#94A3B8;">Currently, there are no duties allocated for Saturdays, Sundays, or holidays.</p>';
        } else {
            summaryContainer.innerHTML = html;
        }
    }


    pSelect.onchange = populateList;

// 🔒 પેન્ટ્રી બોય લોકિંગ એન્જિન હૂક - જેને ડ્યુટી નથી એને એન્ટ્રી ના કરવા દેવી
window.checkPantryBoyDutyAccessToday = function(pantryId) {
    const today = new Date();
    const dayNum = today.getDay(); // 0 = Sunday, 6 = Saturday
    const ymdToday = today.toISOString().split('T')[0];

    let currentDayType = '';
    if (publicHolidaysData[ymdToday]) {
        currentDayType = 'Holiday';
    } else if (dayNum === 6) {
        currentDayType = 'Saturday';
    } else if (dayNum === 0) {
        currentDayType = 'Sunday';
    }

    // જો આજનો દિવસ નોર્મલ ચાલુ દિવસ હોય (સોમ થી શુક્ર) તો ઓપન રાખવું
    if(!currentDayType) return { allowed: true };

    // જો શનિ/રવિ/રજા હોય, તો ચેક કરો કે આ પેન્ટ્રી બોય પાસે કોઈ એમ્પ્લોયી અલોટ થયેલો છે?
    const dayDuties = weekendDutiesData[currentDayType] || {};
    const isAssigned = Object.values(dayDuties).includes(pantryId);

    if(isAssigned) {
        return { allowed: true, type: currentDayType };
    } else {
        return { allowed: false, type: currentDayType };
    }
};

            // નવો Date Parser કોડ (તારીખ અને ટાઈમઝોનનો પ્રોબ્લેમ સોલ્વ કરવા માટે)
            window.parseExcelDateToDMY = function(rawDate) {
                try {
                    if (rawDate === undefined || rawDate === null || rawDate === '') return '';
                    
                    // 1. જો તારીખ Date Object હોય (Excel માંથી ડાયરેક્ટ)
                    if (rawDate instanceof Date && !isNaN(rawDate)) { 
                        // અહીંયા getUTCDate નો ઉપયોગ કર્યો છે જેથી તારીખ પાછળ ના જતી રહે
                        const dd = String(rawDate.getUTCDate()).padStart(2,'0'); 
                        const mm = String(rawDate.getUTCMonth()+1).padStart(2,'0'); 
                        const yyyy = rawDate.getUTCFullYear(); 
                        return `${dd}/${mm}/${yyyy}`; 
                    }
                    
                    // 2. જો તારીખ Excel Serial Number હોય
                    if (typeof rawDate === 'number' && !isNaN(rawDate)) { 
                        if (rawDate > 59 && rawDate < 60000) { 
                            const utc_days = Math.floor(rawDate - 25569); 
                            const utc_value = utc_days * 86400; 
                            const date_info = new Date(utc_value * 1000); 
                            const dd = String(date_info.getUTCDate()).padStart(2,'0'); 
                            const mm = String(date_info.getUTCMonth()+1).padStart(2,'0'); 
                            const yyyy = date_info.getUTCFullYear(); 
                            if (yyyy > 1900 && yyyy < 2100) return `${dd}/${mm}/${yyyy}`; 
                        } 
                    }
                    
                    // 3. જો તારીખ String ફોર્મેટમાં હોય
                    let str = String(rawDate).trim(); 
                    if (!str) return ''; 
                    
                    if (str.includes('/')) { 
                        const parts = str.split('/').map(p=>p.trim()); 
                        if (parts.length === 3) { 
                            if (parts[2].length === 2) parts[2] = '20' + parts[2];
                            if (parts[2].length === 4) {
                                // DD/MM/YYYY ને સીધું જ પકડી લેશે (ઉલટ-સુલટ નહિ કરે)
                                return `${parts[0].padStart(2,'0')}/${parts[1].padStart(2,'0')}/${parts[2]}`;
                            }
                        } 
                    }
                    
                    if (str.includes('-')) { 
                        const parts = str.split('-').map(p=>p.trim()); 
                        if (parts.length === 3) { 
                            if (parts[2].length === 2) parts[2] = '20' + parts[2];
                            if (parts[2].length === 4) return `${parts[0].padStart(2,'0')}/${parts[1].padStart(2,'0')}/${parts[2]}`; 
                            if (parts[0].length === 4) return `${parts[2].padStart(2,'0')}/${parts[1].padStart(2,'0')}/${parts[0]}`; 
                        } 
                    }
                    
                    // 4. છેલ્લો ઓપ્શન (Fallback)
                    const d = new Date(str); 
                    if (!isNaN(d) && d.getFullYear() > 1900) { 
                        const dd = String(d.getDate()).padStart(2,'0'); 
                        const mm = String(d.getMonth()+1).padStart(2,'0'); 
                        const yyyy = d.getFullYear(); 
                        return `${dd}/${mm}/${yyyy}`; 
                    } 
                    return '';
                } catch(e) { return ''; }
            };

            // ============================================================

            window.downloadMgFormat = function() {
                try {
                    const sampleData = [
                        ["Date", "Time", "Item", "Qty", "Rate", "Amount", "Requisitioner's Name", "Purpose", "Location", "Vendor", "Served By"],
                        ["15-08-2026", "09:30", "Tea", 10, 15, 150, "Admin Dept", "NAAC Meeting", "Conference Hall", "IA Caterers", "Ramesh"],
                        ["16-08-2026", "14:00", "Samosa", 10, 20, 200, "Admin Dept", "Audit Meeting", "Room 101", "DAU Direct Purchase", "Suresh"]
                    ];
                    const ws = XLSX.utils.aoa_to_sheet(sampleData);
                    ws['!cols'] = [{wch:12},{wch:8},{wch:18},{wch:8},{wch:8},{wch:10},{wch:20},{wch:20},{wch:15},{wch:15},{wch:15}];
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "Meeting_Format");
                    window.pantryDownloadExcelFile(wb, "Meeting_Excel_Format.xlsx");
                } catch(err) {
                    appAlert('Download Error', err.message);
                }
            };

            window.handleMgExcelUpload = function(event) {
                const file = event.target.files[0];
                if (!file) return;
                
                appAlert('Reading File', 'Extracting Meeting entries from Excel...');
                
                const reader = new FileReader();
                
                reader.onload = async function(e) {
                    try {
                        const data = e.target.result;
                        const wb = XLSX.read(data, { type: 'array', cellDates: true, raw: false });
                        const sheet = wb.Sheets[wb.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });

                        if (!rows || rows.length === 0) throw new Error("Excel file is empty.");

                        const updates = {};
                        let importCount = 0;

                        rows.forEach((row, idx) => {
                            const getVal = (keys) => {
                                for (let k in row) {
                                    const cleanKey = k.toString().trim().toLowerCase();
                                    if (keys.some(key => cleanKey.includes(key.toLowerCase()))) return row[k];
                                }
                                return '';
                            };

                            let rawDate = getVal(['date']);
                            let timeVal = String(getVal(['time'])).trim() || '09:00';
                            let itemName = String(getVal(['item'])).trim();
                            let qty = Number(getVal(['qty', 'quantity'])) || 1;
                            let rate = Number(getVal(['rate'])) || 0;
                            let amount = Number(getVal(['amount'])) || (qty * rate);
                            let reqName = String(getVal(['requisitioner', 'ordered', 'req'])).trim() || 'General';
                            let purpose = String(getVal(['purpose', 'event'])).trim() || 'Meeting';
                            let location = String(getVal(['location', 'venue'])).trim() || 'Campus';
                            let vendor = String(getVal(['vendor', 'canteen'])).trim() || 'Various';
                            let servedBy = String(getVal(['served', 'pantry'])).trim() || 'Multiple Pantry Boys';

                            if (!itemName) return; 

                            // Time ફોર્મેટ 09:30 જેવું સેટ કરવું
                            if (timeVal.length > 5) timeVal = timeVal.substring(0,5);
// 100% BULLETPROOF DATE PARSER FOR EXCEL
                            let formattedDMY = '';
                            let rawYMD = '';

                            if (typeof rawDate === 'number') {
                                // Excel ના Serial Number ને સીધો જ તારીખમાં ફેરવશે (No Timezone Issues)
                                const date_info = new Date((rawDate - 25569) * 86400 * 1000);
                                const dd = String(date_info.getUTCDate()).padStart(2, '0');
                                const mm = String(date_info.getUTCMonth() + 1).padStart(2, '0');
                                const yyyy = date_info.getUTCFullYear();
                                formattedDMY = `${dd}-${mm}-${yyyy}`;
                                rawYMD = `${yyyy}-${mm}-${dd}`;
                            } else if (rawDate instanceof Date && !isNaN(rawDate)) {
                                // 12 કલાક આગળ કરીને દિવસ બદલાતો અટકાવશે
                                const safeDate = new Date(rawDate.getTime() + (12 * 60 * 60 * 1000));
                                const dd = String(safeDate.getUTCDate()).padStart(2, '0');
                                const mm = String(safeDate.getUTCMonth() + 1).padStart(2, '0');
                                const yyyy = safeDate.getUTCFullYear();
                                formattedDMY = `${dd}-${mm}-${yyyy}`;
                                rawYMD = `${yyyy}-${mm}-${dd}`;
                            } else if (typeof rawDate === 'string' && rawDate.trim() !== '') {
                                // જો એક્સેલમાંથી ટેક્સ્ટ તરીકે આવે તો 
                                let str = rawDate.trim().replace(/\//g, '-'); 
                                const p = str.split('-');
                                if (p.length === 3) {
                                    if (p[0].length === 4) { 
                                        rawYMD = `${p[0]}-${p[1].padStart(2,'0')}-${p[2].padStart(2,'0')}`;
                                        formattedDMY = `${p[2].padStart(2,'0')}-${p[1].padStart(2,'0')}-${p[0]}`;
                                    } else { 
                                        rawYMD = `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
                                        formattedDMY = `${p[0].padStart(2,'0')}-${p[1].padStart(2,'0')}-${p[2]}`;
                                    }
                                }
                            }

                            if (!formattedDMY || !rawYMD) {
                                const t = new Date();
                                const dd = String(t.getDate()).padStart(2, '0');
                                const mm = String(t.getMonth() + 1).padStart(2, '0');
                                const yyyy = t.getFullYear();
                                formattedDMY = `${dd}-${mm}-${yyyy}`;
                                rawYMD = `${yyyy}-${mm}-${dd}`;
                            }

                            const cleanStr = (str) => (str || '').replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
                            
                            // STRICT DUPLICATE CHECKER FOR EXCEL UPLOAD
                            const isDuplicate = mgRecordsData.some(existing => {
                                if (existing.Status === 'Review') return false;
                                if (existing.RawDate !== rawYMD) return false; // Date must match
                                
                                if (cleanStr(existing.ReqName) !== cleanStr(reqName)) return false;
                                if (existing.Vendor !== vendor) return false;

                                if (cleanStr(existing.Item) !== cleanStr(itemName)) return false;
                                if (existing.Qty !== qty) return false;
                                
                                return true;
                            });
                            const finalStatus = isDuplicate ? 'Review' : 'Approved';
                            const id = 'mgrec_' + Date.now() + '_' + idx + '_' + Math.random().toString(36).substring(2, 6);
                            
                            updates['meetingsGuestsRecords/' + id] = {
                                id: id,
                                RawDate: rawYMD,
                                DateFormatted: formattedDMY,
                                Day: typeof getDayOfWeek === 'function' ? getDayOfWeek(formattedDMY.replace(/-/g, '/')) : '',
                                Time: timeVal,
                                Item: itemName,
                                Qty: qty,
                                Rate: rate,
                                Amount: amount,
                                ReqName: reqName,
                                Purpose: purpose,
                                Location: location,
                                Vendor: vendor,
                                ServedBy: servedBy,
                                Status: finalStatus,
                                Timestamp: Date.now() + idx
                            };
                            importCount++;
                        });

                        if (importCount > 0) {
                            await db.ref().update(updates);
                            appAlert('Success', `✅ ${importCount} Meeting records processed!\n(Duplicates sent to Review Section)`);
                            if (typeof window.renderMgHistoryTable === 'function') window.renderMgHistoryTable();
                            if (typeof window.renderMgReviewSection === 'function') window.renderMgReviewSection();
                        } else {
                            appAlert('Notice', 'No valid rows found in Excel.');
                        }
                    } catch (err) {
                        appAlert('Import Error', err.message);
                    } finally {
                        if (event.target) event.target.value = '';
                    }
                };
                
                reader.onerror = function() {
                    appAlert('File Permission Error', 'Cannot read this file directly. Please save the Excel file to your phone\'s "Downloads" or "Documents" folder first, and then upload it from there.');
                    if (event.target) event.target.value = '';
                };                
                reader.readAsArrayBuffer(file);
            };
            // ============================================================
            // AUTO CLEAN EXACT DUPLICATE ITEMS
            // ============================================================
            window.cleanDuplicateMeetingItems = function() {
                let totalRemoved = 0;
                let updates = {};

                // 1. જુના મોડ્યુલના ડુપ્લીકેટ્સ સાફ કરવા (જે સ્લીપમાં ડબલ દેખાય છે)
                eventLogsData.forEach(ev => {
                    if (ev.items && Array.isArray(ev.items) && ev.items.length > 0) {
                        const uniqueItems = [];
                        const seen = new Set();
                        let hasDups = false;

                        ev.items.forEach(item => {
                            // નામ, ક્વોન્ટિટી, રેટ અને તારીખ એકદમ સેમ હોય તો જ પકડશે
                            const key = `${item.name.toLowerCase().trim()}_${item.qty}_${item.rate}_${item.itemSpecificDate}`;
                            if (seen.has(key)) {
                                hasDups = true;
                                totalRemoved++;
                            } else {
                                seen.add(key);
                                uniqueItems.push(item);
                            }
                        });

                        if (hasDups) {
                            const totalAmt = uniqueItems.reduce((sum, i) => sum + (Number(i.amount) || (i.qty * i.rate)), 0);
                            const summary = uniqueItems.map(i => `${i.qty} ${i.name} (${i.locationNode})`).join(', ');
                            updates['eventLogs/' + ev.id + '/items'] = uniqueItems;
                            updates['eventLogs/' + ev.id + '/amount'] = totalAmt;
                            updates['eventLogs/' + ev.id + '/refreshmentSummary'] = summary;
                        }
                    }
                });

                // 2. નવા મોડ્યુલના ડુપ્લીકેટ્સ સાફ કરવા
                const seenMg = new Set();
                mgRecordsData.forEach(rec => {
                    if (rec.Status === 'Review') return;
                    const key = `${rec.RawDate}_${rec.Time}_${rec.Item.toLowerCase().trim()}_${rec.Qty}_${rec.Rate}_${rec.Purpose.toLowerCase().trim()}`;
                    if (seenMg.has(key)) {
                        updates['meetingsGuestsRecords/' + rec.id] = null;
                        totalRemoved++;
                    } else {
                        seenMg.add(key);
                    }
                });

                if (totalRemoved > 0 || Object.keys(updates).length > 0) {
                    appConfirm('Clean Duplicates', `અમને ડેટાબેઝમાં ${totalRemoved} જેટલી ડબલ એન્ટ્રીઓ (બિલકુલ સરખી આઇટમ્સ) મળી છે. શું તમે તેને ડીલીટ કરીને ટોટલ રકમ સરખી કરવા માંગો છો?`, () => {
                        db.ref().update(updates).then(() => {
                            appAlert('Success', `${totalRemoved} ડુપ્લીકેટ આઇટમ્સ સફળતાપૂર્વક ડીલીટ થઈ ગઈ!`);
                            if (window.renderMgHistoryTable) window.renderMgHistoryTable();
                            if (window.openEventHistoryModal && !document.getElementById('eventHistoryModal').classList.contains('hidden')) {
                                window.openEventHistoryModal();
                            }
                        });
                    });
                } else {
                    appAlert('No Duplicates', 'No duplicate entries found. Your data is completely clean!');
                }
            };
        // નવો અલ્ટ્રા કોમ્પેક્ટ એન્ટ્રી રો (કાર્ડ) - Custom Dropdown સાથે
            window.addMgRow = function(data = {}) {

                if(!container) return;

                let servedByHtml = '';
                if(window.mgCurrentRole === 'admin') {
                    let initDisp = 'Served By';
                    if (data.ServedBy) {
                        if (data.ServedBy === 'Multiple Pantry Boys') initDisp = 'Multiple';
                        else if (data.ServedBy === 'Through Vendor') initDisp = 'Vendor';
                        else initDisp = safeStr(data.ServedBy).split(' ')[0]; 
                    }
                    
                    const customOptsHtml = `
                        <div style="padding:10px 12px; border-bottom:1px solid #e2e8f0; cursor:pointer; font-size:12px; white-space:nowrap;" onclick="this.parentElement.previousElementSibling.style.display='none'; this.parentElement.style.display='none'; this.parentElement.parentElement.querySelector('span').innerText='Multiple'; this.parentElement.parentElement.querySelector('input').value='Multiple Pantry Boys';">Multiple Pantry Boys</div>

                        ` + pantryTeam.map(p => {

                    servedByHtml = `

                            <div class="mg-cmp-inp" onclick="this.nextElementSibling.style.display='block'; this.nextElementSibling.nextElementSibling.style.display='block';" style="display:flex; justify-content:space-between; align-items:center; cursor:pointer; padding:0 4px;">
                                <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:10px;">${initDisp}</span>

                            </div>
                            <!-- ઓવરલે: બહાર ક્લિક કરવાથી મેનુ બંધ થઈ જાય -->

                                ${customOptsHtml}
                            </div>
                        </div>
                    `;
                } else {
                    servedByHtml = `<input type="hidden" class="row-served" value="${window.mgCurrentPantryName}">`;
                }

                const card = document.createElement('div');
                card.className = 'mg-entry-card';
                card.id = rowId;

            // ડુપ્લીકેટ (કોપી) ફંક્શન
            window.duplicateMgRow = function(sourceId) {
                const src = document.getElementById(sourceId);
                if(!src) return;
                
                const sInp = src.querySelector('.row-served');
                
                const data = {
                    Date: src.querySelector('.row-date').value,
                    Time: src.querySelector('.row-time').value,
                    ReqBy: src.querySelector('.row-req').value,
                    Purpose: src.querySelector('.row-purpose').value,
                    Location: src.querySelector('.row-loc').value,
                    Vendor: src.querySelector('.row-vendor').value,
                    ServedBy: sInp ? sInp.value : '',
                    Item: src.querySelector('.row-item').value,
                    Qty: src.querySelector('.row-qty').value,
                    Rate: src.querySelector('.row-rate').value,
                    Amount: src.querySelector('.row-amt').value
                };
                window.addMgRow(data);
                window.calcMgGrandTotal();
            };

            // વેન્ડર બદલાય એટલે ડેટાલીસ્ટ અપડેટ થાય
            window.updateMgItemDatalist = function(rowId) {
                const row = document.getElementById(rowId);
                if(!row) return;
                const vendor = row.querySelector('.row-vendor').value.toLowerCase().trim();
                const dl = document.getElementById('dl_' + rowId);
                if(dl) {
                    dl.innerHTML = '';
                    if(vendor && vendorItemsCatalog[vendor]) {
                        vendorItemsCatalog[vendor].forEach(it => {
                            dl.innerHTML += `<option value="${safeStr(it.name)}">`;
                        });
                    }
                }
                window.fetchMgRate(rowId);
            };

            // આઇટમ ટાઈપ કરે એટલે ભાવ ઓટોમેટીક આવે
            window.fetchMgRate = function(rowId) {
                const row = document.getElementById(rowId);
                if(!row) return;
                const vendor = row.querySelector('.row-vendor').value.toLowerCase().trim();
                const itemName = row.querySelector('.row-item').value.toLowerCase().trim();
                const rateInp = row.querySelector('.row-rate');
                
                if(vendor && itemName && vendorItemsCatalog[vendor]) {
                    const match = vendorItemsCatalog[vendor].find(it => it.name.toLowerCase() === itemName);
                    if(match) { 
                        rateInp.value = match.rate; 
                        window.calcMgRowAmt(rowId);
                    }
                }
            };

            window.calcMgRowAmt = function(rowId) {
                const row = document.getElementById(rowId);
                if(!row) return;
                const q = parseFloat(row.querySelector('.row-qty').value) || 0;
                const r = parseFloat(row.querySelector('.row-rate').value) || 0;
                const amt = q * r;
                row.querySelector('.row-amt').value = amt;
                const disp = document.getElementById(`amt_disp_${rowId}`);
                if(disp) disp.innerText = amt.toFixed(2);
                window.calcMgGrandTotal();
            };

            window.calcMgGrandTotal = function() {
                let total = 0;
                document.querySelectorAll('.row-amt').forEach(inp => total += parseFloat(inp.value) || 0);
                const gt = document.getElementById('mgGrandTotalDisp');
                if(gt) gt.innerText = total.toFixed(2);
            };

            // સેવ બટન
            window.submitMgForm = function() {
                const rows = document.querySelectorAll('.mg-entry-card');
                if(rows.length === 0) return appAlert("Error", "Please add at least one entry.");

                let isValid = true;
                const updates = {};
                let duplicateCount = 0;

                rows.forEach(row => {
                    const req = row.querySelector('.row-req').value.trim();
                    const purp = row.querySelector('.row-purpose').value.trim();
                    const vend = row.querySelector('.row-vendor').value;
                    const itm = row.querySelector('.row-item').value.trim();
                    const qt = parseFloat(row.querySelector('.row-qty').value) || 0;
                    
                    if(!req || !purp || !vend || !itm || qt <= 0) isValid = false;
                });

                if(!isValid) return appAlert("Missing Info", "Please ensure Organizer, Purpose, Vendor, Item Name, and Qty are filled in all cards.");

                rows.forEach(row => {
                    const sInp = row.querySelector('.row-served');
                    const data = {
                        RawDate: row.querySelector('.row-date').value,
                        Time: row.querySelector('.row-time').value || '09:00',
                        ReqName: row.querySelector('.row-req').value.trim(),
                        Purpose: row.querySelector('.row-purpose').value.trim(),
                        Location: row.querySelector('.row-loc').value.trim(),
                        Vendor: row.querySelector('.row-vendor').value,
                        ServedBy: sInp ? sInp.value : window.mgCurrentPantryName,
                        Item: row.querySelector('.row-item').value.trim(),
                        Qty: parseFloat(row.querySelector('.row-qty').value) || 0,
                        Rate: parseFloat(row.querySelector('.row-rate').value) || 0,
                        Amount: parseFloat(row.querySelector('.row-amt').value) || 0
                    };

                    const id = 'mgrec_' + Date.now() + Math.random().toString(36).substring(2, 7);
                    
                                       const cleanStr = (str) => (str || '').replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
                    
                    // STRICT DUPLICATE CHECKER (Ignores Purpose, Time, and Location)
                    const isDuplicate = mgRecordsData.some(existing => {
                        if (existing.Status === 'Review') return false; 
                        if (existing.RawDate !== data.RawDate) return false; // Date must match
                        
                        // 1. Req By (Person Name) must match
                        if (cleanStr(existing.ReqName) !== cleanStr(data.ReqName)) return false;
                        
                        // 2. Vendor must match
                        if (existing.Vendor !== data.Vendor) return false;

                        // 3. Item Name and Quantity must match exactly
                        if (cleanStr(existing.Item) !== cleanStr(data.Item)) return false;
                        if (existing.Qty !== data.Qty) return false;
                        
                        // If Date, Vendor, ReqName, Item, and Qty match, it goes to Review!
                        return true;
                    });
                    let finalStatus = isDuplicate ? 'Review' : 'Approved';
                    if(isDuplicate) duplicateCount++;

                    // તારીખમાં ડેસ સેટ કરવું 
                    let dmyDashFormat = convertYMDtoDMY(data.RawDate).replace(/\//g, '-');                    
                    // વેન્ડરમાં આઇટમ ઓટો સિંક કરો
                    if (data.Vendor && data.Item) {
                        const vKey = data.Vendor.toLowerCase().trim();
                        const currentCatalog = vendorItemsCatalog[vKey] || [];
                        if (!currentCatalog.some(it => it.name.toLowerCase() === data.Item.toLowerCase())) {
                            currentCatalog.push({ name: data.Item, rate: data.Rate });
                            db.ref('vendorItems/' + vKey).set(currentCatalog);
                        }
                    }
                    
                    if (data.Location && !venueList.some(v => v.name.toLowerCase() === data.Location.toLowerCase())) {
                        const vId = 'vnu_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
                        db.ref('venues/' + vId).set({ id: vId, name: data.Location });
                    }
                    
                    updates['meetingsGuestsRecords/' + id] = {
                        id: id,
                        RawDate: data.RawDate,
                        DateFormatted: convertYMDtoDMY(data.RawDate),
                        Day: getDayOfWeek(convertYMDtoDMY(data.RawDate)),
                        Time: data.Time,
                        Item: data.Item, Qty: data.Qty, Rate: data.Rate, Amount: data.Amount,
                        ReqName: data.ReqName, Purpose: data.Purpose, Location: data.Location,
                        Vendor: data.Vendor, ServedBy: data.ServedBy,
                        Status: finalStatus,
                        Timestamp: Date.now()
                    };
                });

                db.ref().update(updates).then(() => {
                    if(duplicateCount > 0) {
                        appAlert("Notice", `Saved! But ${duplicateCount} entries look like Duplicates and are moved to 'Pending Review'.`);
                    } else {
                        appAlert("Success", "All Entries Saved Successfully!");
                    }
                    
                    document.getElementById('mgDynamicRowsContainer').innerHTML = '';
                    window.addMgRow();
                    window.calcMgGrandTotal();
                    window.renderMgHistoryTable();
                    window.renderMgReviewSection();
                }).catch(err => appAlert('Error', err.message));
            };
            // ============================================================
            //  SMART DUPLICATE SCANNER ENGINE
            // ============================================================
            window.openDuplicateScannerModal = function() {
                appAlert('Scanning', 'Scanning database for duplicate meeting slips...');
                
                // 1. Gather all records
                let combinedRecords = mgRecordsData.filter(rec => rec.Status !== 'Review');

                if (typeof eventLogsData !== 'undefined' && eventLogsData.length > 0) {
                    eventLogsData.forEach(ev => {
                        if (ev.items && Array.isArray(ev.items) && ev.items.length > 0) {
                            ev.items.forEach((item, idx) => {
                                combinedRecords.push({
                                    id: ev.id + '_' + idx, DateFormatted: item.itemSpecificDate || ev.date, 
                                    Item: item.name, Qty: item.qty, Rate: item.rate || 0, Amount: item.amount || (item.qty * (item.rate || 0)),
                                    ReqName: ev.orderedBy || '-', Purpose: ev.eventName || '-', Vendor: item.vendor || ev.canteenSource || '-',
                                    isOldEvent: true, originalId: ev.id, Timestamp: ev.timestamp || 0
                                });
                            });
                        } else {
                            combinedRecords.push({
                                id: ev.id, DateFormatted: ev.date, Item: ev.refreshmentSummary || 'Meeting Details', Qty: '-', Rate: '-', Amount: ev.amount || 0, 
                                ReqName: ev.orderedBy || '-', Purpose: ev.eventName || '-', Vendor: ev.canteenSource || '-',
                                isOldEvent: true, originalId: ev.id, Timestamp: ev.timestamp || 0
                            });
                        }
                    });
                }

                // 2. Form Slips (Group by Date + Purpose + Vendor to match History View)
                const slips = {};
                combinedRecords.forEach(rec => {
                    const key = `${rec.DateFormatted}_${rec.Purpose}_${rec.Vendor}`;
                    if(!slips[key]) {
                        slips[key] = {
                            key: key, DateFormatted: rec.DateFormatted, Vendor: rec.Vendor, Purpose: rec.Purpose, ReqName: rec.ReqName,
                            totalAmt: 0, items: [], idsToDelete: []
                        };
                    }
                    slips[key].items.push(rec);
                    slips[key].totalAmt += Number(rec.Amount) || 0;
                    slips[key].idsToDelete.push({ id: rec.id, isOld: !!rec.isOldEvent, originalId: rec.originalId });
                });

                // 3. Find Duplicate Slips (Group strictly by Date + Vendor + ReqName + Amount) IGNORING slight Purpose variations
                const slipGroups = {};
                Object.values(slips).forEach(slip => {
                    const reqClean = (slip.ReqName || '').replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
                    const hash = `${slip.DateFormatted}_${slip.Vendor.toLowerCase()}_${reqClean}_${slip.totalAmt.toFixed(2)}`;
                    if(!slipGroups[hash]) slipGroups[hash] = [];
                    slipGroups[hash].push(slip);
                });

                const duplicateGroups = Object.values(slipGroups).filter(g => g.length > 1);

                // 4. Render UI
                const existing = document.getElementById('duplicateScannerModal');
                if (existing) existing.remove();

                let html = '';
                if (duplicateGroups.length === 0) {
                    html = `<div style="padding:40px 20px; text-align:center; color:#059669; font-weight:bold; font-size:16px;">✅ No Duplicates Found!<br><span style="font-size:12px; color:#475569; font-weight:normal; display:block; margin-top:8px;">Your database is perfectly clean.</span></div>`;
                } else {
                    html = `<div style="padding:12px; background:#FEF2F2; border-bottom:1px solid #FECACA; color:#DC3545; font-size:12px; font-weight:bold;">⚠️ Found ${duplicateGroups.length} groups of duplicate slips!<br><span style="color:#7F1D1D; font-size:10px; font-weight:normal;">(Matched by Date, Vendor, Requester, and Total Amount)</span></div>`;
                    html += `<div style="padding:12px; overflow-y:auto; flex:1; background:#F8FAFC;">`;
                    
                    duplicateGroups.forEach((group, gIdx) => {
                        html += `<div style="margin-bottom:16px; border:2px solid #CBD5E1; border-radius:8px; background:#fff; overflow:hidden;">`;
                        html += `<div style="background:#F1F5F9; padding:8px 12px; border-bottom:1px solid #CBD5E1; font-weight:bold; color:#1E293B; font-size:12px; display:flex; justify-content:space-between;">
                                    <span>${group[0].DateFormatted} | ${group[0].Vendor} | Req: ${group[0].ReqName}</span>
                                    <span style="color:#0A56D0;">Amount: ₹${group[0].totalAmt.toFixed(2)}</span>
                                 </div>`;
                        
                        group.forEach((slip, sIdx) => {
                            const isFirst = sIdx === 0; // Keep the first one as Original
                            const delData = encodeURIComponent(JSON.stringify(slip.idsToDelete)).replace(/'/g, "%27");
                            const slipDataStr = encodeURIComponent(JSON.stringify(slip)).replace(/'/g, "%27");
                            
                            html += `
                                <label style="display:flex; align-items:center; gap:12px; padding:12px; border-bottom:1px solid #E2E8F0; cursor:pointer; background:${isFirst ? '#ECFDF5' : '#FEF2F2'};">
                                    <input type="checkbox" class="dup-scanner-chk" value="${delData}" ${isFirst ? '' : 'checked'} style="width:20px; height:20px; accent-color:#DC3545; flex-shrink:0;">
                                    <div style="flex:1; font-size:12px; line-height:1.5;">
                                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                                            ${isFirst ? '<span style="background:#10B981; color:#fff; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:bold;">Original (Keep)</span>' : '<span style="background:#EF4444; color:#fff; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:bold;">Duplicate (Delete)</span>'}
                                            <button type="button" onclick="window.viewMgSlip('${slipDataStr}')" style="background:#FEF3C7; color:#D97706; border:1px solid #FDE68A; padding:2px 8px; border-radius:4px; font-weight:bold; font-size:10px; cursor:pointer;">📜 View Slip</button>
                                        </div>
                                        <b>Purpose:</b> <span style="color:#D97706;">${slip.Purpose}</span><br>
                                        <span style="color:#64748B;">Items: ${slip.items.map(i => i.Item + ' (x' + i.Qty + ')').join(', ')}</span>
                                    </div>
                                </label>
                            `;
                        });
                        html += `</div>`;
                    });
                    html += `</div>`;
                    
                    html += `
                        <div style="padding:12px; background:#fff; border-top:1px solid #CBD5E1; display:flex; gap:10px;">
                            <button onclick="window.executeDuplicateCleanup()" class="danger" style="flex:1; padding:12px; font-weight:bold; font-size:14px; border-radius:8px; box-shadow:0 2px 4px rgba(220,53,69,0.3);">🗑️ Delete Selected Duplicates</button>
                        </div>
                    `;
                }

                const modal = document.createElement('div');
                modal.className = 'popup-overlay';
                modal.id = 'duplicateScannerModal';
                modal.style.zIndex = '9999999';
                modal.innerHTML = `
                    <div class="popup-card" style="width:95vw; max-width:600px; height:85vh; padding:0; display:flex; flex-direction:column; overflow:hidden; border-radius:12px;">
                        <div style="background:#1E293B; color:#fff; padding:12px 16px; display:flex; justify-content:space-between; align-items:center;">
                            <h3 style="margin:0; font-size:16px;">🔍 Smart Duplicate Scanner</h3>
                            <button onclick="document.getElementById('duplicateScannerModal').remove()" style="background:transparent; border:none; color:#fff; font-size:20px; cursor:pointer;">✕</button>
                        </div>
                        ${html}
                    </div>
                `;
                
                // થોડું ડીલે જેથી Scanning એલર્ટ ગાયબ થઈ જાય
                setTimeout(() => {
                    document.querySelector('.popup-overlay:not(#duplicateScannerModal)')?.remove();
                    document.body.appendChild(modal);
                }, 500);
            };
            // ============================================================
            // હિસ્ટ્રી ટેબલ અને સ્લિપ પોપઅપ

            window.renderMgHistoryTable = function() {
                const containerMain = document.getElementById('mgHistoryListMain');
                const containerPopup = document.getElementById('mgHistoryListPopup');
                
                const mainPicker = document.getElementById('mgMainMonthFilter');
                const popupPicker = document.getElementById('mgPopupMonthFilter');
                const selectedMonthYMD = popupPicker ? popupPicker.value : (mainPicker ? mainPicker.value : new Date().toISOString().slice(0, 7));

                const mainSearch = document.getElementById('mgMainSearchFilter');
                const popupSearch = document.getElementById('mgPopupSearchFilter');
                const searchQuery = (popupSearch ? popupSearch.value : (mainSearch ? mainSearch.value : '')).toLowerCase().trim();

                let combinedRecords = mgRecordsData.filter(rec => rec.Status !== 'Review');

                if (typeof eventLogsData !== 'undefined' && eventLogsData.length > 0) {
                    eventLogsData.forEach(ev => {
                        if (ev.items && Array.isArray(ev.items) && ev.items.length > 0) {
                            ev.items.forEach((item, idx) => {
                                combinedRecords.push({
                                    id: ev.id + '_' + idx, DateFormatted: item.itemSpecificDate || ev.date, Day: getDayOfWeek(item.itemSpecificDate || ev.date) || '',
                                    Item: item.name, Qty: item.qty, Rate: item.rate || 0, Amount: item.amount || (item.qty * (item.rate || 0)),
                                    ReqName: ev.orderedBy || '-', Purpose: ev.eventName || '-', Location: item.locationNode || '-', Vendor: item.vendor || ev.canteenSource || '-',
                                    ServedBy: item.servedBy || ev.servedByName || ev.pantryName || '-', Timestamp: ev.timestamp || new Date(parseDMYToYMD(item.itemSpecificDate || ev.date)).getTime() || 0,
                                    isOldEvent: true, originalId: ev.id
                                });
                            });
                        } else {
                            combinedRecords.push({
                                id: ev.id, DateFormatted: ev.date, Day: getDayOfWeek(ev.date) || '', Item: ev.refreshmentSummary || 'Meeting Details', Qty: '-', Rate: '-',
                                Amount: ev.amount || 0, ReqName: ev.orderedBy || '-', Purpose: ev.eventName || '-', Location: '-', Vendor: ev.canteenSource || '-', ServedBy: ev.servedByName || ev.pantryName || '-',
                                Timestamp: ev.timestamp || new Date(parseDMYToYMD(ev.date)).getTime() || 0, isOldEvent: true, originalId: ev.id
                            });
                        }
                    });
                }

                if (window.mgCurrentRole === 'pantry' && typeof currentUser !== 'undefined' && currentUser) {
                    combinedRecords = combinedRecords.filter(rec => (rec.ServedBy || '').toLowerCase().includes(currentUser.name.toLowerCase()));
                }

                let filteredRecords = combinedRecords.filter(rec => {
                    let recYMD = rec.DateFormatted && rec.DateFormatted.includes('/') ? parseDMYToYMD(rec.DateFormatted) : (rec.RawDate || new Date(rec.Timestamp).toISOString().split('T')[0]);
                    return recYMD.startsWith(selectedMonthYMD);
                });

                const searchTerms = searchQuery.split(/\s+/).filter(Boolean);
                if (searchTerms.length > 0) {
                    filteredRecords = filteredRecords.filter(rec => {
                        const rowText = Object.values(rec).join(' ').toLowerCase();
                        return searchTerms.every(term => rowText.includes(term));
                    });
                }

                const slips = {};
                filteredRecords.forEach(rec => {
                    const key = `${rec.DateFormatted}_${rec.Purpose}_${rec.Vendor}`;
                    if(!slips[key]) {
                        slips[key] = {
                            key: key,
                            DateFormatted: rec.DateFormatted,
                            Vendor: rec.Vendor,
                            Purpose: rec.Purpose,
                            ReqName: rec.ReqName,
                            ServedBy: rec.ServedBy,
                            Location: rec.Location || '-',
                            Timestamp: rec.Timestamp,
                            totalAmt: 0,
                            itemCount: 0,
                            items: [],
                            idsToDelete: [] 
                        };
                    }
                    slips[key].items.push(rec);
                    slips[key].itemCount += 1;
                    slips[key].totalAmt += Number(rec.Amount) || 0;
                    slips[key].idsToDelete.push(rec);
                });

                // તારીખ પ્રમાણે સોર્ટિંગ (1 થી 31 - Ascending Order)
                const sortedSlips = Object.values(slips).sort((a, b) => {
                    const dateA = window.parseDMYToYMD ? window.parseDMYToYMD(a.DateFormatted) : a.DateFormatted;

                    // જો તારીખ સરખી હોય તો સમય/Timestamp પ્રમાણે
                    if (dateA === dateB) {
                        return a.Timestamp - b.Timestamp;
                    }
                    return dateA.localeCompare(dateB);
                });

                        if (p[2].length === 4) return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
                        if (p[0].length === 4) return `${p[0]}-${p[1].padStart(2,'0')}-${p[2].padStart(2,'0')}`;
                    }
                    return new Date().toISOString().split('T')[0];

                if(!purpose || !reqName) return appAlert('Error', 'Please fill Purpose and Req By.');

                const rows = document.querySelectorAll('.eg-row');
                if(rows.length === 0) return appAlert('Error', 'Please add at least one item.');

                let isValid = true;

                });
                if(!isValid) return appAlert('Error', 'Date, Vendor, Item name and Qty are required for all rows.');

                const idsToDelete = JSON.parse(decodeURIComponent(document.getElementById('egIdsToDelete').value));
                const updates = {};
                idsToDelete.forEach(it => {
                    updates['meetingsGuestsRecords/' + it.id] = null;
                });

                rows.forEach(row => {
                    const rawDate = row.querySelector('.eg-date').value;
                    const timeVal = row.querySelector('.eg-time').value || '09:00';
                    const vendor = row.querySelector('.eg-vendor').value;
                    const item = row.querySelector('.eg-item').value.trim();
                    const qty = parseFloat(row.querySelector('.eg-qty').value) || 0;
                    const rate = parseFloat(row.querySelector('.eg-rate').value) || 0;
                    const amt = qty * rate;

                    const id = 'mgrec_' + Date.now() + Math.random().toString(36).substring(2, 7);
                    
                    updates['meetingsGuestsRecords/' + id] = {
                        id: id,
                        RawDate: rawDate,
                        DateFormatted: convertYMDtoDMY(rawDate),
                        Day: getDayOfWeek(convertYMDtoDMY(rawDate)),
                        Time: timeVal,
                        Item: item, Qty: qty, Rate: rate, Amount: amt,
                        ReqName: reqName, Purpose: purpose, Location: 'Updated',
                        Vendor: vendor, ServedBy: servedBy,
                        Status: 'Approved',
                        Timestamp: Date.now()
                    };
                });

                db.ref().update(updates).then(() => {
                    document.getElementById('mgEditGroupPopupOverlay').remove();
                    appAlert('Success', 'Meeting Updated successfully!');
                    window.renderMgHistoryTable();
                }).catch(err => appAlert('Error', err.message));
            };            
           window.renderMgReviewSection = function() {
                const container = document.getElementById('mgReviewSection');
                if (!container) return;
                
                // જો કરન્ટ રોલ એડમિન ના હોય (એટલે કે પેન્ટ્રી બોય હોય), તો આ સેક્શન હાઈડ જ રાખો
                if (window.mgCurrentRole !== 'admin') { 
                    container.style.display = 'none'; 
                    return; 
                }
             window.deleteFullMgSlip = function(encodedData) {
                appConfirm('Delete Slip', 'Are you sure you want to delete ALL items in this slip? (Can be restored from Recycle Bin)', () => {
                    const items = JSON.parse(decodeURIComponent(encodedData));
                    const updates = {};
                    let oldEventsDeleted = new Set();

                    items.forEach(item => {
                        if (item.isOldEvent || item.isOld) {
                            const oId = item.originalId;
                            if(!oldEventsDeleted.has(oId)) {
                                const orig = eventLogsData.find(e => e.id === oId);
                                if (orig) db.ref('recycleBin/eventLogs/' + oId).set(orig);
                                db.ref('eventLogs/' + oId).remove();
                                oldEventsDeleted.add(oId);
                            }
                        } else {
                            db.ref('recycleBin/meetingsGuestsRecords/' + item.id).set(item);
                            updates['meetingsGuestsRecords/' + item.id] = null;
                        }
                    });

                    if (Object.keys(updates).length > 0) {
                        db.ref().update(updates).then(() => {
                            appAlert('Deleted', 'Entire slip moved to Recycle Bin.');
                            window.renderMgHistoryTable();
                        });
                    } else {
                        appAlert('Deleted', 'Events moved to Recycle Bin.');
                        window.renderMgHistoryTable();
                    }
                });
            };

            window.executeDuplicateCleanup = function() {
                const checked = document.querySelectorAll('.dup-scanner-chk:checked');
                if (checked.length === 0) return appAlert('Select Items', 'Please select at least one duplicate to delete.');

                appConfirm('Confirm Deletion', `Are you sure you want to delete ${checked.length} duplicate slips? (Can be restored from Recycle Bin)`, () => {
                    const updates = {};
                    let oldEventsDeleted = new Set();
                    let countDeleted = 0;

                    checked.forEach(cb => {
                        const items = JSON.parse(decodeURIComponent(cb.value));
                        items.forEach(item => {
                            if (item.isOldEvent || item.isOld) {
                                const oId = item.originalId;
                                if(!oldEventsDeleted.has(oId)) {
                                    const orig = eventLogsData.find(e => e.id === oId);
                                    if (orig) db.ref('recycleBin/eventLogs/' + oId).set(orig);
                                    db.ref('eventLogs/' + oId).remove();
                                    oldEventsDeleted.add(oId);
                                    countDeleted++;
                                }
                            } else {
                                db.ref('recycleBin/meetingsGuestsRecords/' + item.id).set(item);
                                updates['meetingsGuestsRecords/' + item.id] = null;
                                countDeleted++;
                            }
                        });
                    });

                    if (Object.keys(updates).length > 0) {
                        db.ref().update(updates).then(() => finishCleanup(countDeleted));
                    } else {
                        finishCleanup(countDeleted);
                    }
                });

                function finishCleanup(count) {
                    const modal = document.getElementById('duplicateScannerModal');
                    if(modal) modal.remove();
                    appAlert('Success', `Moved ${count} duplicate items to Recycle Bin!`);
                    if (window.renderMgHistoryTable) window.renderMgHistoryTable();
                }
            };
             
                const duplicatesToShow = typeof mgRecordsData !== 'undefined' ? mgRecordsData.filter(r => r.Status === 'Review') : [];
                if(duplicatesToShow.length === 0) { container.style.display = 'none'; return; }

                container.style.display = 'block';
                
                // લાંબા લિસ્ટના બદલે એક જ મોટું બટન બતાવશે
                container.innerHTML = `
                    <div style="background:#fef2f2; border:2px solid #ef4444; border-radius:8px; padding:12px; text-align:center; margin-bottom:16px;">
                        <h3 style="color:#b91c1c; margin:0 0 8px 0; font-size:14px;">⚠️ ${duplicatesToShow.length} Possible Duplicates Found</h3>
                        <p style="font-size:11px; color:#444; margin-bottom:10px;">Some entries look exactly like existing ones. Please review them.</p>
                        <button onclick="window.openDuplicateReviewModal()" class="btn danger" style="width:100%; font-weight:bold; padding:10px; border-radius:6px;">🔍 Review & Manage Duplicates</button>
                    </div>
                `;
            };

            window.openDuplicateReviewModal = function() {
                const duplicatesToShow = mgRecordsData.filter(r => r.Status === 'Review');
                
                // તારીખ પ્રમાણે સોર્ટિંગ (1 થી 31)
                duplicatesToShow.sort((a, b) => {
                    const dateA = window.parseDMYToYMD ? window.parseDMYToYMD(a.DateFormatted) : a.DateFormatted;
                    const dateB = window.parseDMYToYMD ? window.parseDMYToYMD(b.DateFormatted) : b.DateFormatted;
                    if (dateA === dateB) return a.Timestamp - b.Timestamp;
                    return dateA.localeCompare(dateB);
                });

                let rowsHtml = duplicatesToShow.map(rec => {
                    const dObj = new Date(rec.RawDate || rec.Timestamp);
                    const monthName = dObj.toLocaleString('en-US', { month: 'short', year: 'numeric' });
                    const timeDisplay = rec.Time ? `<span style="color:#64748B;">(${rec.Time})</span>` : '';
                    
                    return `
                    <label class="dup-row" style="display:flex; align-items:center; gap:12px; padding:12px; border-bottom:1px solid #e2e8f0; background:#fff; cursor:pointer;">
                        <input type="checkbox" class="dup-chk" value="${rec.id}" style="width:20px; height:20px; cursor:pointer; flex-shrink:0;">
                        <div style="flex:1; font-size:12px; line-height:1.5;">
                            <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                                <span><b>Date:</b> ${rec.DateFormatted} ${timeDisplay}</span>
                                <span style="background:#FEF3C7; color:#D97706; padding:2px 8px; border-radius:4px; font-weight:bold; font-size:10px;">🗓️ ${monthName}</span>
                            </div>
                            <b>Req:</b> ${rec.ReqName} | <b>Item:</b> <span style="color:#0A56D0; font-weight:bold;">${rec.Item} x ${rec.Qty}</span> | <b>Amt:</b> ₹${rec.Amount}<br>
                            <span style="color:#64748b; font-size:11px;"><b>Purpose:</b> ${rec.Purpose}</span>
                        </div>
                    </label>
                `}).join('');
                const modalHtml = `
                    <div id="dupReviewModal" class="popup-overlay" style="display:flex; align-items:center; justify-content:center; z-index:999999; background:rgba(0,0,0,0.6);">
                        <div class="popup-card" style="width:95%; max-width:500px; height:85vh; display:flex; flex-direction:column; padding:0; overflow:hidden; border-radius:12px;">
                            
                            <div style="background:#ef4444; color:#fff; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; flex-shrink:0;">
                                <h3 style="margin:0; font-size:16px;">⚠️ Manage Duplicates</h3>
                                <button onclick="document.getElementById('dupReviewModal').remove()" style="background:transparent; border:none; color:#fff; font-size:20px; cursor:pointer; line-height:1;">✕</button>
                            </div>
                            
                            <div style="padding:12px 16px; background:#f8fafc; border-bottom:1px solid #cbd5e1; display:flex; align-items:center; gap:10px; flex-shrink:0;">
                                <input type="checkbox" id="selectAllDups" style="width:20px; height:20px; cursor:pointer;" onchange="const chks = document.querySelectorAll('.dup-chk'); chks.forEach(c => c.checked = this.checked);">
                                <label for="selectAllDups" style="font-weight:bold; font-size:14px; cursor:pointer; color:#1e293b;">Select All (${duplicatesToShow.length})</label>
                            </div>

                            <div style="flex:1; overflow-y:auto; background:#f1f5f9;">
                                ${rowsHtml}
                            </div>

                            <div style="padding:14px 16px; background:#fff; border-top:1px solid #e2e8f0; display:flex; gap:10px; flex-shrink:0;">
                                <button onclick="window.bulkDuplicateAction('approve')" class="success" style="flex:1; padding:12px; font-weight:bold; font-size:13px; border-radius:8px;">✅ Approve Selected</button>
                                <button onclick="window.bulkDuplicateAction('delete')" class="danger" style="flex:1; padding:12px; font-weight:bold; font-size:13px; border-radius:8px;">🗑 Delete Selected</button>
                            </div>
                        </div>
                    </div>
                `;
                
                const existing = document.getElementById('dupReviewModal');
                if(existing) existing.remove();
                document.body.insertAdjacentHTML('beforeend', modalHtml);
            };

            window.bulkDuplicateAction = function(action) {
                const checked = document.querySelectorAll('.dup-chk:checked');
                if(checked.length === 0) return appAlert('Select Items', 'Please select at least one entry using the checkboxes.');
                
                const actionText = action === 'approve' ? 'Approve' : 'Delete';
                appConfirm('Confirm Bulk Action', `Are you sure you want to ${actionText} ${checked.length} selected entries?`, async () => {
                    const updates = {};
                    checked.forEach(cb => {
                        if(action === 'approve') {
                            updates['meetingsGuestsRecords/' + cb.value + '/Status'] = 'Approved';
                       } else {
                            const rec = mgRecordsData.find(r => r.id === cb.value);
                            if (rec) db.ref('recycleBin/meetingsGuestsRecords/' + cb.value).set(rec);
                            updates['meetingsGuestsRecords/' + cb.value] = null;
                        }
                    });
                    
                    await db.ref().update(updates);
                    
                    // પહેલા ડીલીટ/અપડેટ કરો અને પછી ટેબલ રીફ્રેશ કરો
                    if (typeof window.renderMgHistoryTable === 'function') window.renderMgHistoryTable();
                    if (typeof window.renderMgReviewSection === 'function') window.renderMgReviewSection();
                    
                    // મોડલ બંધ કરો અને એલર્ટ બતાવો, પણ લિંકને મેન્ટેન રાખો
                    const dupModal = document.getElementById('dupReviewModal');
                    if(dupModal) dupModal.remove();
                    
                    // થોડો સમય આપીને એલર્ટ બતાવો જેથી UI પ્રોપરલી સેટ થઈ જાય
                    setTimeout(() => {
                        appAlert('Success', `${checked.length} entries successfully ${action === 'approve' ? 'approved' : 'deleted'}.`);
                    }, 100);
                });
            };
        })();
// ===== Date Change & Auto Refresh Helpers =====            
window.refreshAllData = function() {
    if (typeof window.populateServe === 'function') window.populateServe();
    var mPopup = document.getElementById('monthlyGridPopup');
    if (mPopup && !mPopup.classList.contains('hidden') && typeof window.openMonthlyGridPopup === 'function') {
        window.openMonthlyGridPopup();
    }
};

window.changeDateBy = function(days) {
    var dateInput = document.getElementById('beverageEntryDate');
    if (!dateInput || !dateInput.value) return;

    var current = new Date(dateInput.value);
    current.setDate(current.getDate() + days);

    var yyyy = current.getFullYear();
    var mm = String(current.getMonth() + 1).padStart(2, '0');
    var dd = String(current.getDate()).padStart(2, '0');
    var newDate = yyyy + '-' + mm + '-' + dd;
    
    // જો નવું કેલેન્ડર લોડ થયું હોય તો એમાં અપડેટ કરો
    if (dateInput._flatpickr) {
        dateInput._flatpickr.setDate(newDate, true);
    } else {
        dateInput.value = newDate;
        window.refreshAllData();
    }
};

// પેજ લોડ થયા પછી શાંતિથી નવું કેલેન્ડર ચાલુ કરવાનો કોડ
setTimeout(function() {
    var dateInput = document.getElementById('beverageEntryDate');
    if (dateInput) {
        // આજની તારીખ સેટ કરો (જો ખાલી હોય તો)
        if (!dateInput.value) {
            var t = new Date();
            dateInput.value = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
        }
        
            // જો Flatpickr (યુનિવર્સલ કેલેન્ડર) ની ફાઈલ સાચી રીતે આવી ગઈ હોય તો જ ચાલુ કરો
            if (typeof flatpickr !== 'undefined') {
                flatpickr(dateInput, {
                    dateFormat: "Y-m-d",
                    altInput: true,          // નવી લાઈન ઉમેરી
                    altFormat: "d/m/Y",      // નવી લાઈન ઉમેરી (DD/MM/YYYY માટે)
                    disableMobile: true, // આ લાઈનથી બધા જ મોબાઈલમાં એકસરખું ડિઝાઇન વાળું કેલેન્ડર ખુલશે!
                    onChange: function(selectedDates, dateStr) {
                        window.refreshAllData();
                    }
                });
            } else {
            // જો ઇન્ટરનેટ ધીમું હોય અને ફાઈલ ના આવે, તો જૂની સિસ્ટમ ચાલુ રાખો જેથી એન્ટ્રી અટકે નહિ
            dateInput.addEventListener('change', window.refreshAllData);
            window.refreshAllData();
        }
    }
}, 800);       
</script>
