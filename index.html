  <script>
    async function forceLiveAppUpdate() {
      try {
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map(name => caches.delete(name)));
        }
        const res = await fetch(window.location.href, { method: 'HEAD', cache: 'no-store' });
        const latestTag = res.headers.get('ETag') || res.headers.get('Last-Modified');
        if (latestTag) {
          const localTag = localStorage.getItem('app_html_version_token');
          if (localTag && localTag !== latestTag) {
            localStorage.setItem('app_html_version_token', latestTag);
            window.location.reload(true); 
          } else if (!localTag) {
            localStorage.setItem('app_html_version_token', latestTag);
          }
        }
      } catch (err) {
        console.log("Live bypass active:", err);
      }
    }
    forceLiveAppUpdate();
    setInterval(forceLiveAppUpdate, 3 * 60 * 1000);
  </script>

  // MASTER FIX: Real Firebase Keys to prevent stuck delete
  function parseSnap(snap) {
      let arr = [];
      if(snap.exists()) {
          snap.forEach(child => {
              let val = child.val() || {};
              val.id = child.key; 
              arr.push(val);
          });
      }
      return arr;
  }

  function getTodayInDMY() {
    const today = new Date();
    const dd = String(today.getDate()).padStart(2, '0');
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    return `${dd}/${mm}/${today.getFullYear()}`;
  }

  function convertYMDtoDMY(ymdString) {
    if (!ymdString || !ymdString.includes('-')) return ymdString;
    const parts = ymdString.split('-');
    return `${parts[2]}/${parts[1]}/${parts[0]}`;
  }

  function parseDMYToYMD(dmy) {
    if (!dmy) return '';
    if (dmy.includes('-')) return dmy;
    let parts = dmy.split('/');
    if (parts.length !== 3) return dmy;
    return `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
  }

  let deviceFingerprint = "";
  try {
    deviceFingerprint = localStorage.getItem('dau_device_id');
    if (!deviceFingerprint) {

      localStorage.setItem('dau_device_id', deviceFingerprint);
    }

  const loginScreen = document.getElementById('loginScreen'), adminScreen = document.getElementById('adminScreen'), pantryScreen = document.getElementById('pantryScreen'), adminPopupContainer = document.getElementById('adminPopupContainer');

  function safeStr(val) { return val || ''; }

  function openAppModal(title, message, isConfirm, onConfirm) {
    const modal = document.createElement('div');
    modal.className = 'popup-overlay';
    modal.innerHTML = `<div class="popup-card" style="text-align:center;"><h3 style="color:#0A56D0; margin-top:0; margin-bottom:12px;">${title}</h3><p style="margin-bottom:20px; color:#44474E; font-size:0.95rem;">${message}</p><div style="display:flex; gap:12px; justify-content:center; width:100%;">${isConfirm ? '<button id="modalCancelBtn" style="background:#E2E8F0; color:#1F1F1F; flex:1; border-radius:100px;">Cancel</button>' : ''}<button id="modalOkBtn" class="success" style="flex:1; border-radius:100px;">OK</button></div></div>`;
    document.body.appendChild(modal);
    if(isConfirm) document.getElementById('modalCancelBtn').onclick = () => modal.remove();
    document.getElementById('modalOkBtn').onclick = () => { modal.remove(); if(onConfirm) onConfirm(); };
  }
  function appAlert(title, message) { openAppModal(title, message, false); }
  function appConfirm(title, message, callback) { openAppModal(title, message, true, callback); }

  window.pantryDeleteHandler = function(type, id) {
    if (type === 'employee') { appConfirm('Delete Staff', 'Send to Recycle Bin?', () => { const targeted = employeeList.find(e => e.id === id); if(targeted) { db.ref('recycleBin/employees/' + id).set(targeted); db.ref('employees/' + id).remove(); }}); }
    else if (type === 'pantry') { 
        appConfirm('Delete Team Member', 'Send to Recycle Bin?', () => { 
            const targeted = pantryTeam.find(p => p.id === id); 
            if(targeted) { db.ref('recycleBin/pantryTeam/' + id).set(targeted); db.ref('pantryTeam/' + id).remove(); employeeList.forEach(emp => { if(emp.assignedPantryId === id) db.ref('employees/' + emp.id).update({ assignedPantryId: "" }); }); }
        }); 
    }
    else if (type === 'canteen') { appConfirm('Delete Vendor', 'Remove this canteen?', () => { db.ref('canteens/' + id).remove().then(() => appAlert('Success', 'Vendor removed completely!')).catch(err => appAlert('Error', err.message)); }); }
    else if (type === 'venue') { appConfirm('Delete Venue', 'Remove this venue location?', () => { db.ref('venues/' + id).remove().then(() => appAlert('Success', 'Location removed completely!')).catch(err => appAlert('Error', err.message)); }); }
    else if (type === 'extra') { appConfirm('Delete Record', 'Move to Recycle Bin?', () => { const targeted = extraLogsData.find(x => x.id === id); if(targeted) { db.ref('recycleBin/extraLogs/' + id).set(targeted); db.ref('extraLogs/' + id).remove(); }}); }
    else if (type === 'event') { appConfirm('Delete Record', 'Move dynamic event entry to Recycle Bin?', () => { const targeted = eventLogsData.find(e => e.id === id); if(targeted) { db.ref('recycleBin/eventLogs/' + id).set(targeted); db.ref('eventLogs/' + id).remove(); }}); }
    else if (type === 'regular_log') { appConfirm('Delete Record', 'Move to Recycle Bin?', () => { const targeted = logsData.find(l => l.id === id); if(targeted) { db.ref('recycleBin/logs/' + id).set(targeted); db.ref('logs/' + id).remove(); }}); }
    else if (type === 'upcoming_event') { appConfirm('Delete Notification', "Remove notification permanently?", () => { db.ref('upcomingEvents/' + id).remove(); }); }
  };

  window.editCanteen = function(id, currentName) {
      const modal = document.createElement('div'); modal.className = 'popup-overlay'; modal.id = 'editCanteenModal';
      modal.innerHTML = `<div class="popup-card" style="text-align:center;"><h3 style="color:#0A56D0; margin-top:0; margin-bottom:12px;">✏️ Edit Canteen Vendor</h3><input id="editCantName" value="${currentName}" style="text-align:center; margin-bottom:16px;"><div style="display:flex; gap:12px; justify-content:center; width:100%;"><button onclick="document.getElementById('editCanteenModal').remove()" class="danger" style="flex:1; border-radius:100px;">Cancel</button><button id="saveEditCantBtn" class="success" style="flex:1; border-radius:100px;">Save Change</button></div></div>`;
      document.body.appendChild(modal);
      document.getElementById('saveEditCantBtn').onclick = () => { const newName = document.getElementById('editCantName').value.trim(); if(newName) { db.ref('canteens/' + id).update({ name: newName }); modal.remove(); appAlert('Success', 'Canteen vendor updated successfully!'); } else { appAlert('Error', 'Name cannot be blank.'); } };
  };

  window.pantryRestoreHandler = function(section, id) {
    const targetData = binData[section]?.[id];
    if(!targetData) return appAlert('Error', 'Data not found.');
    db.ref(section + '/' + id).set(targetData);
    db.ref('recycleBin/' + section + '/' + id).remove();
    appAlert('Restored', 'Data recovered back successfully!');
  };

  window.pantryEditLogHandler = function(id, currentDrink) {
    const modal = document.createElement('div'); modal.className = 'popup-overlay'; modal.id = 'inlineEditPopupModal';
    modal.innerHTML = `<div class="popup-card" style="text-align:center;"><h3 style="color:#0A56D0; margin-top:0; margin-bottom:12px;">Edit Drink Selection</h3><select id="popupInlineDrinkDropdown" style="margin-bottom:20px;"><option value="Tea" ${currentDrink === 'Tea' ? 'selected' : ''}>Tea</option><option value="Coffee" ${currentDrink === 'Coffee' ? 'selected' : ''}>Coffee</option><option value="Green Tea" ${currentDrink === 'Green Tea' ? 'selected' : ''}>Green Tea</option><option value="Black Tea" ${currentDrink === 'Black Tea' ? 'selected' : ''}>Black Tea</option><option value="Black Coffee" ${currentDrink === 'Black Coffee' ? 'selected' : ''}>Black Coffee</option><option value="Lemon Tea" ${currentDrink === 'Lemon Tea' ? 'selected' : ''}>Lemon Tea</option></select><div style="display:flex; gap:12px; justify-content:center; width:100%;"><button onclick="document.getElementById('inlineEditPopupModal').remove()" style="background:#E2E8F0; color:#1F1F1F; flex:1; border-radius:100px;">Cancel</button><button id="popupInlineSaveBtn" class="success" style="flex:1; border-radius:100px;">Save Change</button></div></div>`;
    document.body.appendChild(modal);
    document.getElementById('popupInlineSaveBtn').onclick = function() { const selectedValue = document.getElementById('popupInlineDrinkDropdown').value; if (selectedValue) { db.ref('logs/' + id).update({ drink: selectedValue }); modal.remove(); appAlert('Updated', 'Drink record corrected successfully!'); } };
  };

  window.handleDirectRowEditTrigger = function(empId) {
    const selectedDateYMD = document.getElementById('beverageEntryDate')?.value || new Date().toISOString().split('T')[0];
    const selectedDateDMY = convertYMDtoDMY(selectedDateYMD);
    const matchedLogs = logsData.filter(l => l.employeeId === empId && l.date === selectedDateDMY);
    if (matchedLogs.length === 0) return appAlert('No Records', 'No active logs found for this employee on the selected date.');
    const modal = document.createElement('div'); modal.className = 'popup-overlay'; modal.id = 'directRowEditModal';

  async function importExcel() {

    input.onchange = async (e) => {
      const file = e.target.files[0]; const data = await file.arrayBuffer(); const wb = XLSX.read(data); const sheet = wb.Sheets[wb.SheetNames[0]]; const rows = XLSX.utils.sheet_to_json(sheet); let count = 0;
      rows.forEach((row, idx) => {
        const name = row['Name'] || row['Employee Name'] || row['EmployeeName'] || '', cat = row['Category'] || 'Staff', pantryName = row['Pantry Boy'] || row['PantryBoy'] || row['Pantry Name'] || '', sheetLocationNode = row['Location'] || row['Venue'] || row['Location Node'] || '';
        if(name) {
          const id = 'emp_'+Date.now()+'_'+idx+'_'+Math.floor(Math.random()*10000); let assignedId = ""; 
          if(pantryName) { const found = pantryTeam.find(p => p.name.toLowerCase() === pantryName.toString().toLowerCase().trim()); if(found) assignedId = found.id; }
          db.ref('employees/'+id).set({ id, name: String(name), category: String(cat), assignedPantryId: assignedId, locationNode: sheetLocationNode ? String(sheetLocationNode).trim() : "" }); count++;
        }
      });
      appAlert('Import Successful', `✅ ${count} Employees Imported with Auto-Locations Mapping!`);
    }; input.click();
  }

  // --- ANDROID POPUP PREVIEW & PRINT FUNCTION ---
  window.previewIndividualReport = function(type) {
    const month = document.getElementById('reportMonth')?.value;
    if(!month) return appAlert('Error', 'Please select a month first.');
    const dateObj = new Date(month + '-01');
    const monthStr = dateObj.toLocaleString('en-US', { month: 'long', year: 'numeric' }).toUpperCase();
    
    let html = '';
    
    if(type === 'regular') {
      const cat = document.getElementById('reportCategory').value;
      if(cat === 'All') return appAlert('Notice', 'Please select a specific category (Faculty, Staff, Law, Outsourced) to preview and print.');
      
      const isDAU = (cat.toLowerCase() === 'faculty' || cat.toLowerCase() === 'staff') ? 'DAU ' : '';
      const titleStr = `MONTHLY TEA OF ${isDAU}${cat.toUpperCase()} (${monthStr})`;
      
      let trs = ''; let sumT=0, sumC=0, sumGT=0, sumLT=0, sumBT=0, sumBC=0; let srNo = 1;
      const empsInCategory = employeeList.filter(e => (e.category || '').trim().toLowerCase() === cat.toLowerCase());
      
      if(empsInCategory.length === 0) return appAlert('No Data', 'No employees found in this category.');

      empsInCategory.forEach(emp => {
          let t=0, c=0, gt=0, lt=0, bt=0, bc=0;
          logsData.filter(l => l.employeeId === emp.id && parseDMYToYMD(l.date).startsWith(month)).forEach(log => {
              const d = (log.drink || '').toLowerCase().trim();
              if(d === 'tea') t++; else if(d === 'coffee') c++; else if(d === 'green tea') gt++; else if(d === 'lemon tea') lt++; else if(d === 'black tea') bt++; else if(d === 'black coffee') bc++;
          });
          sumT+=t; sumC+=c; sumGT+=gt; sumLT+=lt; sumBT+=bt; sumBC+=bc;
          trs += `<tr><td>${srNo++}</td><td class="left-align">${safeStr(emp.name)}</td><td>${t}</td><td>${c}</td><td>${gt}</td><td>${lt}</td><td>${bt}</td><td>${bc}</td><td></td></tr>`;
      });
      
      html = `
         <table class="print-table">
             <thead>
                <tr><th colspan="9" style="border:none; font-size:18px; text-decoration:underline; padding-bottom:20px; text-align:center;">${titleStr}</th></tr>
                <tr><th class="sr-col">SR.<br>NO.</th><th class="left-align name-col">EMPLOYEE NAME</th><th class="drink-col">TEA</th><th class="drink-col">COFFEE</th><th class="drink-col">GREEN<br>TEA</th><th class="drink-col">LEMON<br>TEA</th><th class="drink-col">BLACK<br>TEA</th><th class="drink-col">BLACK<br>COFFEE</th><th class="sign-col">SIGNATURE</th></tr>
             </thead>
             <tbody>${trs}</tbody>
             <tbody class="total-row-grp">
                <tr class="total-row"><td></td><td class="left-align" style="text-align:center;">TOTAL</td><td>${sumT}</td><td>${sumC}</td><td>${sumGT}</td><td>${sumLT}</td><td>${sumBT}</td><td>${sumBC}</td><td></td></tr>
             </tbody>
         </table>
      `;
    } 
    else if (type === 'extra') {
       const titleStr = `EXTRA TEA ALLOCATION REPORT (${monthStr})`;
       let trs = ''; let extraCount = 0;
       extraLogsData.filter(ex => ex.date && parseDMYToYMD(ex.date).startsWith(month)).forEach(ex => {
          trs += `<tr><td>${ex.id}</td><td class="left-align">${ex.employeeName}</td><td>${ex.drink}</td><td>${ex.qty}</td><td class="left-align">${ex.remarks || 'None'}</td><td>${ex.date}</td><td>${ex.pantryName}</td></tr>`; extraCount++;
       });
       if(extraCount === 0) return appAlert('No Data', 'No extra tea logs found for this month.');
       html = `<table class="print-table"><thead><tr><th colspan="7" style="border:none; font-size:18px; text-decoration:underline; padding-bottom:20px; text-align:center;">${titleStr}</th></tr><tr><th>LOG ID</th><th class="left-align">EMPLOYEE NAME</th><th>CHOICE</th><th>QUANTITY</th><th class="left-align">REMARKS</th><th>DATE</th><th>SERVED BY</th></tr></thead><tbody>${trs}</tbody></table>`;
    } 
    else if (type === 'meeting') {
       const titleStr = `MEETING & GUEST REFRESHMENT REPORT (${monthStr})`;
       let trs = ''; let meetCount = 0;
       eventLogsData.filter(ev => ev.date && parseDMYToYMD(ev.date).startsWith(month)).forEach(ev => {
          let itemsStr = ''; if(ev.items && Array.isArray(ev.items)) { itemsStr = ev.items.map(i => `${i.name} (Qty:${i.qty}, Time:${i.time||'N/A'}, Rate:₹${i.rate})`).join(' | '); }
          trs += `<tr><td>${ev.id}</td><td class="left-align">${ev.canteenSource||'-'}</td><td class="left-align">${ev.orderedBy||'-'}</td><td class="left-align">${ev.eventName}</td><td>${ev.date}</td><td>${ev.time}</td><td class="left-align">${ev.venue}</td><td class="left-align">${itemsStr}</td><td>${ev.amount}</td><td>${ev.pantryName}</td></tr>`; meetCount++;
       });
       if(meetCount === 0) return appAlert('No Data', 'No meeting records found for this month.');
       html = `<table class="print-table"><thead><tr><th colspan="10" style="border:none; font-size:18px; text-decoration:underline; padding-bottom:20px; text-align:center;">${titleStr}</th></tr><tr><th>LOG ID</th><th class="left-align">CANTEEN VENDOR</th><th class="left-align">ORDERED BY</th><th class="left-align">EVENT TITLE</th><th>DATE</th><th>TIME</th><th class="left-align">VENUE</th><th class="left-align">DETAILED ITEMS</th><th>TOTAL (₹)</th><th>LOG OPERATOR</th></tr></thead><tbody>${trs}</tbody></table>`;
    }

    const printContainer = document.getElementById('printAreaContainer');
    printContainer.innerHTML = `
      <div class="preview-card">
         <div class="preview-header hide-on-print">
            <button onclick="window.print()" class="success" style="font-size:0.95rem; padding:10px 18px; border-radius:8px; display:flex; align-items:center; gap:6px;">🖨️ Print</button>
            <button onclick="window.exportIndividualReport('${type}')" class="btn" style="font-size:0.95rem; padding:10px 18px; border-radius:8px; background:#0A56D0; display:flex; align-items:center; gap:6px;">📊 Excel</button>
            <button onclick="document.getElementById('printAreaContainer').classList.add('hidden')" class="danger" style="font-size:0.95rem; padding:10px 18px; border-radius:8px; display:flex; align-items:center; gap:6px;">❌ Close</button>
         </div>
         <div class="preview-content">
            ${html}
         </div>
      </div>
    `;
    printContainer.classList.remove('hidden');
  };

  // --- UPDATED EXCEL EXPORT WITH EQUAL COLUMNS & FORMATTING ---
  window.exportIndividualReport = function(type) {
    const month = document.getElementById('reportMonth')?.value; if(!month) return appAlert('Error', 'Select month');
    const wb = XLSX.utils.book_new();
    const dateObj = new Date(month + '-01');
    const monthStr = dateObj.toLocaleString('en-US', { month: 'long', year: 'numeric' }).toUpperCase();
    
    const borderStyle = { top: {style:'thin'}, bottom: {style:'thin'}, left: {style:'thin'}, right: {style:'thin'} };
    const headerStyle = { font: { bold: true }, alignment: { horizontal: 'center', vertical: 'center', wrapText: true }, border: borderStyle };
    const cellStyleCenter = { alignment: { horizontal: 'center', vertical: 'center' }, border: borderStyle };
    const cellStyleLeft = { alignment: { horizontal: 'left', vertical: 'center' }, border: borderStyle };
    const totalStyle = { font: { bold: true }, alignment: { horizontal: 'center', vertical: 'center' }, border: borderStyle };

    if(type === 'regular') {
      const cat = document.getElementById('reportCategory').value;
      let categoriesToProcess = [];
      if (cat === 'All') { categoriesToProcess = [...new Set(employeeList.map(e => (e.category||'').trim()).filter(Boolean))]; if(categoriesToProcess.length === 0) categoriesToProcess = ['Faculty', 'Staff', 'Law', 'Outsourced']; } 
      else { categoriesToProcess = [cat.trim()]; }

      categoriesToProcess.forEach(cName => {
          const isDAU = (cName.toLowerCase() === 'faculty' || cName.toLowerCase() === 'staff') ? 'DAU ' : '';
          const titleStr = `MONTHLY TEA OF ${isDAU}${cName.toUpperCase()} (${monthStr})`;
          const titleStyle = { font: { bold: true, sz: 14, underline: true }, alignment: { horizontal: 'center', vertical: 'center' } };
          
          const row1 = [{ v: titleStr, s: titleStyle }, '', '', '', '', '', '', '', ''];
          const row2 = [
              { v: 'SR. NO.', s: headerStyle },
              { v: 'EMPLOYEE NAME', s: headerStyle },
              { v: 'TEA', s: headerStyle },
              { v: 'COFFEE', s: headerStyle },
              { v: 'GREEN\nTEA', s: headerStyle },
              { v: 'LEMON\nTEA', s: headerStyle },
              { v: 'BLACK\nTEA', s: headerStyle },
              { v: 'BLACK\nCOFFEE', s: headerStyle },
              { v: 'SIGNATURE', s: headerStyle }
          ];

          let data = [row1, row2];
          let sumT=0, sumC=0, sumGT=0, sumLT=0, sumBT=0, sumBC=0;
          const empsInCategory = employeeList.filter(e => (e.category || '').trim().toLowerCase() === cName.toLowerCase());

          let srNo = 1;
          empsInCategory.forEach(emp => {
            let t=0, c=0, gt=0, lt=0, bt=0, bc=0;
            logsData.filter(l => l.employeeId === emp.id && parseDMYToYMD(l.date).startsWith(month)).forEach(log => {
                const d = (log.drink || '').toLowerCase().trim();
                if(d === 'tea') t++; else if(d === 'coffee') c++; else if(d === 'green tea') gt++; else if(d === 'lemon tea') lt++; else if(d === 'black tea') bt++; else if(d === 'black coffee') bc++;
            });
            sumT += t; sumC += c; sumGT += gt; sumLT += lt; sumBT += bt; sumBC += bc;
            data.push([{ v: srNo++, s: cellStyleCenter }, { v: emp.name, s: cellStyleLeft }, { v: t, s: cellStyleCenter }, { v: c, s: cellStyleCenter }, { v: gt, s: cellStyleCenter }, { v: lt, s: cellStyleCenter }, { v: bt, s: cellStyleCenter }, { v: bc, s: cellStyleCenter }, { v: '', s: cellStyleCenter }]);
          });
          
          data.push([{ v: '', s: totalStyle }, { v: 'TOTAL', s: totalStyle }, { v: sumT, s: totalStyle }, { v: sumC, s: totalStyle }, { v: sumGT, s: totalStyle }, { v: sumLT, s: totalStyle }, { v: sumBT, s: totalStyle }, { v: sumBC, s: totalStyle }, { v: '', s: totalStyle }]);
          
          const ws = XLSX.utils.aoa_to_sheet(data); 
          if(!ws['!merges']) ws['!merges'] = [];
          ws['!merges'].push({ s: { r: 0, c: 0 }, e: { r: 0, c: 8 } });
          
          // EQUAL COLUMN SIZES FOR DRINKS (wch: 11)
          ws['!cols'] = [{wch: 6}, {wch: 26}, {wch: 11}, {wch: 11}, {wch: 11}, {wch: 11}, {wch: 11}, {wch: 11}, {wch: 24}];
          ws['!rows'] = data.map(() => ({ hpt: 30 })); // Height 30
          
          let sheetName = cName.substring(0, 31).replace(/[\\/*?:\[\]]/g, '');
          XLSX.utils.book_append_sheet(wb, ws, sheetName || 'Report'); 
      });

      XLSX.writeFile(wb, `Daily_Regular_Tea_Report_${month}.xlsx`);
      
    } else if(type === 'extra') {
      const titleStr = `EXTRA TEA ALLOCATION REPORT (${monthStr})`;
      const titleStyle = { font: { bold: true, sz: 14, underline: true }, alignment: { horizontal: 'center', vertical: 'center' } };
      const row1 = [{ v: titleStr, s: titleStyle }, '', '', '', '', '', ''];
      const row2 = ['LOG ID','EMPLOYEE NAME','CHOICE','QUANTITY','REMARKS','DATE','SERVED BY'].map(h => ({v: h, s: headerStyle}));
      let data = [row1, row2];

      extraLogsData.filter(ex => ex.date && parseDMYToYMD(ex.date).startsWith(month)).forEach(ex => data.push([{v:ex.id, s:cellStyleCenter}, {v:ex.employeeName, s:cellStyleLeft}, {v:ex.drink, s:cellStyleCenter}, {v:ex.qty, s:cellStyleCenter}, {v:(ex.remarks||'None'), s:cellStyleLeft}, {v:ex.date, s:cellStyleCenter}, {v:ex.pantryName, s:cellStyleCenter}]));
      
      const ws = XLSX.utils.aoa_to_sheet(data); 
      ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 6 } }];
      ws['!cols'] = [{wch: 16}, {wch: 24}, {wch: 18}, {wch: 18}, {wch: 32}, {wch: 14}, {wch: 20}];
      ws['!rows'] = data.map(() => ({ hpt: 30 }));
      XLSX.utils.book_append_sheet(wb, ws, 'Extra Tea Entries'); XLSX.writeFile(wb, `Extra_Tea_Allocation_Report_${month}.xlsx`);
      
    } else if(type === 'meeting') {
      const titleStr = `MEETING & GUEST REFRESHMENT REPORT (${monthStr})`;
      const titleStyle = { font: { bold: true, sz: 14, underline: true }, alignment: { horizontal: 'center', vertical: 'center' } };
      const row1 = [{ v: titleStr, s: titleStyle }, '', '', '', '', '', '', '', '', ''];
      const row2 = ['LOG ID', 'CANTEEN VENDOR', 'ORDERED BY', 'EVENT TITLE', 'DATE', 'TIME', 'VENUE LOCATION', 'DETAILED ITEMS', 'TOTAL (₹)', 'LOG OPERATOR'].map(h => ({v: h, s: headerStyle}));
      let data = [row1, row2];

      eventLogsData.filter(ev => ev.date && parseDMYToYMD(ev.date).startsWith(month)).forEach(ev => {
        let itemsStr = ''; if(ev.items && Array.isArray(ev.items)) { itemsStr = ev.items.map(i => `${i.name} (Qty:${i.qty}, Time:${i.time || 'N/A'}, Rate:₹${i.rate})`).join(' | '); }
        data.push([ {v:ev.id, s:cellStyleCenter}, {v:(ev.canteenSource||'-'), s:cellStyleLeft}, {v:(ev.orderedBy||'-'), s:cellStyleLeft}, {v:ev.eventName, s:cellStyleLeft}, {v:ev.date, s:cellStyleCenter}, {v:ev.time, s:cellStyleCenter}, {v:ev.venue, s:cellStyleLeft}, {v:itemsStr, s:cellStyleLeft}, {v:ev.amount, s:cellStyleCenter}, {v:ev.pantryName, s:cellStyleCenter} ]);
      });

      const ws = XLSX.utils.aoa_to_sheet(data); 
      ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 9 } }];
      ws['!cols'] = [{wch: 14}, {wch: 18}, {wch: 18}, {wch: 22}, {wch: 12}, {wch: 10}, {wch: 18}, {wch: 45}, {wch: 16}, {wch: 18}];
      ws['!rows'] = data.map(() => ({ hpt: 30 }));
      XLSX.utils.book_append_sheet(wb, ws, 'Meeting Refreshments'); XLSX.writeFile(wb, `Meeting_And_Refreshment_Report_${month}.xlsx`);
    }
  };

  function renderPantryDashboard() {
    loginScreen.classList.add('hidden'); adminScreen.classList.add('hidden'); pantryScreen.classList.remove('hidden');
    if(pantryScreen.innerHTML.indexOf('pantryDashboardUpcomingStream') === -1) {
        pantryScreen.innerHTML = `
          <div class="top-header"><h2 style="color:#0A56D0; font-size:1.2rem;">🧑‍🍳 <span id="currentPantryBoyNameDisplay"></span></h2><div style="display:flex; gap:8px;"><button id="homePantryBtn" style="background:#E2E8F0; color:#1E293B; padding:6px 12px; font-size:0.8rem; border-radius:8px;">🏠 Home</button><button id="logoutPantry" class="danger" style="padding:6px 12px; font-size:0.8rem; border-radius:8px;">Logout</button></div></div>
          <div id="livePantryBroadcastCard" class="card hidden" style="background:#FFFBEB; border: 1px solid #D97706; padding:14px; margin-bottom:12px;"><h4 style="color:#D97706; margin:0 0 8px 0; font-size:1rem; display:flex; align-items:center; gap:6px;">📢 Upcoming Meeting Notification</h4><div id="pantryDashboardUpcomingStream"></div></div>
          <div id="pantryMenuArea" class="dashboard-menu">
            <button class="dash-btn" data-tab="serve"><span>☕ Beverages Entry</span></button>
            <button class="dash-btn" data-tab="monthly" style="color:#146C43; border-color:#86EFAC; background:#DCFCE7;"><span>🗓️ Monthly Past Entry</span></button>
            <button class="dash-btn" data-tab="extra"><span>⚠️ Extra Tea Entry</span></button>
            <button class="dash-btn" data-tab="event"><span>🎪 Meeting / Guest / Events</span></button>
            <button class="dash-btn" data-tab="logs"><span>📋 My Records</span></button>
            <button class="dash-btn" data-tab="profile" style="color:#44474E; border-color:#CBD5E1; background:#F8FAFC;"><span>🔐 Change Profile PIN</span></button>
          </div>
          <div id="pantryContentArea" class="hidden" style="display:flex; flex-direction:column; flex:1; overflow:hidden;"><div class="nav-controls"><button id="pantryBackBtn">⬅ Back</button><button id="pantryHomeBtn">📊 Dashboard</button></div><div id="pantryContentTitle" style="font-weight:700; color:#0A56D0; margin-bottom:12px; font-size:1.15rem; flex-shrink:0;"></div><div id="pantryDynamicContent" style="flex:1; overflow-y:auto; padding-bottom:16px;"></div></div>
        `;
        document.getElementById('homePantryBtn').onclick = () => { pantryScreen.classList.add('hidden'); activePantryTab = null; currentUser = null; renderLogin(); };
        document.getElementById('logoutPantry').onclick = () => { appConfirm('Logout', 'Logout account?', () => { const old = currentUser.id; currentUser = null; activePantryTab = null; db.ref('sessionDevices/pantry_'+old).remove().then(() => { pantryScreen.classList.add('hidden'); renderLogin(); }); }); };
        
        const menuArea = document.getElementById('pantryMenuArea'), contentArea = document.getElementById('pantryContentArea'), contentTitle = document.getElementById('pantryContentTitle'), liveAlertCard = document.getElementById('livePantryBroadcastCard');
        document.querySelectorAll('#pantryMenuArea .dash-btn').forEach(btn => btn.addEventListener('click', (e) => {
          const tab = e.currentTarget.dataset.tab; contentTitle.innerText = btn.querySelector('span').innerText;
          menuArea.classList.add('hidden'); if(liveAlertCard) liveAlertCard.classList.add('hidden'); contentArea.classList.remove('hidden');
          activePantryTab = tab;
          if(tab === 'serve') renderServeEntry(); else if(tab === 'monthly') window.renderMonthlyEntry(); else if(tab === 'extra') renderExtraTeaSection(); else if(tab === 'event') window.renderCentralizedEventSectionUI('pantryDynamicContent', 'pntEvt'); else if(tab === 'logs') renderLogsHistory(); else if(tab === 'profile') renderPantryProfileSection();
        }));
        window.pantryBackToMenu = () => { activePantryTab = null; contentArea.classList.add('hidden'); menuArea.classList.remove('hidden'); window.renderPantryLiveUpcomingEventsCard(); document.getElementById('pantryDynamicContent').innerHTML = ''; };
        document.getElementById('pantryBackBtn').onclick = window.pantryBackToMenu; document.getElementById('pantryHomeBtn').onclick = window.pantryBackToMenu;
    }
    document.getElementById('currentPantryBoyNameDisplay').innerText = safeStr(currentUser.name); window.renderPantryLiveUpcomingEventsCard();
  }

  window.renderMonthlyEntry = function() {
      activePantryTab = 'monthly'; const myAssignedStaff = employeeList.filter(emp => emp.assignedPantryId === currentUser.id); const todayYMD = new Date().toISOString().split('T')[0]; const currentMonth = todayYMD.substring(0, 7); 
      document.getElementById('pantryDynamicContent').innerHTML = `
        <div class="card" style="padding:16px; margin-bottom:16px; display:flex; flex-direction:column; overflow:hidden; max-height:100%;">
          <div style="margin-bottom:12px; flex-shrink:0;">
            <label style="font-size:0.85rem; color:#44474E; font-weight:700; text-align:left; display:block;">Select Employee:</label><select id="monthlyEmpSelect" style="margin-bottom:8px; padding:10px;"><option value="">-- Choose Employee --</option>${myAssignedStaff.map(emp => `<option value="${emp.id}" data-name="${safeStr(emp.name).replace(/'/g, "\\'")}">${safeStr(emp.name)} [${emp.category}]</option>`).join('')}</select>
            <label style="font-size:0.85rem; color:#44474E; font-weight:700; text-align:left; display:block;">Select Month:</label><div style="display:flex; gap:8px;"><input type="month" id="monthlyMonthSelect" value="${currentMonth}" style="flex:2; margin:0; padding:10px;"><button id="loadMonthlyGridBtn" class="btn" style="flex:1; padding:10px; font-size:0.85rem;">Load Grid</button></div>
          </div>
          <div class="table-row table-header" style="padding-right:8px;"><div>Date</div><div style="text-align:center;">Morn</div><div style="text-align:center;">Aft</div></div><div id="monthlyGridContainer" style="flex:1; overflow-y:auto; margin-bottom:16px;"></div><button id="saveMonthlyBtn" class="success hidden" style="width:100%; padding:14px; font-size:1.05rem; flex-shrink:0;">💾 SAVE MONTHLY ENTRIES</button>
        </div>`;
      document.getElementById('loadMonthlyGridBtn').onclick = () => {
        const empId = document.getElementById('monthlyEmpSelect').value, monthVal = document.getElementById('monthlyMonthSelect').value;
        if(!empId) return appAlert('Error', 'Please select an employee first.'); if(!monthVal) return appAlert('Error', 'Please select a month.');
        const [yy, mm] = monthVal.split('-'), daysInMonth = new Date(yy, mm, 0).getDate(); let gridHtml = '';
        for(let d = 1; d <= daysInMonth; d++) {
          let dd = String(d).padStart(2, '0'), dmy = `${dd}/${mm}/${yy}`, mLog = logsData.find(l => l.employeeId === empId && l.date === dmy && l.session === 'Morning'), aLog = logsData.find(l => l.employeeId === empId && l.date === dmy && l.session === 'Afternoon');
          let mDrop = mLog ? `<select disabled style="background:#E2E8F0; color:#146C43; font-weight:bold;"><option>${mLog.drink}</option></select>` : `<select class="mornDrinkVal"><option value="">-</option><option>Tea</option><option>Coffee</option><option>Green Tea</option><option>Black Tea</option><option>Black Coffee</option><option>Lemon Tea</option></select>`;
          let aDrop = aLog ? `<select disabled style="background:#E2E8F0; color:#146C43; font-weight:bold;"><option>${aLog.drink}</option></select>` : `<select class="aftDrinkVal"><option value="">-</option><option>Tea</option><option>Coffee</option><option>Green Tea</option><option>Black Tea</option><option>Black Coffee</option><option>Lemon Tea</option></select>`;
          gridHtml += `<div class="table-row monthly-entry-row" data-date="${dmy}"><div><strong>${dd}</strong>/${mm}</div><div>${mDrop}</div><div>${aDrop}</div></div>`;
        }
        document.getElementById('monthlyGridContainer').innerHTML = gridHtml; document.getElementById('saveMonthlyBtn').classList.remove('hidden');
      };
      document.getElementById('saveMonthlyBtn').onclick = () => {
        const empSelect = document.getElementById('monthlyEmpSelect'), empId = empSelect.value; if(!empId) return;
        const empName = empSelect.options[empSelect.selectedIndex].dataset.name; let saved = 0; const baseTimestamp = Date.now(), rows = document.querySelectorAll('.monthly-entry-row');
        rows.forEach((row, index) => {
          const dateDMY = row.dataset.date, mEl = row.querySelector('.mornDrinkVal'), aEl = row.querySelector('.aftDrinkVal');
          if(mEl && mEl.value && mEl.value !== "-") { const logIdM = 'log_' + (baseTimestamp + (index * 2)) + '_' + Math.floor(Math.random() * 10000); db.ref('logs/' + logIdM).set({ id: logIdM, employeeId: empId, employeeName: empName, drink: mEl.value, session: 'Morning', date: dateDMY, pantryId: currentUser.id, pantryName: currentUser.name }); saved++; }
          if(aEl && aEl.value && aEl.value !== "-") { const logIdA = 'log_' + (baseTimestamp + (index * 2) + 1) + '_' + Math.floor(Math.random() * 10000); db.ref('logs/' + logIdA).set({ id: logIdA, employeeId: empId, employeeName: empName, drink: aEl.value, session: 'Afternoon', date: dateDMY, pantryId: currentUser.id, pantryName: currentUser.name }); saved++; }
        });
        if(saved > 0) { appAlert('Success', `✅ ${saved} missing entries saved for the month!`); document.getElementById('loadMonthlyGridBtn').click(); } else { appAlert('No Action', 'No new drinks selected to save.'); }
      };
  };

  renderLogin();
})();
</script>
