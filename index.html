            // NAYA FUNCTION: Admin Monthly Grid Export (With Pagination, Borders & Equal Sizes)
            window.adminExportMonthlyGrid = function(format) {
                const month = document.getElementById('reportMonth')?.value;
                const pantryId = document.getElementById('gridExportPantrySelect').value;
                const categoryVal = document.getElementById('gridExportCategorySelect').value;
                
                if (!month) return appAlert('Error', 'Select month from top.');

                const [yy, mm] = month.split('-');
                const daysInMonth = getDaysInMonth(yy, mm);
                
                let emps = employeeList;
                if (pantryId !== 'All') {
                    emps = emps.filter(e => e.assignedPantryId === pantryId);
                }
                
                if (categoryVal !== 'All') {
                    const catMatch = categoryVal.trim().toLowerCase();
                    emps = emps.filter(e => {
                        const c = (e.category || '').trim().toLowerCase();
                        if (catMatch === 'outsourced' || catMatch === 'outsource') return c.includes('outsource');
                        return c === catMatch;
                    });
                }
                
                if(!emps.length) return appAlert('Notice', 'No employees found for this selection.');

                // ====== EXCEL EXPORT LOGIC ======
                if (format === 'excel') {
                    // Styles define karna Excel ke liye (Borders & Alignment)
                    const bStyle = { style: 'thin', color: { rgb: "000000" } };
                    const cellStyle = { alignment: { horizontal: "center", vertical: "center" }, border: { top: bStyle, bottom: bStyle, left: bStyle, right: bStyle } };
                    const headStyle = { font: { bold: true }, alignment: { horizontal: "center", vertical: "center" }, border: { top: bStyle, bottom: bStyle, left: bStyle, right: bStyle }, fill: { fgColor: { rgb: "F1F5F9" } } };

                    let headers1 = [{ v: 'Date', s: headStyle }];
                    let headers2 = [{ v: '', s: headStyle }];
                    
                    const colWidths = [{ wch: 12 }]; // Date ki width fix
                    const merges = [];

                    emps.forEach((emp, i) => {
                        const baseIdx = 1 + (i * 2);
                        headers1.push({ v: emp.name, s: headStyle });
                        headers1.push({ v: '', s: headStyle }); 
                        
                        headers2.push({ v: 'Morn', s: headStyle });
                        headers2.push({ v: 'Aft', s: headStyle });
                        
                        colWidths.push({ wch: 10 }, { wch: 10 }); // Morn & Aft ki width EQUAL (10)
                        merges.push({ s: { r: 0, c: baseIdx }, e: { r: 0, c: baseIdx + 1 } }); // Naam ko 2 cell me merge karna
                    });

                    let data = [headers1, headers2];

                    for (let d = 1; d <= daysInMonth; d++) {
                        const dmy = `${String(d).padStart(2,'0')}/${mm}/${yy}`;
                        let row = [{ v: dmy, s: { font: { bold: true }, alignment: { horizontal: "center", vertical: "center" }, border: { top: bStyle, bottom: bStyle, left: bStyle, right: bStyle } } }];
                        
                        emps.forEach(emp => {
                            const mLog = logsData.find(l => l.employeeId === emp.id && l.date === dmy && l.session === 'Morning');
                            const aLog = logsData.find(l => l.employeeId === emp.id && l.date === dmy && l.session === 'Afternoon');
                            row.push({ v: mLog ? mLog.drink : '-', s: cellStyle }); // Sabme Border aur center align
                            row.push({ v: aLog ? aLog.drink : '-', s: cellStyle });
                        });
                        data.push(row);
                    }

                    const wb = XLSX.utils.book_new();
                    const ws = XLSX.utils.aoa_to_sheet(data);
                    ws['!merges'] = merges;
                    ws['!cols'] = colWidths;
                    
                    XLSX.utils.book_append_sheet(wb, ws, 'Monthly Grid');
                    XLSX.writeFile(wb, `Monthly_Grid_${categoryVal}_${month}.xlsx`);
                    appAlert('Downloaded', 'Monthly Grid Excel with borders downloaded successfully!');

                } 
                // ====== PDF / PRINT LOGIC (PAGINATED 8 NAMES PER PAGE) ======
                        else {
            let html = '';

                for (let d = 1; d <= daysInMonth; d++) {
                    const dmy = `${String(d).padStart(2,'0')}/${mm}/${yy}`;

            window.generateSplitRowsTableHtml = function(dataSourceArray, canDelete = false) {
                const flatRows = [];
                dataSourceArray.forEach(ev => {
                    if (ev.items && Array.isArray(ev.items) && ev.items.length > 0) {
                        ev.items.forEach(item => {
                            flatRows.push({
                                parentId: ev.id,
                                eventName: ev.eventName,
                                reqBy: ev.orderedBy,
                                pantry: item.servedBy || ev.servedByName || ev.pantryName || '-',
                                date: item.itemSpecificDate || ev.date,
                                vendor: item.vendor || ev.canteenSource || 'Various',
                                itemName: item.name,
                                itemQty: item.qty,
                                itemRate: item.rate,
                                itemAmount: item.amount || (item.qty * item.rate)
                            });
                        });
                    } else {
                        flatRows.push({
                            parentId: ev.id,
                            eventName: ev.eventName,
                            reqBy: ev.orderedBy,
                            pantry: ev.servedByName || ev.pantryName || '-',
                            date: ev.date,
                            vendor: ev.canteenSource || '-',
                            itemName: ev.refreshmentSummary || 'Details',
                            itemQty: '-',
                            itemRate: '-',
                            itemAmount: ev.amount || 0
                        });
                    }
                });

                flatRows.sort((a,b) => parseDMYToYMD(b.date).localeCompare(parseDMYToYMD(a.date)));

                if (!flatRows.length) {
                    return `<p style="padding:20px; text-align:center; color:#64748B;">No record archives found.</p>`;
                }

                let html = `
                  <table class="pro-table" style="width:100%; border-collapse:collapse; text-align:left; font-size:12px;">
                    <thead>
                        <tr style="background:#F1F5F9; border-bottom:2px solid #CBD5E1;">
                            <th style="padding:8px; border:1px solid #CBD5E1;">Date</th>

        itemsContainer.querySelectorAll('.dynamic-item-row-edit').forEach((row, index) => {

                    currentCatalog.push({ name: iName, rate: iRate });

                    rate: iRate,
                    amount: itemAmt,
                    itemSpecificDate: finalRowDate,

                    locationNode: locVal

            orderedBy: orderedBy,
            amount: finalTotalAmount,
            refreshmentSummary: summarySegments.join(', '),
            date: mainDate,
            canteenSource: uniqueVendors,
            servedByName: uniquePantryBoys,
            pantryName: uniquePantryBoys,
            items: newItems,
            guestSlipCreated: document.getElementById('editEvtGuestSlipCreated').checked,

            guestSlipReturned: document.getElementById('editEvtGuestSlipReturned').checked

                    renderAdminMeetingHistory();
                }

                    window.openEventHistoryModal();
                }
            }, 300);
        }).catch(err => {
            appAlert('Error', 'Update failed: ' + err.message);
        });
    };
};

                    window.openEventHistoryModal = function() {

            // ============================================================

            function renderIfNeeded() {
                if (isRendering) return;
                isRendering = true;
                if (renderTimeout) clearTimeout(renderTimeout);
                renderTimeout = setTimeout(() => {
                    try {
                        if (vendorViewParam) {
                            const vendorName = decodeURIComponent(vendorViewParam);
                            renderVendorView(vendorName);
                            isRendering = false;
                            return;
                        }

                        if (supervisorDept && linkExp && supervisorLinkId) {
                            const now = Date.now();
                            if (now > Number(linkExp)) {
                                document.getElementById('app').innerHTML =
                                    '<h2 style="text-align:center; padding:40px; color:#DC3545; width:100%; height:100vh; display:flex; justify-content:center; align-items:center;">Link Expired!<br>24 hours limit crossed.</h2>';
                            } else {
                                const linkData = supervisorLinksData[supervisorLinkId];
                                if (linkData && linkData.active !== false && now <= linkData.expiry) {
                                    renderSupervisorView(supervisorDept);

window.renderWeekendDutyInterface = function() {
    const pSelect = document.getElementById('wDutyPantrySelect');
    const dSelect = document.getElementById('wDutyDayType');
    const searchInp = document.getElementById('wDutyEmpSearch');
    const selectAll = document.getElementById('wDutySelectAll');
    const listContainer = document.getElementById('wDutyEmployeeList');
    function populateList() {
        const pId = pSelect.value;
        const dayType = dSelect.value;
        const q = searchInp.value.toLowerCase().trim();

        if(!pId) {
            listContainer.innerHTML = '<p style="padding:12px; text-align:center; color:#64748B; font-size:12px;">Please select the pantry boy from above.</p>';
            return;
        }

        const filtered = employeeList.filter(e => !q || (e.name || '').toLowerCase().includes(q));
        if(!filtered.length) {
            listContainer.innerHTML = '<p style="padding:12px; text-align:center; color:#64748B; font-size:12px;">No employees match search.</p>';
            return;
        }

        listContainer.innerHTML = filtered.map(emp => {
            const currentAllottedPantry = weekendDutiesData[dayType]?.[emp.id] || '';
            const isChecked = currentAllottedPantry === pId ? 'checked' : '';
            const otherPantryName = currentAllottedPantry && currentAllottedPantry !== pId ? 
                ` <span style="color:#D97706; font-weight:bold;">(Allotted: ${pantryTeam.find(p=>p.id===currentAllottedPantry)?.name || 'Other'})</span>` : '';

            return `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 8px; border-bottom:1px solid #E2E8F0; font-size:12px;">
                    <span><strong>${safeStr(emp.name)}</strong> <small style="color:#64748B;">[${emp.category}]</small>${otherPantryName}</span>
                    <input type="checkbox" class="w-emp-duty-check" data-id="${emp.id}" ${isChecked} style="width:16px; height:16px; accent-color:#0A56D0;">
                </div>
            `;
        }).join('');
    }

    // 📋 લાઈવ સમરી બોર્ડ રેન્ડર કરવાનું ફંક્શન (નીચે લિસ્ટ બતાવશે)
    function renderLiveDutySummary() {
        const summaryContainer = document.getElementById('wDutyLiveSummaryContainer');
        if(!summaryContainer) return;

        const dayTypes = ['Saturday', 'Sunday', 'Holiday'];
        let hasAnyData = false;
        let html = '';

        dayTypes.forEach(day => {
            const dayDuties = weekendDutiesData[day] || {};
            const empIds = Object.keys(dayDuties);

            if(empIds.length > 0) {
                hasAnyData = true;

                // પેન્ટ્રી બોય વાઇઝ ગ્રુપ બનાવવું
                const groupedByPantry = {};
                empIds.forEach(empId => {
                    const pId = dayDuties[empId];
                    if(!groupedByPantry[pId]) groupedByPantry[pId] = [];
                    const empObj = employeeList.find(e => e.id === empId);
                    if(empObj) groupedByPantry[pId].push(empObj.name);
                });

                let dayBadgeBg = day === 'Saturday' ? '#3B82F6' : (day === 'Sunday' ? '#EF4444' : '#10B981');

                html += `
                    <div style="margin-bottom:12px; border:1px solid #E2E8F0; border-radius:8px; overflow:hidden;">
                        <div style="background:${dayBadgeBg}; color:#fff; padding:6px 10px; font-weight:bold; font-size:12px;">
                            📌 ${day} Duty Assignments
                        </div>
                        <div style="padding:6px 8px; background:#FAFAFA;">
                `;

                for (const pId in groupedByPantry) {
                    const pantryName = pantryTeam.find(p => p.id === pId)?.name || 'Unknown Staff';
                    const empsList = groupedByPantry[pId];

                    html += `
                        <div style="background:#fff; border:1px solid #CBD5E1; border-radius:6px; padding:8px; margin-bottom:6px;">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; border-bottom:1px dashed #CBD5E1; padding-bottom:4px;">
                                <strong style="color:#0A56D0; font-size:13px;">🧑‍🍳 ${pantryName} <span style="color:#64748B; font-size:11px;">(${empsList.length} Employees)</span></strong>

                                    <button onclick="window.quickEditDutyRoster('${pId}', '${day}')" style="background:#E2E8F0; color:#0A56D0; border:none; padding:3px 8px; border-radius:4px; font-size:11px; cursor:pointer; font-weight:bold; margin-right:4px;">✏️ Edit</button>
                                    <button onclick="window.clearPantryDayDuty('${pId}', '${day}')" style="background:#FEE2E2; color:#DC3545; border:none; padding:3px 8px; border-radius:4px; font-size:11px; cursor:pointer; font-weight:bold;">🗑 Clear</button>
                                </div>
                            </div>
                            <div style="color:#334155; font-size:11px; line-height:1.4;">
                                ${empsList.join(', ')}
                            </div>
                        </div>
                    `;
                }

                html += `</div></div>`;
            }
        });

        if(!hasAnyData) {
            summaryContainer.innerHTML = '<p style="padding:12px; text-align:center; color:#94A3B8;">Currently, there are no duties allocated for Saturdays, Sundays, or holidays.</p>';
        } else {
            summaryContainer.innerHTML = html;
        }
    }

    pSelect.onchange = populateList;
    dSelect.onchange = populateList;
    searchInp.oninput = populateList;
    selectAll.onchange = function() {
        document.querySelectorAll('.w-emp-duty-check').forEach(cb => cb.checked = this.checked);
    };

    document.getElementById('saveWeekendDutyBtn').onclick = function() {
        const pId = pSelect.value;
        const dayType = dSelect.value;
        if(!pId) return appAlert('Error', 'Please select a Pantry Boy.');

        const checks = listContainer.querySelectorAll('.w-emp-duty-check');
        const updates = {};

        checks.forEach(cb => {
            const empId = cb.dataset.id;
            if(cb.checked) {
                updates[`weekendDuties/${dayType}/${empId}`] = pId;
            } else {
                if(weekendDutiesData[dayType]?.[empId] === pId) {
                    updates[`weekendDuties/${dayType}/${empId}`] = null;
                }
            }
        });

        db.ref().update(updates).then(() => {
            appAlert('Success', 'Duty Roster updated successfully!');
            populateList();
            renderLiveDutySummary();
        });
    };

    // લિસ્ટમાંથી સીધું જ એડિટ મોડમાં જવાનું ફંક્શન
    window.quickEditDutyRoster = function(pId, day) {
        pSelect.value = pId;
        dSelect.value = day;
        populateList();
        document.getElementById('adminContent').scrollTo({ top: 0, behavior: 'smooth' });
    };

    // લિસ્ટમાંથી સીધી ડ્યુટી કાઢી નાખવાનું ફંક્શન
    window.clearPantryDayDuty = function(pId, day) {
        const pantryName = pantryTeam.find(p => p.id === pId)?.name || 'Staff';
        appConfirm('Clear Duty', `Are you sure you want to remove all ${day} duties for ${pantryName}?`, () => {
            const dayDuties = weekendDutiesData[day] || {};
            const updates = {};
            for (const empId in dayDuties) {
                if (dayDuties[empId] === pId) {
                    updates[`weekendDuties/${day}/${empId}`] = null;
                }
            }
            db.ref().update(updates).then(() => {
                appAlert('Cleared', 'Duties removed successfully.');
                populateList();
                renderLiveDutySummary();
            });
        });
    };

// 🔒 પેન્ટ્રી બોય લોકિંગ એન્જિન હૂક - જેને ડ્યુટી નથી એને એન્ટ્રી ના કરવા દેવી
window.checkPantryBoyDutyAccessToday = function(pantryId) {
    const today = new Date();
    const dayNum = today.getDay(); // 0 = Sunday, 6 = Saturday
    const ymdToday = today.toISOString().split('T')[0];

    let currentDayType = '';
    if (publicHolidaysData[ymdToday]) {
        currentDayType = 'Holiday';
    } else if (dayNum === 6) {
        currentDayType = 'Saturday';
    } else if (dayNum === 0) {
        currentDayType = 'Sunday';
    }

    // જો આજનો દિવસ નોર્મલ ચાલુ દિવસ હોય (સોમ થી શુક્ર) તો ઓપન રાખવું
    if(!currentDayType) return { allowed: true };

    // જો શનિ/રવિ/રજા હોય, તો ચેક કરો કે આ પેન્ટ્રી બોય પાસે કોઈ એમ્પ્લોયી અલોટ થયેલો છે?
    const dayDuties = weekendDutiesData[currentDayType] || {};
    const isAssigned = Object.values(dayDuties).includes(pantryId);

    if(isAssigned) {
        return { allowed: true, type: currentDayType };
    } else {
        return { allowed: false, type: currentDayType };
    }
};

            // નવો Date Parser કોડ (તારીખનો પ્રોબ્લેમ સોલ્વ કરવા માટે)
            window.parseExcelDateToDMY = function(rawDate) {
                try {
                    if (rawDate === undefined || rawDate === null || rawDate === '') return '';
                    
                    if (rawDate instanceof Date && !isNaN(rawDate)) { 
                        const dd = String(rawDate.getDate()).padStart(2,'0'); 
                        const mm = String(rawDate.getMonth()+1).padStart(2,'0'); 
                        const yyyy = rawDate.getFullYear(); 
                        return `${dd}/${mm}/${yyyy}`; 
                    }
                    
                    if (typeof rawDate === 'number' && !isNaN(rawDate)) { 
                        if (rawDate > 59 && rawDate < 60000) { 
                            const utc_days = Math.floor(rawDate - 25569); 
                            const utc_value = utc_days * 86400; 
                            const date_info = new Date(utc_value * 1000); 
                            const dd = String(date_info.getDate()).padStart(2,'0'); 
                            const mm = String(date_info.getMonth()+1).padStart(2,'0'); 
                            const yyyy = date_info.getFullYear(); 
                            if (yyyy > 1900 && yyyy < 2100) return `${dd}/${mm}/${yyyy}`; 
                        } 
                    }
                    
                    let str = String(rawDate).trim(); 
                    if (!str) return ''; 
                    
                    if (str.includes('/')) { 
                        const parts = str.split('/').map(p=>p.trim()); 
                        if (parts.length === 3) { 
                            if (parts[2].length === 2) parts[2] = '20' + parts[2];
                            if (parts[2].length === 4) {
                                if (Number(parts[0]) > 12) return `${parts[0].padStart(2,'0')}/${parts[1].padStart(2,'0')}/${parts[2]}`;
                                return `${parts[1].padStart(2,'0')}/${parts[0].padStart(2,'0')}/${parts[2]}`; 
                            }
                            if (parts[0].length === 4) return `${parts[2].padStart(2,'0')}/${parts[1].padStart(2,'0')}/${parts[0]}`; 
                        } 
                    }
                    
                    if (str.includes('-')) { 
                        const parts = str.split('-').map(p=>p.trim()); 
                        if (parts.length === 3) { 
                            if (parts[2].length === 2) parts[2] = '20' + parts[2];
                            if (parts[2].length === 4) return `${parts[0].padStart(2,'0')}/${parts[1].padStart(2,'0')}/${parts[2]}`; 
                            if (parts[0].length === 4) return `${parts[2].padStart(2,'0')}/${parts[1].padStart(2,'0')}/${parts[0]}`; 
                        } 
                    }
                    
                    const d = new Date(str); 
                    if (!isNaN(d) && d.getFullYear() > 1900) { 
                        const dd = String(d.getDate()).padStart(2,'0'); 
                        const mm = String(d.getMonth()+1).padStart(2,'0'); 
                        const yyyy = d.getFullYear(); 
                        return `${dd}/${mm}/${yyyy}`; 
                    } 
                    return '';
                } catch(e) { return ''; }
            };

            function getExcelField(row, names) { const norm = {}; for (let k in row) { if (Object.prototype.hasOwnProperty.call(row, k)) { norm[k.toString().trim().toLowerCase()] = row[k]; } } for (let n of names) { let key = n.toLowerCase(); if (norm.hasOwnProperty(key)) return norm[key]; for (let rk in norm) { if (rk.includes(key)) return norm[rk]; } } return ''; }

            window.importMeetingExcelFile = async function(event) {
                const file = event.target.files[0]; 
                if (!file) return; 
                appAlert('Reading File', 'Please wait, reading ' + file.name + '...'); 
                try { 
                    const data = await file.arrayBuffer(); 
                    const wb = XLSX.read(data, { cellDates: true }); 
                    const firstSheetName = wb.SheetNames[0]; 
                    const sheet = wb.Sheets[firstSheetName]; 
                    const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" }); 
                    
                    if (!rows || rows.length === 0) { 
                        appAlert('Import Error', 'Excel is empty'); 
                        event.target.value = ''; 
                        return; 
                    } 
                    
                    let importCount = 0; 
                    const groups = {}; 
                    
                    rows.forEach((row) => { 
                        let rawDate = getExcelField(row, ['Date']); 
                        let itemName = getExcelField(row, ['Item', 'Item Name']); 
                        let qty = Number(getExcelField(row, ['Qty', 'Quantity']) || 1); 
                        let rate = Number(getExcelField(row, ['Rate']) || 0); 
                        let amount = Number(getExcelField(row, ['Amount']) || (qty * rate)); 
                        let reqName = getExcelField(row, ["Requisitioner's Name", 'Ordered By', 'Organizer']) || 'General'; 
                        let purpose = getExcelField(row, ['Purpose', 'Meeting Purpose']) || 'Meeting Refreshment'; 
                        let location = getExcelField(row, ['Location', 'Venue']) || 'Campus'; 
                        let vendor = getExcelField(row, ['Vendor']) || 'Padmakamal'; 
                        let servedBy = getExcelField(row, ['Served By', 'Pantry Boy']) || 'General'; 
                        
                        if (!itemName.toString().trim()) return; 
                        
                        let formattedDMY = window.parseExcelDateToDMY(rawDate); 
                        if (!formattedDMY) formattedDMY = getTodayInDMY(); 
                        
                        const groupKey = `${purpose.trim()}_${reqName.trim()}_${formattedDMY}`; 
                        if (!groups[groupKey]) { 
                            groups[groupKey] = { purpose: purpose, orderedBy: reqName, date: formattedDMY, items: [] }; 
                        } 
                        groups[groupKey].items.push({ 
                            vendor: vendor, type: '🍪 Snacks/Food', name: itemName, qty: qty, unit: 'Nos', 
                            rate: rate, amount: amount, itemSpecificDate: formattedDMY, servedBy: servedBy, locationNode: location 
                        }); 
                    }); 
                    
                    const updates = {}; 
                    for (const key in groups) {

                            pantryName: pantryBoys, refreshmentSummary: summary, showNotification: false, 
                            guestSlipCreated: false, guestSlipSigned: false, guestSlipReturned: false 
                        }; 
                        importCount++; 
                    } 
                    
                    if (importCount > 0) { 
                        await db.ref().update(updates); 
                        appAlert('Import Successful', `✅ ${importCount} meeting log(s) imported! Dates saved correctly.`); 
                    } else { 
                        appAlert('Import Failed', 'No valid rows'); 
                    } 
                } catch (err) { 
                    appAlert('Import Error', err.message);

            window.handleMgExcelUpload = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                appAlert('Reading File', 'Please wait, importing data from Excel...');
                
                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        const data = new Uint8Array(event.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.SheetNames[0];
                        const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet], { raw: true });

                        const updates = {};
                        let importCount = 0;

                        jsonData.forEach(row => {
                            let rawDate = new Date().toISOString().split('T')[0];
                            
                            if (row.Date) { 
                                if (typeof row.Date === 'number') {
                                    const excelEpoch = Date.UTC(1899, 11, 30);
                                    const d = new Date(excelEpoch + (row.Date * 86400000));
                                    const year = d.getUTCFullYear();
                                    const month = String(d.getUTCMonth() + 1).padStart(2, '0');
                                    const day = String(d.getUTCDate()).padStart(2, '0');
                                    rawDate = `${year}-${month}-${day}`;
                                } else if (typeof row.Date === 'string') {
                                    let parts = row.Date.split(/[-/]/);
                                    if (parts.length === 3) {
                                        if (parts[2].length === 4) { rawDate = `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`; } 
                                        else if (parts[0].length === 4) { rawDate = `${parts[0]}-${parts[1].padStart(2,'0')}-${parts[2].padStart(2,'0')}`; }
                                    }
                                }
                            }

                            const item = row.Item || row['Item Name'] || row.Items || '';
                            const qty = parseFloat(row.Qty || row.Quantity || 0) || 0;
                            const rate = parseFloat(row.Rate || row.Price || 0) || 0;
                            const amount = parseFloat(row.Amount) || (qty * rate);
                            const reqName = row["Requisitioner's Name"] || row['Requisitioner Name'] || row['Requisitioner'] || row['Req Name'] || '';
                            const purpose = row.Purpose || row['Event Name'] || 'Meeting / Guest';
                            const location = row.Location || row.Place || '';
                            const vendor = row.Vendor || row['Vendor Name'] || '';
                            const servedBy = row["Served By"] || row['ServedBy'] || row['Served by'] || '';

                            if(item && qty > 0) {
                                const id = 'mgrec_' + Date.now() + Math.random().toString(36).substring(2, 7);
                                updates['meetingsGuestsRecords/' + id] = {
                                    id: id,
                                    RawDate: rawDate, 
                                    DateFormatted: convertYMDtoDMY(rawDate), 
                                    Day: getDayOfWeek(convertYMDtoDMY(rawDate)),
                                    Item: item, Qty: qty, Rate: rate, Amount: amount,
                                    ReqName: reqName, Purpose: purpose, Location: location,
                                    Vendor: vendor, ServedBy: servedBy, Status: 'Pending', Timestamp: Date.now()
                                };
                                importCount++;
                            }
                        });

                        if(importCount > 0) {
                            db.ref().update(updates).then(() => {
                                appAlert('Success', `✅ ${importCount} Records imported from Excel to Firebase!`);
                            });
                        } else {
                            appAlert('Error', 'No valid records found in Excel.');
                        }
                    } catch (err) {
                        console.error(err);
                        appAlert("Error", "Failed to process Excel file.");
                    } finally {
                        document.getElementById('mgExcelFileInput').value = '';
                    }
                };
                reader.readAsArrayBuffer(file);
            };

                                    Day: getDayOfWeek(item.itemSpecificDate || ev.date) || '',
                                    Item: item.name, Qty: item.qty, Rate: item.rate || 0,
                                    Amount: item.amount || (item.qty * (item.rate || 0)),
                                    ReqName: ev.orderedBy || '-', Purpose: ev.eventName || '-',
                                    Location: item.locationNode || '-', Vendor: item.vendor || ev.canteenSource || '-',
                                    ServedBy: item.servedBy || ev.servedByName || ev.pantryName || '-',
                                    Timestamp: ev.timestamp || new Date(parseDMYToYMD(item.itemSpecificDate || ev.date)).getTime() || 0,
                                    isOldEvent: true, originalId: ev.id
                                });
                            });
                        } else {
                            combinedRecords.push({
                                id: ev.id, DateFormatted: ev.date, Day: getDayOfWeek(ev.date) || '',
                                Item: ev.refreshmentSummary || 'Meeting Details', Qty: '-', Rate: '-',
                                Amount: ev.amount || 0, ReqName: ev.orderedBy || '-', Purpose: ev.eventName || '-',
                                Location: '-', Vendor: ev.canteenSource || '-', ServedBy: ev.servedByName || ev.pantryName || '-',
                                Timestamp: ev.timestamp || new Date(parseDMYToYMD(ev.date)).getTime() || 0,
                                isOldEvent: true, originalId: ev.id
                            });
                        }
                    });
                }

                // Role Base Filter (Pantry boy can only see his own, Admin sees all)
                if (window.mgCurrentRole === 'pantry' && typeof currentUser !== 'undefined' && currentUser) {
                    combinedRecords = combinedRecords.filter(rec => {
                        const sBy = (rec.ServedBy || '').toLowerCase();
                        return sBy.includes(currentUser.name.toLowerCase());
                    });
                }

                // Month Filter
                let filteredRecords = combinedRecords.filter(rec => {
                    let recYMD = '';
                    if (rec.DateFormatted && rec.DateFormatted.includes('/')) {
                        recYMD = parseDMYToYMD(rec.DateFormatted);
                    } else if (rec.RawDate) {
                        recYMD = rec.RawDate;
                    } else {
                        recYMD = new Date(rec.Timestamp).toISOString().split('T')[0];
                    }
                    return recYMD.startsWith(selectedMonthYMD);
                });

                // Search Filter
                if (searchQuery) {
                    filteredRecords = filteredRecords.filter(rec => 
                        Object.values(rec).some(val => String(val).toLowerCase().includes(searchQuery))
                    );
                }

                const sorted = filteredRecords.sort((a, b) => {
                    let dateA = parseDMYToYMD(a.DateFormatted) || new Date(a.Timestamp).toISOString();
                    let dateB = parseDMYToYMD(b.DateFormatted) || new Date(b.Timestamp).toISOString();
                    return dateA.localeCompare(dateB); 
                });

                let html = '';
                if(sorted.length === 0) {
                    html = `<div style="text-align:center; padding:30px; color:#64748b; font-weight:bold; background:#fff; border-radius:10px;">No records found.</div>`;
                } else {
                    html = sorted.map(rec => {
                        let actionBtn = '';
                        
                        // Edit & Delete Buttons updated
                        if (rec.isOldEvent) {
                            actionBtn = `
                                <button onclick="window.editMeetingEvent('${rec.originalId}')" style="background:#0284c7; color:white; border:none; padding:6px 12px; border-radius:6px; font-weight:bold; font-size:11px; cursor:pointer;">✏️ Edit</button>
                                <button onclick="window.pantryDeleteHandler('event', '${rec.originalId}')" style="background:#ef4444; color:white; border:none; padding:6px 12px; border-radius:6px; font-weight:bold; font-size:11px; cursor:pointer;">🗑 Delete</button>
                            `;
                        } else {
                            actionBtn = `
                                <button onclick="window.editNewMgRecord('${rec.id}')" style="background:#0284c7; color:white; border:none; padding:6px 12px; border-radius:6px; font-weight:bold; font-size:11px; cursor:pointer;">✏️ Edit</button>
                                <button onclick="window.deleteMgRecord('${rec.id}')" style="background:#ef4444; color:white; border:none; padding:6px 12px; border-radius:6px; font-weight:bold; font-size:11px; cursor:pointer;">🗑 Delete</button>
                            `;
                        }

                        return `
                            <div class="mg-history-card">
                                <div class="mg-hc-header">
                                    <span class="mg-hc-date">📅 ${rec.DateFormatted} <span style="font-weight:normal; color:#64748b; font-size:11px;">(${rec.Day})</span></span>
                                </div>
                                <div class="mg-hc-body">
                                    <div class="mg-hc-item">🔸 ${rec.Item}</div>
                                    <div><b>Qty:</b> ${rec.Qty}</div>
                                    <div><b>Rate:</b> ${rec.Rate !== '-' ? '₹'+rec.Rate : '-'}</div>
                                    <div><b>Purpose:</b> ${rec.Purpose}</div>
                                    <div><b>Req By:</b> ${rec.ReqName}</div>
                                    <div><b>Location:</b> ${rec.Location}</div>
                                    <div><b>Served By:</b> ${rec.ServedBy}</div>
                                    <div class="mg-hc-full" style="margin-top:4px; grid-column: span 2;"><b>Vendor:</b> <span style="color:#d97706;">${rec.Vendor}</span></div>
                                    <div class="mg-hc-amt">Total Amount: ₹${rec.Amount}</div>
                                </div>
                                <div class="mg-hc-footer">${actionBtn}</div>
                            </div>
                        `;
                    }).join('');
                }

                if(containerMain) containerMain.innerHTML = html;
                if(containerPopup) containerPopup.innerHTML = html;
            };

            // New Edit Function for New Records
            window.editNewMgRecord = function(id) {
                const rec = mgRecordsData.find(r => r.id === id);
                if(!rec) return appAlert('Error', 'Record not found.');

                const vendorOpts = canteenList.map(c => `<option value="${safeStr(c.name)}" ${rec.Vendor === c.name ? 'selected':''}>${safeStr(c.name)}</option>`).join('');
                const pantryOpts = `<option value="Multiple Pantry Boys" ${rec.ServedBy === 'Multiple Pantry Boys' ? 'selected':''}>Multiple Pantry Boys</option><option value="Through Vendor" ${rec.ServedBy === 'Through Vendor' ? 'selected':''}>Through Vendor</option>` + pantryTeam.map(p => `<option value="${safeStr(p.name)}" ${rec.ServedBy === p.name ? 'selected':''}>${safeStr(p.name)}</option>`).join('');

                const modal = document.createElement('div');
                modal.className = 'popup-overlay';
                modal.id = 'editMgRecordModal';
                modal.innerHTML = `
                    <div class="popup-card" style="max-width:500px; max-height:90vh; overflow-y:auto;">
                        <h3 style="color:#0A56D0; margin-top:0; margin-bottom:12px;">✏️ Edit Record</h3>
                        <div class="mg-form-grid" style="text-align:left;">
                            <div><label>Date</label><input type="date" id="emg_date" value="${rec.RawDate}"></div>
                            <div><label>Vendor</label><select id="emg_vendor"><option value="">-- Select --</option>${vendorOpts}</select></div>
                            <div class="mg-full-width"><label>Item Name</label><input type="text" id="emg_item" value="${rec.Item}"></div>
                            <div><label>Qty</label><input type="number" id="emg_qty" value="${rec.Qty}" oninput="window.calcEditMgAmt()"></div>
                            <div><label>Rate</label><input type="number" id="emg_rate" value="${rec.Rate}" oninput="window.calcEditMgAmt()"></div>
                            <div class="mg-full-width"><label>Amount</label><input type="number" id="emg_amt" value="${rec.Amount}" readonly style="background:#e2e8f0; font-weight:bold;"></div>
                            <div><label>Requisitioner</label><input type="text" id="emg_req" value="${rec.ReqName}"></div>
                            <div><label>Purpose</label><input type="text" id="emg_purpose" value="${rec.Purpose}"></div>
                            <div><label>Location</label><input type="text" id="emg_location" value="${rec.Location}"></div>
                            <div><label>Served By</label><select id="emg_served"><option value="">-- Select --</option>${pantryOpts}</select></div>
                        </div>
                        <div style="display:flex; gap:8px; margin-top:16px;">
                            <button onclick="document.getElementById('editMgRecordModal').remove()" class="danger" style="flex:1; min-height:44px;">Cancel</button>
                            <button onclick="window.saveEditMgRecord('${id}')" class="success" style="flex:1; min-height:44px;">💾 Update</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
            };

            window.calcEditMgAmt = function() {
                const q = parseFloat(document.getElementById('emg_qty').value) || 0;
                const r = parseFloat(document.getElementById('emg_rate').value) || 0;
                document.getElementById('emg_amt').value = (q * r).toFixed(2);
            };

            window.saveEditMgRecord = function(id) {
                const rawDate = document.getElementById('emg_date').value;
                const item = document.getElementById('emg_item').value.trim();
                const qty = parseFloat(document.getElementById('emg_qty').value) || 0;

                if(!item || !qty) return appAlert('Error', 'Item and Qty are required.');

                db.ref('meetingsGuestsRecords/' + id).update({
                    RawDate: rawDate,
                    DateFormatted: convertYMDtoDMY(rawDate),
                    Day: getDayOfWeek(convertYMDtoDMY(rawDate)),
                    Vendor: document.getElementById('emg_vendor').value,
                    Item: item,
                    Qty: qty,
                    Rate: parseFloat(document.getElementById('emg_rate').value) || 0,
                    Amount: parseFloat(document.getElementById('emg_amt').value) || 0,
                    ReqName: document.getElementById('emg_req').value,
                    Purpose: document.getElementById('emg_purpose').value,
                    Location: document.getElementById('emg_location').value,
                    ServedBy: document.getElementById('emg_served').value
                }).then(() => {
                    document.getElementById('editMgRecordModal').remove();
                    appAlert('Updated', 'Record updated successfully!');
                });
            };	

            window.updateMgStatus = function(id, newStatus) {
                db.ref('meetingsGuestsRecords/' + id).update({ Status: newStatus });
            };

            window.deleteMgRecord = function(id) {
                appConfirm('Delete Record', 'Are you sure you want to delete this record?', () => {
                    db.ref('meetingsGuestsRecords/' + id).remove();
                });
            };
        })();
      
		
			// ===== Date Change & Auto Refresh Helpers =====
window.refreshAllData = function() {
    if (typeof window.populateServe === 'function') window.populateServe();
    var mPopup = document.getElementById('monthlyGridPopup');
    if (mPopup && !mPopup.classList.contains('hidden') && typeof window.openMonthlyGridPopup === 'function') {
        window.openMonthlyGridPopup();
    }
};

window.changeDateBy = function(days) {
    var dateInput = document.getElementById('beverageEntryDate');
    if (!dateInput || !dateInput.value) return;

    var current = new Date(dateInput.value);
    current.setDate(current.getDate() + days);

    var yyyy = current.getFullYear();
    var mm = String(current.getMonth() + 1).padStart(2, '0');
    var dd = String(current.getDate()).padStart(2, '0');
    var newDate = yyyy + '-' + mm + '-' + dd;
    
    // જો નવું કેલેન્ડર લોડ થયું હોય તો એમાં અપડેટ કરો
    if (dateInput._flatpickr) {
        dateInput._flatpickr.setDate(newDate, true);
    } else {
        dateInput.value = newDate;
        window.refreshAllData();
    }
};

// પેજ લોડ થયા પછી શાંતિથી નવું કેલેન્ડર ચાલુ કરવાનો કોડ
setTimeout(function() {
    var dateInput = document.getElementById('beverageEntryDate');
    if (dateInput) {
        // આજની તારીખ સેટ કરો (જો ખાલી હોય તો)
        if (!dateInput.value) {
            var t = new Date();
            dateInput.value = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
        }
        
        // જો Flatpickr (યુનિવર્સલ કેલેન્ડર) ની ફાઈલ સાચી રીતે આવી ગઈ હોય તો જ ચાલુ કરો
        if (typeof flatpickr !== 'undefined') {
            flatpickr(dateInput, {
                dateFormat: "Y-m-d",
                disableMobile: true, // આ લાઈનથી બધા જ મોબાઈલમાં એકસરખું ડિઝાઇન વાળું કેલેન્ડર ખુલશે!
                onChange: function(selectedDates, dateStr) {
                    window.refreshAllData();
                }
            });
        } else {
            // જો ઇન્ટરનેટ ધીમું હોય અને ફાઈલ ના આવે, તો જૂની સિસ્ટમ ચાલુ રાખો જેથી એન્ટ્રી અટકે નહિ
            dateInput.addEventListener('change', window.refreshAllData);
            window.refreshAllData();
        }
    }
}, 800); // પેજ લોડ થયાના થોડા સમય પછી ચાલુ થાય જેથી કોઈ એરર ના આવે
</script>
