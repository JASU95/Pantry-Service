                // --- બીજો બગ ફિક્સ: જો બીજો પેન્ટ્રી બોય લોગીન થાય તો જૂના એમ્પ્લોયીનું આઈડી ક્લિયર કરવું ---
                if (selectedEmpId && !myAssigned.some(e => e.id === selectedEmpId)) {
                    selectedEmpId = null;
                }
                
                if (!selectedEmpId && myAssigned.length > 0) {
                    selectedEmpId = myAssigned[0].id;
                }

                const currentIndex = myAssigned.findIndex(e => e.id === selectedEmpId);
                const prevId = currentIndex > 0 ? myAssigned[currentIndex - 1].id : null;
                const nextId = currentIndex >= 0 && currentIndex < myAssigned.length - 1 ? myAssigned[currentIndex + 1].id : null;
                const selectedEmp = currentIndex >= 0 ? myAssigned[currentIndex] : null;

                const styleOverrides = `
                    <style>
                        .us-top-ctrl { height:28px !important; min-height:28px !important; margin:0 !important; padding:0 2px !important; font-size:11px !important; font-weight:bold !important; border-radius:4px !important; border:1px solid #CBD5E1 !important; outline:none !important; appearance:none !important; -webkit-appearance:none !important; background:#fff !important; color:#0A56D0 !important; box-sizing:border-box !important; text-align:center !important; display:flex !important; align-items:center !important; justify-content:center !important; width:100% !important; min-width:0 !important; max-width:100% !important; }
                        .us-tbl-wrapper { width:100% !important; max-width:100% !important; overflow-x:hidden !important; overflow-y:auto !important; flex:1 1 auto !important; min-height:0 !important; border:1px solid #CBD5E1 !important; border-radius:6px !important; background:#fff !important; margin-bottom:4px !important; box-sizing:border-box !important; display:block !important; }
                        .us-tbl { width:100% !important; max-width:100% !important; min-width:0 !important; border-collapse:collapse !important; table-layout:fixed !important; margin:0 !important; box-sizing:border-box !important; }
                        .us-th { min-width:0 !important; max-width:none !important; padding:4px 0 !important; font-size:10px !important; color:#0A56D0 !important; background:#F1F5F9 !important; border-bottom:1px solid #0A56D0 !important; border-right:1px solid #E2E8F0 !important; height:24px !important; white-space:nowrap !important; overflow:hidden !important; text-overflow:ellipsis !important; box-sizing:border-box !important; text-align:center !important; }
                        .us-td { min-width:0 !important; max-width:none !important; padding:0 !important; margin:0 !important; height:24px !important; border-bottom:1px solid #E2E8F0 !important; border-right:1px solid #E2E8F0 !important; vertical-align:middle !important; overflow:hidden !important; box-sizing:border-box !important; }
                        .us-sel { width:100% !important; max-width:100% !important; min-width:0 !important; height:24px !important; padding:0 !important; margin:0 !important; font-size:10px !important; font-weight:700 !important; color:#0A56D0 !important; background:transparent !important; border:none !important; appearance:none !important; -webkit-appearance:none !important; outline:none !important; box-shadow:none !important; text-align:center !important; text-align-last:center !important; cursor:pointer !important; overflow:hidden !important; text-overflow:ellipsis !important; box-sizing:border-box !important; }
                        .us-sel:focus { border:none !important; box-shadow:none !important; background:#E0F2FE !important; }
                        .us-btn { background:transparent !important; border:none !important; padding:0 !important; margin:0 !important; width:48% !important; min-width:0 !important; height:24px !important; font-size:11px !important; display:inline-flex !important; align-items:center !important; justify-content:center !important; cursor:pointer !important; box-sizing:border-box !important; }
                    </style>
                `;

                const controlHtml = `
                    ${styleOverrides}
                    <div style="display:flex; flex-direction:column; gap:4px; flex-shrink:0; max-width:100%; overflow:hidden;">
                        
                        <!-- નવો ઉમેરેલો ફિલ્ટર રો (Category & Search) -->
                        <div style="display:flex; gap:4px; width:100%;">
                            <select id="monthlyGridCat" class="us-top-ctrl" style="flex:1;" onchange="window.saveAndRefreshGrid()">
                                <option value="All" ${catFilter === 'All' ? 'selected' : ''}>All Cat.</option>
                                <option value="Faculty" ${catFilter === 'Faculty' ? 'selected' : ''}>Faculty</option>
                                <option value="Staff" ${catFilter === 'Staff' ? 'selected' : ''}>Staff</option>
                                <option value="Law" ${catFilter === 'Law' ? 'selected' : ''}>Law</option>
                                <option value="Outsourced" ${catFilter === 'Outsourced' ? 'selected' : ''}>Outsource</option>
                            </select>
                            <input type="text" id="monthlyGridSearch" class="us-top-ctrl" placeholder="🔍 Search Name..." value="${searchQ}" style="flex:2; text-align:left !important; padding-left:8px !important;" onchange="window.saveAndRefreshGrid()">
                        </div>

                        <!-- Top 4 Controls (Month, Supply, Format, Upload) -->
                        <div style="display:grid; grid-template-columns: 1fr 1fr 0.8fr 0.8fr; gap:4px; width:100%;">
                            
                            <!-- Custom Month Picker (ટૂંકું નામ બતાવવા) -->
                            <div style="position:relative; width:100%; height:28px;">
                                <div class="us-top-ctrl" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; background:#E0F2FE !important; color:#0284C7 !important;">
                                    📅 ${shortMonthLabel}
                                </div>
                                <input type="month" id="monthlyGridMonthPicker" class="us-top-ctrl" value="${monthVal}" onchange="window.saveAndRefreshGrid()" style="opacity:0; position:absolute; top:0; left:0; width:100%; height:100%; cursor:pointer;">
                            </div>
                            
                            <select id="monthlySupplySource" class="us-top-ctrl" onchange="window.saveAndRefreshGrid()">
                                <option value="Contractor" ${supplySource === 'Contractor' ? 'selected' : ''}>IA Caterers</option>
                                ${hasDauAccess ? `<option value="DAU Direct Purchase" ${supplySource === 'DAU Direct Purchase' ? 'selected' : ''}>DAU Direct</option>` : ''}
                            </select>
                            <button type="button" onclick="window.downloadMonthlyGridTemplate()" class="us-top-ctrl" style="cursor:pointer; background:#1E293B !important; color:#fff !important; border:none !important;">📥 Fmt</button>
                            <label class="us-top-ctrl" style="cursor:pointer; background:#10B981 !important; color:#fff !important; border:none !important;">
                                📤 Up<input type="file" id="monthlyGridExcelUpload" accept="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel, .xlsx, .xls" style="display:none;" onchange="window.handleMonthlyGridExcelUpload(event)">
                            </label>
                        </div>

                        <!-- Name Navigation -->
                        <div style="display:flex; align-items:center; justify-content:space-between; background:#EFF6FF; border:1px solid #0A56D0; border-radius:6px; height:28px; margin-bottom:4px; width:100%; box-sizing:border-box;">
                            <button type="button" onclick="document.getElementById('monthlyGridEmpPicker').value='${prevId}'; window.saveAndRefreshGrid();" ${!prevId ? 'disabled style="opacity:0.3;"' : ''} style="background:transparent; border:none; color:#0A56D0; font-size:16px; font-weight:bold; cursor:pointer; padding:0 8px; height:100%;">◀</button>
                            
                            <select id="monthlyGridEmpPicker" class="us-sel" onchange="window.saveAndRefreshGrid()" style="flex:1; height:100% !important; font-size:12px !important; color:#0A56D0;">
                                ${myAssigned.map(e => `<option value="${e.id}" ${e.id === selectedEmpId ? 'selected' : ''}>👤 ${e.name}</option>`).join('')}
                            </select>
                            
                            <button type="button" onclick="document.getElementById('monthlyGridEmpPicker').value='${nextId}'; window.saveAndRefreshGrid();" ${!nextId ? 'disabled style="opacity:0.3;"' : ''} style="background:transparent; border:none; color:#0A56D0; font-size:16px; font-weight:bold; cursor:pointer; padding:0 8px; height:100%;">▶</button>
                        </div>
                    </div>
                `;

                if (!myAssigned.length) {
                    content.innerHTML = controlHtml + `<p style="padding:20px; text-align:center; font-weight:bold;">No employees.</p>`;
                    return;
                }
                
                const contractorArr = typeof CONTRACTOR_BEVERAGES !== 'undefined' ? CONTRACTOR_BEVERAGES : ['Tea','Coffee'];
                const dauArr = typeof DAU_PURCHASE_BEVERAGES !== 'undefined' ? DAU_PURCHASE_BEVERAGES : [];
                const currentDrinkArr = supplySource === 'DAU Direct Purchase' ? dauArr : contractorArr;

                let tableHtml = `
                <div class="us-tbl-wrapper">
                    <table class="us-tbl">
                        <thead style="position:sticky; top:0; z-index:10;">
                            <!-- EXCEL માટે છુપાયેલું હેડર (ભૂલથી ડીલીટ થઇ ગયું હતું તે પાછું ઉમેર્યું) -->
                            <tr style="display:none;">
                                <th class="merged-header"><span class="emp-name" data-id="${selectedEmp.id}">${selectedEmp.name}</span></th>
                            </tr>
                            <tr>
                                <th class="us-th" style="width:20%;">Date</th>
                                <th class="us-th" style="width:30%;">Morning</th>
                                <th class="us-th" style="width:30%;">Afternoon</th>
                                <th class="us-th" style="width:20%; border-right:none;">Action</th>
                            </tr>
                        </thead>
                        <tbody>`;

                if (selectedEmp) {
                    const monthPad = String(mm).padStart(2, '0');
                    for (let d = 1; d <= daysInMonth; d++) {
                        const dd = String(d).padStart(2, '0');
                        const dmy = `${dd}/${monthPad}/${yy}`;
                        
                        const dObj = new Date(yy, mm - 1, d);
                        const dayStr = dObj.toLocaleDateString('en-US', { weekday: 'short' }); 

                        const mLog = logsData.find(l => l.employeeId === selectedEmp.id && l.date === dmy && l.session === 'Morning' && (l.supplySource === supplySource || (!l.supplySource && supplySource === 'Contractor')));
                        const aLog = logsData.find(l => l.employeeId === selectedEmp.id && l.date === dmy && l.session === 'Afternoon' && (l.supplySource === supplySource || (!l.supplySource && supplySource === 'Contractor')));
                        const mVal = mLog ? mLog.drink : '';
                        const aVal = aLog ? aLog.drink : '';
                        
                        const copyBtn = d > 1 ? `<button type="button" onclick="window.copyPrevDateRow(this)" class="us-btn" title="Copy">📋</button>` : `<span style="width:50%;display:inline-block;"></span>`;
                        const clearBtn = `<button type="button" onclick="window.clearDateRow(this)" class="us-btn" style="color:#DC3545;" title="Clear">✕</button>`;

                        tableHtml += `
                        <tr style="${dObj.getDay() === 0 ? 'background:#FFF5F5;' : ''}">
                            <td class="us-td" style="font-weight:700; color:#1E293B; font-size:10px; text-align:center; line-height:1.2;">
                                ${dd}/${monthPad}<br><span style="color:#64748B; font-weight:normal; font-size:9px;">${dayStr}</span>
                            </td>
                            <td class="us-td">
                                <select class="us-sel grid-morn" data-emp="${selectedEmp.id}" data-date="${dmy}" data-logid="${mLog ? mLog.id : ''}">
                                    <option value="">-</option>
                                    ${currentDrinkArr.map(opt => `<option value="${opt}" ${opt === mVal ? 'selected' : ''}>${opt}</option>`).join('')}
                                </select>
                            </td>
                            <td class="us-td">
                                <select class="us-sel grid-aft" data-emp="${selectedEmp.id}" data-date="${dmy}" data-logid="${aLog ? aLog.id : ''}">
                                    <option value="">-</option>
                                    ${currentDrinkArr.map(opt => `<option value="${opt}" ${opt === aVal ? 'selected' : ''}>${opt}</option>`).join('')}
                                </select>
                            </td>
                            <td class="us-td" style="border-right:none; font-size:0; text-align:center;">
                                <div style="display:flex; gap:0; align-items:center; justify-content:center; height:100%; width:100%;">
                                    ${copyBtn}${clearBtn}
                                </div>
                            </td>
                        </tr>`;
                    }
                }
                tableHtml += '</tbody></table></div>';                
                
                content.innerHTML = controlHtml + tableHtml;

                window.saveAndRefreshGrid = function() { window.executeGridSave(true); openMonthlyGridPopup(); };
                window.refreshMonthlyGrid = function() { openMonthlyGridPopup(); };

                window.copyPrevDateRow = function(btn) {
                    const currentRow = btn.closest('tr');
                    const prevRow = currentRow.previousElementSibling;
                    if (!prevRow) return;

                    const prevSelects = prevRow.querySelectorAll('.grid-morn, .grid-aft');
                    const currSelects = currentRow.querySelectorAll('.grid-morn, .grid-aft');
                    
                    let copied = false;
                    prevSelects.forEach((sel, idx) => {
                        if (currSelects[idx] && !currSelects[idx].disabled) {
                            currSelects[idx].value = sel.value;
                            copied = true;
                        }
                    });
                    if (copied) {
                        const originalIcon = btn.innerText;
                        btn.innerText = "✓";
                        setTimeout(() => { btn.innerText = originalIcon; }, 500);
                    }
                };

                window.clearDateRow = function(btn) {
                    const currentRow = btn.closest('tr');
                    const currSelects = currentRow.querySelectorAll('.grid-morn, .grid-aft');
                    let cleared = false;
                    currSelects.forEach(sel => { if (!sel.disabled) { sel.value = ""; cleared = true; } });
                    if (cleared) {
                        const originalIcon = btn.innerText;
                        btn.innerText = "✓";
                        setTimeout(() => { btn.innerText = originalIcon; }, 500);
                    }
                };

                window.executeGridSave = function(silent = false) {
                    const selects = content.querySelectorAll('.grid-morn, .grid-aft');
                    const selectedSupplySource = document.getElementById('monthlySupplySource')?.value || 'Contractor';
                    const updates = {};
                    let saved = 0;
                    const baseId = Date.now();

                    selects.forEach((sel, idx) => {
                        const val = sel.value;
                        const empId = sel.dataset.emp;
                        const dateDMY = sel.dataset.date;
                        const session = sel.className.includes('grid-morn') ? 'Morning' : 'Afternoon';
                        const existingLogId = sel.dataset.logid;
                        const empObj = employeeList.find(e => e.id === empId);
                        const empName = empObj ? empObj.name : 'Unknown';

                        if (existingLogId) {
                            if (val && val !== '-') {
                                const existingLog = logsData.find(l => l.id === existingLogId);
                                if (existingLog && existingLog.drink !== val) {
                                    updates[existingLogId + '/drink'] = val;
                                    saved++;
                                }
                            } else {
                                updates[existingLogId] = null;
                                sel.dataset.logid = '';
                                saved++;
                            }
                        } else {
                            if (val && val !== '-') {
                                const newId = 'log_' + (baseId + idx) + '_' + Math.floor(Math.random() * 10000);
                                updates[newId] = {
                                    id: newId, employeeId: empId, employeeName: empName,
                                    drink: val, session: session, date: dateDMY,
                                    pantryId: currentUser.id, pantryName: currentUser.name,
                                    supplySource: selectedSupplySource
                                };
                                sel.dataset.logid = newId;
                                saved++;
                            }
                        }
                    });

                    if (saved > 0) {
                        db.ref('logs').update(updates).then(() => {
                            if (!silent) appAlert('Success', `✅ ${saved} entries synced securely!`);
                            if (typeof window.populateServe === 'function') window.populateServe();
                        }).catch(err => { if(!silent) appAlert('Error', 'Save failed: ' + err.message); });
                    } else {
                        if (!silent) appAlert('Notice', 'No changes to save.');
                    }
                };

                const saveBtn = document.getElementById('saveMonthlyGridPopup');
                if(saveBtn) {
                    saveBtn.onclick = function() {
                        window.executeGridSave(false);
                        setTimeout(() => { openMonthlyGridPopup(); }, 500);
                    };
                    saveBtn.style.minHeight = '42px';
                    saveBtn.style.padding = '8px';
                    saveBtn.style.fontSize = '14px';
                    saveBtn.style.marginTop = 'auto'; 
                    saveBtn.style.flexShrink = '0';
                    saveBtn.style.borderRadius = '8px';
                }
            };
            // ===== END REPLACEMENT FOR openMonthlyGridPopup =====

            // ડાયનેમિક ફોર્મેટ ડાઉનલોડ કરવાનું ફંક્શન
            window.downloadMonthlyGridTemplate = function() {
                // અહીં પણ નવો ઉમેરેલો મહિનો વાંચશે
                const monthVal = document.getElementById('monthlyGridMonthPicker')?.value;
                if (!monthVal) return appAlert('Error', 'Please select a month first.');
                const [yy, mm] = monthVal.split('-');
                const daysInMonth = getDaysInMonth(yy, mm);
                
                const supplySource = document.getElementById('monthlySupplySource')?.value || 'Contractor';
                
                const empHeaders = document.querySelectorAll('th.merged-header .emp-name');
                if (empHeaders.length === 0) return appAlert('Error', 'No employees found in the grid to generate format.');
                
                const names = Array.from(empHeaders).map(el => el.innerText.trim());
                
                const row0 = ["Date"];
                const row1 = [""];
                
                names.forEach(name => {
                    row0.push(name, "");
                    row1.push("Morning", "Afternoon");
                });
                
                const data = [row0, row1];
                
                for (let d = 1; d <= daysInMonth; d++) {
                    const dmy = `${String(d).padStart(2,'0')}/${mm}/${yy}`;
                    const row = [dmy];
                    for(let i=0; i<names.length; i++) {
                        row.push("-", "-");
                    }
                    data.push(row);
                }
                
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.aoa_to_sheet(data);
                
                const merges = [];
                for(let i=0; i<names.length; i++) {
                    const baseCol = 1 + (i * 2);
                    merges.push({s: {r: 0, c: baseCol}, e: {r: 0, c: baseCol + 1}});
                }
                ws['!merges'] = merges;
                
                const colWidths = [{wch: 12}];
                for(let i=0; i<names.length*2; i++) colWidths.push({wch: 15});
                ws['!cols'] = colWidths;
                
                XLSX.utils.book_append_sheet(wb, ws, "Format");
                window.pantryDownloadExcelFile(wb, `Monthly_Entry_Format_${supplySource.replace(/\s+/g,'_')}_${yy}_${mm}.xlsx`);
            };

            // એક્સેલ ફાઈલ રીડ અને વેલિડેટ કરવાનું ફંક્શન
            window.handleMonthlyGridExcelUpload = async function(event) {
                const file = event.target.files[0];
                if (!file) return;

                appAlert('Reading File', 'Please wait, checking data...');

                try {
                    const data = await file.arrayBuffer();
                    const wb = XLSX.read(data, { cellDates: true });
                    const sheet = wb.Sheets[wb.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
                    
                    if (rows.length < 3) throw new Error("Invalid format. Missing headers or data rows.");

                    const headerRow = rows[0];
                    const sessionRow = rows[1];
                    const errors = [];
                    const empColMap = {};

                    // અહીંયા પણ હવે નવો ઉમેરેલો મહિનો વાંચશે
                    const monthVal = document.getElementById('monthlyGridMonthPicker')?.value;
                    if (!monthVal) throw new Error("Please select a month first.");
                    const [targetYY, targetMM] = monthVal.split('-');

                    const supplySource = document.getElementById('monthlySupplySource')?.value || 'Contractor';
                    const contractorArr = typeof CONTRACTOR_BEVERAGES !== 'undefined' ? CONTRACTOR_BEVERAGES : ['Tea','Coffee'];
                    const dauArr = typeof DAU_PURCHASE_BEVERAGES !== 'undefined' ? DAU_PURCHASE_BEVERAGES : [];
                    const currentDrinkArr = supplySource === 'DAU Direct Purchase' ? dauArr : contractorArr;

                    // 1. કોલમને એમ્પ્લોયી સાથે મેચ કરવા
                    for (let i = 1; i < headerRow.length; i++) {
                        const colName = String(headerRow[i]).trim();
                        if (colName && !colName.toLowerCase().startsWith('unnamed')) {
                            const empName = colName;
                            
                            const domEmpNode = Array.from(document.querySelectorAll('th.merged-header .emp-name')).find(el => el.innerText.trim().toLowerCase() === empName.toLowerCase());
                            
                            if (!domEmpNode) {
                                errors.push(`Row 1: Employee "${empName}" is not allotted to this Pantry Boy or Supply Source.`);
                                continue;
                            }
                            
                            const empId = domEmpNode.dataset.id;
                            
                            const mornSess = String(sessionRow[i]).trim().toLowerCase();
                            const aftSess = String(sessionRow[i+1]).trim().toLowerCase();
                            
                            if (mornSess.includes('morn')) {
                                empColMap[i] = { empId: empId, session: 'morn' };
                            } else {
                                errors.push(`Row 2, Col ${i+1}: Expected 'Morning', found '${sessionRow[i]}'`);
                            }
                            
                            if (aftSess.includes('aft')) {
                                empColMap[i+1] = { empId: empId, session: 'aft' };
                            } else {
                                errors.push(`Row 2, Col ${i+2}: Expected 'Afternoon', found '${sessionRow[i+1]}'`);
                            }
                        }
                    }

                    if (Object.keys(empColMap).length === 0) {
                        throw new Error("No valid employees matched from the Excel header.");
                    }

                    // 2. ડેટા ચેક અને વેલિડેટ કરવા
                    const updatesDOM = [];
                    for (let r = 2; r < rows.length; r++) {
                        const row = rows[r];
                        if (!row || row.length === 0) continue;
                        
                        let rawDate = row[0];
                        if (!rawDate) continue; 
                        
                        let formattedDMY = window.parseExcelDateToDMY(rawDate);
                        if (!formattedDMY) {
                            errors.push(`Row ${r+1}: Invalid date format "${rawDate}"`);
                            continue;
                        }
                        
                        const parts = formattedDMY.split('/');
                        if (parts.length === 3) {
                            if (parts[1] !== targetMM || parts[2] !== targetYY) {
                                errors.push(`Row ${r+1}: Date ${formattedDMY} does not match selected month ${targetMM}/${targetYY}`);
                                continue;
                            }
                        }
                        
                        for (const colIdx in empColMap) {
                            const mapping = empColMap[colIdx];
                            let drinkVal = String(row[colIdx] || '').trim();
                            
                            if (drinkVal === '-' || drinkVal.toLowerCase() === 'none' || drinkVal === '') {
                                drinkVal = "";
                            }
                            
                            if (drinkVal !== "") {
                                const isMatch = currentDrinkArr.find(d => d.toLowerCase() === drinkVal.toLowerCase());
                                if (!isMatch) {
                                    errors.push(`Row ${r+1}, Col ${Number(colIdx)+1}: Invalid drink "${drinkVal}". Must be: ${currentDrinkArr.join(', ')}`);
                                } else {
                                    drinkVal = isMatch;
                                }
                            }
                            
                            if (errors.length === 0) {
                                const selector = `select.grid-${mapping.session}[data-emp="${mapping.empId}"][data-date="${formattedDMY}"]`;
                                updatesDOM.push({ selector, value: drinkVal });
                            }
                        }
                    }

                    // 3. એરર બતાવવી અથવા ગ્રીડમાં ડેટા ભરી દેવો
                    if (errors.length > 0) {
                        const displayErrors = errors.slice(0, 15);
                        const moreStr = errors.length > 15 ? `<li>...and ${errors.length - 15} more errors.</li>` : '';
                        const modal = document.createElement('div');
                        modal.className = 'popup-overlay';
                        modal.style.zIndex = '9999999';
                        modal.innerHTML = `
                            <div class="popup-card" style="max-width: 500px;">
                                <h3 style="color:#DC3545; margin-top:0;">❌ Import Failed (Errors Found)</h3>

            // 100% NEW & FRESH: PANTRY BOY DELIVERY REPORT (REGULAR & MEETINGS)

            window.generateFreshPBDeliveryReport = function(type, isExcel) {
                try {
                    const month = document.getElementById('pbReportMonth')?.value;
                    if (!month) return appAlert('Error', 'Select month.');
                    
                    const supplySource = document.getElementById('pbReportSupplySource')?.value || 'Contractor';
                    const supplyText = supplySource === 'Contractor' ? 'IA Caterers' : 'DAU Direct';
                    
                    // પેન્ટ્રી બોયનું પોતાનું આઈડી અને નામ 
                    const pantryId = currentUser.id;
                    const pantryName = currentUser.name;
                    
                    const dateObj = new Date(month + '-01');
                    const monthStr = dateObj.toLocaleString('en-US', { month: 'long', year: 'numeric' }).toUpperCase();
                    const title = `DELIVERY REPORT (${type.toUpperCase()}) - ${monthStr} [${supplyText}]`;

                    const [yy, mm] = month.split('-');
                    const daysInMonth = new Date(yy, mm, 0).getDate();

                    const bevCols = ['Tea', 'Coffee', 'Green Tea', 'Lemon Tea', 'Black Tea', 'Black Coffee'];
                    let reportData = {}; 
                    
                    // Crash પ્રૂફ મેપિંગ
                    const safeMapDrink = (name) => {
                        if (!name) return 'Tea';
                        const n = String(name).toLowerCase();
                        if (n.includes('green')) return 'Green Tea';
                        if (n.includes('lemon')) return 'Lemon Tea';
                        if (n.includes('black tea')) return 'Black Tea';
                        if (n.includes('black coffee')) return 'Black Coffee';
                        if (n.includes('coffee')) return 'Coffee';
                        return 'Tea'; 
                    };

                    const safeIsBeverage = (name) => {
                        if (!name) return false;
                        const n = String(name).toLowerCase();
                        return bevCols.some(b => n.includes(b.toLowerCase())) || n.includes('milk') || n.includes('soup') || n.includes('bournvita');
                    };

                    // 1. Regular Data લોડિંગ
                    if (type === 'regular') {
                        logsData.forEach(log => {
                            if (log.date && parseDMYToYMD(log.date).startsWith(month) && log.pantryId === pantryId) {
                                const sSrc = log.supplySource || 'Contractor';
                                if (sSrc === supplySource) {
                                    const ymd = parseDMYToYMD(log.date);
                                    const drink = safeMapDrink(log.drink);
                                    if (!reportData[ymd]) reportData[ymd] = { 'Tea':0, 'Coffee':0, 'Green Tea':0, 'Lemon Tea':0, 'Black Tea':0, 'Black Coffee':0 };
                                    reportData[ymd][drink] += 1;
                                }
                            }
                        });
                    } 
                    // 2. Meeting Data લોડિંગ
                    else if (type === 'meeting') {
                        // જુના મોડ્યુલનો ડેટા
                        eventLogsData.forEach(ev => {
                            if (!ev.date || !parseDMYToYMD(ev.date).startsWith(month)) return;
                            if (ev.items && ev.items.length > 0) {
                                ev.items.forEach(item => {
                                    const vName = String(item.vendor || ev.canteenSource || '').toLowerCase();
                                    const isDAU = vName.includes('dau direct') || vName === 'dau direct purchase';
                                    if ((supplySource === 'DAU Direct Purchase' && isDAU) || (supplySource === 'Contractor' && !isDAU)) {
                                        if (safeIsBeverage(item.name)) {
                                            const pName = String(item.servedBy || ev.servedByName || ev.pantryName || '');
                                            if (pName.toLowerCase().includes(String(pantryName).toLowerCase())) {
                                                const ymd = parseDMYToYMD(item.itemSpecificDate || ev.date);
                                                const drink = safeMapDrink(item.name);
                                                if (!reportData[ymd]) reportData[ymd] = { 'Tea':0, 'Coffee':0, 'Green Tea':0, 'Lemon Tea':0, 'Black Tea':0, 'Black Coffee':0 };
                                                reportData[ymd][drink] += (Number(item.qty) || 0);
                                            }
                                        }
                                    }
                                });
                            }
                        });

                        // નવા મોડ્યુલનો ડેટા
                        if(typeof mgRecordsData !== 'undefined') {
                            mgRecordsData.forEach(rec => {
                                if (rec.Status === 'Review') return;
                                const recYMD = rec.DateFormatted && rec.DateFormatted.includes('/') ? parseDMYToYMD(rec.DateFormatted) : (rec.RawDate || new Date(rec.Timestamp).toISOString().split('T')[0]);
                                if(!recYMD.startsWith(month)) return;
                                
                                const vName = String(rec.Vendor || '').toLowerCase();
                                const isDAU = vName.includes('dau direct') || vName === 'dau direct purchase';
                                if ((supplySource === 'DAU Direct Purchase' && isDAU) || (supplySource === 'Contractor' && !isDAU)) {
                                    if (safeIsBeverage(rec.Item)) {
                                        const pName = String(rec.ServedBy || '');
                                        if (pName.toLowerCase().includes(String(pantryName).toLowerCase())) {

                                            reportData[ymd][drink] += (Number(rec.Qty) || 0);

                    let excelData = [];
                    
                    const bStyle = { style: 'thin', color: { rgb: "000000" } };

                    excelData.push([{v:'Date', s:headStyle}, {v:'Tea', s:headStyle}, {v:'Coffee', s:headStyle}, {v:'Green Tea', s:headStyle}, {v:'Lemon Tea', s:headStyle}, {v:'Black Tea', s:headStyle}, {v:'Black Coffee', s:headStyle}]);

                    let hasAnyData = false;

                    for (let d = 1; d <= daysInMonth; d++) {
                        const dd = String(d).padStart(2, '0');
                        const ymd = `${yy}-${mm}-${dd}`;
                        const dmy = `${dd}/${mm}/${yy}`;

                            <td style="border:1px solid #000; padding:6px; text-align:center; color:#0A56D0;">${totals['Black Coffee']}</td>

            window.generateFreshPBDeliveryReport = function(type, isExcel) {
                try {
                    const month = document.getElementById('pbReportMonth')?.value;
                    if (!month) return appAlert('Error', 'Select month.');
                    
                    const supplySource = document.getElementById('pbReportSupplySource')?.value || 'Contractor';
                    const supplyText = supplySource === 'Contractor' ? 'IA Caterers' : 'DAU Direct';
                    
                    // પેન્ટ્રી બોયનું પોતાનું આઈડી અને નામ 
                    const pantryId = currentUser.id;
                    const pantryName = currentUser.name;
                    
                    const dateObj = new Date(month + '-01');
                    const monthStr = dateObj.toLocaleString('en-US', { month: 'long', year: 'numeric' }).toUpperCase();
                    const title = `DELIVERY REPORT (${type.toUpperCase()}) - ${monthStr} [${supplyText}]`;

                    const [yy, mm] = month.split('-');
                    const daysInMonth = new Date(yy, mm, 0).getDate();

                    const bevCols = ['Tea', 'Coffee', 'Green Tea', 'Lemon Tea', 'Black Tea', 'Black Coffee'];
                    let reportData = {}; 
                    
                    // Crash પ્રૂફ મેપિંગ
                    const safeMapDrink = (name) => {
                        if (!name) return 'Tea';
                        const n = String(name).toLowerCase();
                        if (n.includes('green')) return 'Green Tea';
                        if (n.includes('lemon')) return 'Lemon Tea';
                        if (n.includes('black tea')) return 'Black Tea';
                        if (n.includes('black coffee')) return 'Black Coffee';
                        if (n.includes('coffee')) return 'Coffee';
                        return 'Tea'; 
                    };

                    const safeIsBeverage = (name) => {
                        if (!name) return false;
                        const n = String(name).toLowerCase();
                        return bevCols.some(b => n.includes(b.toLowerCase())) || n.includes('milk') || n.includes('soup') || n.includes('bournvita');
                    };

                    // 1. Regular Data લોડિંગ
                    if (type === 'regular') {
                        logsData.forEach(log => {
                            if (log.date && parseDMYToYMD(log.date).startsWith(month) && log.pantryId === pantryId) {
                                const sSrc = log.supplySource || 'Contractor';
                                if (sSrc === supplySource) {
                                    const ymd = parseDMYToYMD(log.date);
                                    const drink = safeMapDrink(log.drink);
                                    if (!reportData[ymd]) reportData[ymd] = { 'Tea':0, 'Coffee':0, 'Green Tea':0, 'Lemon Tea':0, 'Black Tea':0, 'Black Coffee':0 };
                                    reportData[ymd][drink] += 1;

                                    if ((supplySource === 'DAU Direct Purchase' && isDAU) || (supplySource === 'Contractor' && !isDAU)) {
                                        if (safeIsBeverage(item.name)) {
                                            const pName = String(item.servedBy || ev.servedByName || ev.pantryName || '');
                                            if (pName.toLowerCase().includes(String(pantryName).toLowerCase())) {
                                                const ymd = parseDMYToYMD(item.itemSpecificDate || ev.date);
                                                const drink = safeMapDrink(item.name);
                                                if (!reportData[ymd]) reportData[ymd] = { 'Tea':0, 'Coffee':0, 'Green Tea':0, 'Lemon Tea':0, 'Black Tea':0, 'Black Coffee':0 };
                                                reportData[ymd][drink] += (Number(item.qty) || 0);
                                            }
                                        }
                                    }

                            }

                        // નવા મોડ્યુલનો ડેટા

            function renderLeaveControlRoom() {

                    container.innerHTML = pantryTeam.map(p => {
                        const isOnLeave = p.onLeave === true;
                        const statusText = isOnLeave ? '🔴 On Leave' : '🟢 Active';
                        const statusColor = isOnLeave ? '#DC3545' : '#146C43';
                        const assignedTo = leaveAssignments[p.id];
                        const assignedName = assignedTo ? pantryTeam.find(pt => pt.id === assignedTo)
                            ?.name || 'Unknown' : 'None';

                        return `
                    <div style="display:flex; flex-direction:column; padding:12px; background:#fff; border-radius:12px; margin-bottom:8px; border:1px solid ${isOnLeave ? '#FECACA' : '#E2E8F0'};">

                        </div>

                          ${isOnLeave ? `<button onclick="window.openLeaveAssignPopup('${p.id}')" style="background:#0A56D0; color:#fff; border:none; padding:4px 14px; border-radius:8px; font-size:.78rem; min-height:30px; cursor:pointer;">📋 Assign Duty</button>` : ''}

                    </div>

                    }).join('');

            window.togglePantryLeave = function(id) {
                const p = pantryTeam.find(pt => pt.id === id);
                if (!p) return;
                const newStatus = !p.onLeave;
                db.ref('pantryTeam/' + id).update({ onLeave: newStatus });
                if (!newStatus) {
                    db.ref('leaveAssignments/' + id).remove();
                }
                appAlert('Updated', `${p.name} status changed.`);
            };

            window.openLeaveAssignPopup = function(id) {
                const p = pantryTeam.find(pt => pt.id === id);
                if (!p) return;
                const modal = document.getElementById('leaveAssignModal');
                document.getElementById('leaveAssignFromName').textContent = safeStr(p.name);

                const select = document.getElementById('leaveAssignToSelect');
                select.innerHTML = '<option value="">-- Select --</option>';
                pantryTeam.forEach(pt => {
                    if (pt.id !== id && !pt.onLeave) {
                        select.innerHTML += `<option value="${pt.id}">${safeStr(pt.name)}</option>`;

                    appAlert('Cleared', 'Assignment removed.');

            function openLocationEmployeePopup(locationName) {
                const modal = document.getElementById('locationEmployeeModal');
                const title = document.getElementById('locModalTitle');
                const list = document.getElementById('locEmployeeList');
                title.textContent = locationName;

                function renderLocationList(deptFilter) {
                    let html = '';
                    const filtered = employeeList.filter(emp => {
                        if (deptFilter && emp.department !== deptFilter) return false;
                        return true;
                    });
                    filtered.forEach(emp => {
                        const checked = (emp.locationNode === locationName) ? 'checked' : '';
                        const dept = emp.department || 'Unassigned';
                        html += `
                    <div class="location-employee-item">
                      <input type="checkbox" class="loc-employee-check" data-id="${emp.id}" ${checked}>
                      <label>${safeStr(emp.name)} [${safeStr(emp.category)}] <span style="color:#64748B; font-size:.75rem;">(${dept})</span></label>
                    </div>
                  `;
                    });
                    list.innerHTML = html || '<p style="padding:12px; color:#74777F;">No employees.</p>';
                }

                const deptFilter = document.getElementById('locDeptFilter');
                deptFilter.onchange = () => renderLocationList(deptFilter.value);

                document.getElementById('locAddDeptBtn').onclick = function() {
                    const dept = prompt('Enter department name (Administration, Admissions, Finance, HR, IT, Library, Law, SoL, Placement, Faculty, Staff, Outsource):');
                    if (dept && dept.trim()) {
                        const checks = list.querySelectorAll('.loc-employee-check:checked');
                        if (!checks.length) return appAlert('Error', 'Select employees first.');
                        const updates = {};
                        checks.forEach(cb => {
                            updates[cb.dataset.id + '/department'] = dept.trim();
                        });
                        db.ref('employees').update(updates).then(() => {
                            appAlert('Success', `Department "${dept.trim()}" assigned to ${checks.length} employees.`);
                            renderLocationList(deptFilter.value);
                        }).catch(err => appAlert('Error', err.message));
                    }
                };

                modal.classList.remove('hidden');
                renderLocationList('');

                document.getElementById('locSaveEmployees').onclick = function() {
                    const checks = list.querySelectorAll('.loc-employee-check');
                    const updates = {};
                    checks.forEach(cb => {
                        const empId = cb.dataset.id;
                        const loc = cb.checked ? locationName : '';
                        updates[empId + '/locationNode'] = loc;
                    });
                    db.ref('employees').update(updates).then(() => {
                        appAlert('Success', 'Employee locations updated!');
                        modal.classList.add('hidden');
                        renderAdminVenues();
                    }).catch(err => { appAlert('Error', 'Update failed: ' + err.message); });
                };
            }

            function renderAdminMeetingHistory() {
                const container = document.getElementById('adminMeetingHistoryTable');
                if (!container) return;

                let filteredEvents = [...eventLogsData];
                let sortField = 'date';
                let sortDir = 'desc';

                function renderTable() {
                    const sorted = [...filteredEvents].sort((a, b) => {
                        const aVal = a[sortField] || '';
                        const bVal = b[sortField] || '';
                        if (sortField === 'date' || sortField === 'amount') {
                            const aNum = sortField === 'date' ? parseDMYToYMD(aVal) : Number(aVal) || 0;
                            const bNum = sortField === 'date' ? parseDMYToYMD(bVal) : Number(bVal) || 0;
                            return sortDir === 'asc' ? (aNum > bNum ? 1 : -1) : (aNum < bNum ? 1 : -1);
                        }
                        return sortDir === 'asc' ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
                    });

                    if (sorted.length === 0) {
                        container.innerHTML =
                            `<p style="padding:20px; text-align:center; color:#64748B;">No meeting records found.</p>`;
                        return;
                    }

                    let html =
                        `<div class="table-toolbar">

                  <option value="amount" ${sortField==='amount'?'selected':''}>Sort by Amount</option>
                  <option value="orderedBy" ${sortField==='orderedBy'?'selected':''}>Sort by Requested By</option>

                <button id="adminMeetingSortDirBtn" class="toolbar-btn primary">${sortDir === 'asc' ? '⬆ Asc' : '⬇ Desc'}</button>

              <table class="pro-table">
                <thead><tr><th style="width:40px;"><input type="checkbox" id="adminMeetingSelectAll"></th><th>#</th><th>Event</th><th>Date</th><th>Vendor</th><th>Items</th><th>Amount (₹)</th><th>Requested By</th><th>Pantry Boy</th><th style="min-width:120px;">Actions</th></tr></thead>
                <tbody>`;

                    let idx = 1;
                    sorted.forEach(ev => {
                        let itemsStr = '';

                        html += `<tr data-id="${ev.id}">
                  <td><input type="checkbox" class="adminMeetingSelect" data-id="${ev.id}"></td>
                  <td>${idx++}</td>
                  <td><strong>${safeStr(ev.eventName)}</strong></td>
                  <td>${safeStr(ev.date)}</td>

                  <td>₹${(Number(ev.amount)||0).toFixed(2)}</td>

                  <td>${safeStr(ev.pantryName||'-')}</td>

                      <button class="edit-btn" onclick="window.editMeetingEvent('${ev.id}')">✏️</button>

            function backupAllData() {
                appAlert('Backup', 'Fetching all data from Firebase...');
                const paths = [
                    'employees', 'pantryTeam', 'logs', 'eventLogs', 'extraLogs', 'extraTeaRecords',
                    'canteens', 'venues', 'upcomingEvents', 'vendorItems',
                    'Workers_Tea', 'adminSecurityConfig', 'sessionDevices', 'leaveAssignments'
                ];
                const promises = paths.map(p => db.ref(p).once('value').then(snap => ({ [p]: snap.val() })));
                Promise.all(promises).then(results => {
                    const backup = { timestamp: new Date().toISOString(), data: {} };
                    results.forEach(r => Object.assign(backup.data, r));
                    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `DAU_Pantry_Backup_${backup.timestamp.slice(0,10)}.json`;
                    link.click();
                    appAlert('Backup Complete', `Backup saved with ${Object.keys(backup.data).length} nodes.`);
                }).catch(err => appAlert('Backup Failed', err.message));
            }

            function restoreAllData() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                input.onchange = function(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        try {
                            const backup = JSON.parse(ev.target.result);
                            if (!backup.data || typeof backup.data !== 'object') {
                                return appAlert('Invalid', 'Invalid backup format.');
                            }
                            appConfirm('Restore', 'This will overwrite all existing data. Continue?', () => {
                                const updates = {};
                                for (const [path, val] of Object.entries(backup.data)) {
                                    if (val !== null && val !== undefined) {
                                        updates[path] = val;
                                    }
                                }
                                db.ref().update(updates).then(() => {
                                    appAlert('Restore Complete', 'All data restored successfully!');
                                }).catch(err => appAlert('Restore Failed', err.message));
                            });
                        } catch (err) {
                            appAlert('Error', 'Invalid JSON file.');
                        }
                    };
                    reader.readAsText(file);
                };
                input.click();
            }

                modal.innerHTML = `

                        <div style="display:flex; gap:12px; justify-content:center; width:100%;">

                document.body.appendChild(modal);

                document.getElementById('saveCanteenItemEditBtn').onclick = function() {

                    const newRate = parseFloat(document.getElementById('editCanteenItemRate').value);

                    if (!newName) return appAlert('Error', 'Item name cannot be blank.');
                    if (isNaN(newRate) || newRate < 0) return appAlert('Error', 'Please enter a valid price rate.');

                    // આઇટમ અપડેટ લોજીક
                    items[idx] = { name: newName, rate: newRate };
                    db.ref('vendorItems/' + key).set(items).then(() => {
                        modal.remove();
                        appAlert('Success', 'Item updated successfully!');
                        // લિસ્ટ લાઈવ રિફ્રેશ કરો
                        renderAdminCanteens();
                        renderVendorItemsList();
                    });
                };

            window.removeVendorItem = function(vendor, idx) {
                appConfirm('Delete Item', `Are you sure you want to delete this item from ${vendor}?`, () => {
                    const key = vendor.toLowerCase().trim();
                    const items = vendorItemsCatalog[key] || [];
                    if (idx >= 0 && idx < items.length) { 
                        items.splice(idx, 1);
                        db.ref('vendorItems/' + key).set(items).then(() => {
                            renderAdminCanteens();
                            renderVendorItemsList();
                        }); 
                    }
                });
            };;

            window.renderAdminLiveRecords = function() {
                const dateVal = document.getElementById('liveReportDate').value;
                const typeVal = document.getElementById('liveReportType').value;
                const pantryVal = document.getElementById('liveReportPantry').value;
                const targetDMY = convertYMDtoDMY(dateVal);
                const listEl = document.getElementById('liveReportList');
                if (!listEl) return;
                let records = [];
                const supplyVal = document.getElementById('liveReportSupply') ? document.getElementById('liveReportSupply').value : 'All';

                if (typeVal === 'regular') {
                    records = logsData.filter(l => l.date === targetDMY);
                } else {
                    records = window.getCombinedExtraTea().filter(l => l.date === targetDMY);
                }
                
                if (pantryVal !== 'All') records = records.filter(l => l.pantryId === pantryVal);

                if (supplyVal !== 'All') {
                    records = records.filter(l => {
                        const s = l.supplySource || 'Contractor';
                        return s === supplyVal;
                    });
                }

                let tea = 0, coffee = 0, green = 0, lemon = 0, blackT = 0, blackC = 0, total = 0;
                records.forEach(r => {
                    const d = (r.drink || r.beverage || '').toLowerCase();
                    const q = r.qty ? Number(r.qty) : 1;
                    if (d === 'tea') tea += q;
                    else if (d === 'coffee') coffee += q;
                    else if (d === 'green tea') green += q;
                    else if (d === 'lemon tea') lemon += q;
                    else if (d === 'black tea') blackT += q;
                    else if (d === 'black coffee') blackC += q;
                    total += q;
                });

                document.getElementById('liveTeaTotal').innerText = tea;
                document.getElementById('liveCoffeeTotal').innerText = coffee;
                document.getElementById('liveGreenTotal').innerText = green;
                document.getElementById('liveLemonTotal').innerText = lemon;
                document.getElementById('liveBlackTeaTotal').innerText = blackT;
                document.getElementById('liveBlackCoffeeTotal').innerText = blackC;
                document.getElementById('liveGrandTotal').innerText = total;

                if (!records.length) { listEl.innerHTML = `<p style="text-align:center; padding:12px; color:#74777F; font-size:.85rem;">No records.</p>`; return; }

                  <div style="text-align:right;"><small style="color:#0A56D0;">🧑‍🍳 ${safeStr(l.pantryName)}</small></div>
                </div>
              `
                    ).join('');
                } else {
                    listEl.innerHTML = records.map(l =>
                        `
                <div style="background:#fff; border-left:3px solid #D97706; margin:4px 0; padding:10px; border-radius:8px; font-size:.85rem; display:flex; justify-content:space-between; align-items:center;">
                  <div><strong>${safeStr(l.employeeName)}</strong> <span style="color:#D97706; font-weight:bold;">[${l.qty} Cups]</span><br><small style="color:#44474E;">${l.beverage} | ${l.reason || l.remarks || 'No Reason'}</small></div>
                  <div style="text-align:right;"><small style="color:#0A56D0;">🧑‍🍳 ${safeStr(l.pantryName)}</small></div>
                </div>
              `
                    ).join('');
                }
            };

                let html = '';

                if (type === 'regular') {
                    const cat = document.getElementById('reportCategory').value;
                    const incFb = document.getElementById('includeFeedbackCol')?.checked;

                    if (cat === 'All') return appAlert('Notice', 'Please select a specific category (Faculty, Staff, Law, Outsourced).');
                    const categoryMatch = cat.trim().toLowerCase();
                    const isDAU = (categoryMatch === 'faculty' || categoryMatch === 'staff') ? 'DAU ' : '';
                    const title = `MONTHLY TEA OF ${isDAU}${cat.toUpperCase()} - ${supplyText} (${monthStr})`;
                    let trs = '';
                    let sumT = 0, sumC = 0, sumGT = 0, sumLT = 0, sumBT = 0, sumBC = 0;
                    let sr = 1;

                    const emps = employeeList.filter(e => {
                        const c = (e.category || '').trim().toLowerCase();
                        if (categoryMatch === 'outsourced' || categoryMatch === 'outsource') return c.includes('outsource');
                        return c === categoryMatch;
                    });

                    if (!emps.length && categoryMatch !== 'outsourced' && categoryMatch !== 'outsource') {
                        return appAlert('No Data', `No employees in this category for ${supplyText}.`);
                    }

                    const colCount = incFb ? 11 : 9;
                    const theadHtml = `
                      <thead>
                        <tr><th colspan="${colCount}" style="border:none; font-size:18px; text-decoration:underline; padding-bottom:20px; text-align:center;">${title}</th></tr>

                            <th ${incFb ? 'rowspan="2"' : ''} class="sr-col" style="border:1px solid #000;">SR.<br>NO.</th>
                            <th ${incFb ? 'rowspan="2"' : ''} class="name-col" style="border:1px solid #000;">NAME</th>
                            <th ${incFb ? 'rowspan="2"' : ''} class="drink-col" style="border:1px solid #000;">TEA</th>
                            <th ${incFb ? 'rowspan="2"' : ''} class="drink-col" style="border:1px solid #000;">COFFEE</th>
                            <th ${incFb ? 'rowspan="2"' : ''} class="drink-col" style="border:1px solid #000;">GREEN<br>TEA</th>
                            <th ${incFb ? 'rowspan="2"' : ''} class="drink-col" style="border:1px solid #000;">LEMON<br>TEA</th>
                            <th ${incFb ? 'rowspan="2"' : ''} class="drink-col" style="border:1px solid #000;">BLACK<br>TEA</th>
                            <th ${incFb ? 'rowspan="2"' : ''} class="drink-col" style="border:1px solid #000;">BLACK<br>COFFEE</th>
                            ${incFb ? '<th colspan="2" style="border:1px solid #000;">Tea/Coffee Feedback</th>' : ''}
                            <th ${incFb ? 'rowspan="2"' : ''} class="sign-col" style="border:1px solid #000;">SIGNATURE</th>
                        </tr>
                        ${incFb ? '<tr style="background:#F1F5F9;"><th style="border:1px solid #000; width:50px;">Good</th><th style="border:1px solid #000; width:50px;">Bad</th></tr>' : ''}
                      </thead>
                    `;

                    const fbCells = incFb ? `<td></td><td></td>` : '';

                    emps.forEach(emp => {
                        let t = 0, c = 0, gt = 0, lt = 0, bt = 0, bc = 0;
                        
                        const empLogs = logsData.filter(l => l.employeeId === emp.id && parseDMYToYMD(l.date).startsWith(month) && (l.supplySource === supplySource || (!l.supplySource && supplySource === 'Contractor')));
                        const uniqueLogs = {};
                        empLogs.forEach(log => { uniqueLogs[log.date + '_' + log.session] = log; });
                        
                        Object.values(uniqueLogs).forEach(log => {
                            const d = (log.drink || '').toLowerCase().trim();
                            if (d === 'tea') t++; else if (d === 'coffee') c++; else if (d === 'green tea') gt++;
                            else if (d === 'lemon tea') lt++; else if (d === 'black tea') bt++; else if (d === 'black coffee') bc++;
                        });

                        sumT += t; sumC += c; sumGT += gt; sumLT += lt; sumBT += bt; sumBC += bc;
                        trs += `<tr><td>${sr++}</td><td class="left-align">${safeStr(emp.name)}</td><td>${t}</td><td>${c}</td><td>${gt}</td><td>${lt}</td><td>${bt}</td><td>${bc}</td>${fbCells}<td></td></tr>`;
                    });

                    if ((categoryMatch === 'outsourced' || categoryMatch === 'outsource') && supplySource === 'Contractor') {
                        db.ref('Workers_Tea/' + month).once('value', snap => {
                            const dataSnap = snap.val() || {};
                            let hkT = 0, hkC = 0, gdT = 0, gdC = 0, secT = 0, secC = 0;
                            for (const dept in dataSnap) {
                                for (const dateStr in dataSnap[dept]) {
                                    if (dept === 'Security') {
                                        for (const shift in dataSnap[dept][dateStr]) {
                                            const entry = dataSnap[dept][dateStr][shift];
                                            secT += Number(entry.tea) || 0; secC += Number(entry.coffee) || 0;
                                        }

                                        const entry = dataSnap[dept][dateStr];
                                        const t = Number(entry.tea) || 0; const c = Number(entry.coffee) || 0;

                        <tr style="background:#FFFFFF;"><td></td><td class="left-align" style="font-weight:600; color:#000000;">Garden Staff (Safal)</td><td>${gdT}</td><td>${gdC}</td><td>0</td><td>0</td><td>0</td><td>0</td>${fbCells}<td></td></tr>
                        <tr style="background:#FFFFFF;"><td></td><td class="left-align" style="font-weight:600; color:#000000;">Security Staff (Kavach)</td><td>${secT}</td><td>${secC}</td><td>0</td><td>0</td><td>0</td><td>0</td>${fbCells}<td></td></tr>
                        <tr class="total-row"><td></td><td class="left-align" style="text-align:center;">TOTAL</td><td>${sumT + wT}</td><td>${sumC + wC}</td><td>${sumGT}</td><td>${sumLT}</td><td>${sumBT}</td><td>${sumBC}</td>${fbCells}<td></td></tr>
                      </tbody>
                    </table>
                  `;
                            showPreview(fullHtml);

                </table>`;
                
                } else if (type === 'extra') {

                    });

                    if (typeof mgRecordsData !== 'undefined' && mgRecordsData.length > 0) {

                            let recYMD = '';

                                recYMD = parseDMYToYMD(rec.DateFormatted);

                                { v: 0, s: cellCenter }, { v: 0, s: cellCenter }, { v: '', s: cellCenter }]);

                for (let R = range.s.r; R <= range.e.r; ++R) {
                    for (let C = range.s.c; C <= range.e.c; ++C) {
                        const cellAddress = XLSX.utils.encode_cell({ r: R, c: C });
                        const cell = ws[cellAddress];
                        if (!cell) continue;

                        if (R > 0) {
                            const cellText = String(cell.v);
                            if (!colWidths[C]) colWidths[C] = { wch: 8 }; 
                            const textLength = Math.min(cellText.length + 3, 50); 
                            if (textLength > colWidths[C].wch) {

                            }
                        }

                        cell.s = cell.s || {};

                        cell.s.alignment = cell.s.alignment || {};
                        cell.s.alignment.vertical = "center";

                        }

            window.generatePantryBoyReport = function(type, isExcel, overrideMonth, overrideSupply, overridePantryId) {
                const month = overrideMonth || document.getElementById('reportMonth')?.value;
                if (!month) return appAlert('Error', 'Select month.');
                
                const supplySource = overrideSupply || document.getElementById('reportSupplySource')?.value || 'Contractor';
                const supplyText = supplySource === 'Contractor' ? 'IA Caterers' : 'DAU Direct';
                
                let selectedPantryId = overridePantryId;
                if (!selectedPantryId) {
                    const pantrySelectId = type === 'regular' ? 'pbReportPantryReg' : 'pbReportPantryMeet';
                    selectedPantryId = document.getElementById(pantrySelectId)?.value;
                }
                const pantryName = selectedPantryId === 'All' ? 'All Pantry Boys' : pantryTeam.find(p => p.id === selectedPantryId)?.name || 'Unknown';
                
                const dateObj = new Date(month + '-01');
                const monthStr = dateObj.toLocaleString('en-US', { month: 'long', year: 'numeric' }).toUpperCase();
                const title = `DELIVERY REPORT (${type.toUpperCase()}) - ${monthStr} [${supplyText}]`;

                const [yy, mm] = month.split('-');
                const daysInMonth = new Date(yy, mm, 0).getDate();

                const bevCols = ['Tea', 'Coffee', 'Green Tea', 'Lemon Tea', 'Black Tea', 'Black Coffee'];
                let reportData = {}; 
                
                const mapBeverageType = (name) => {
                    if (!name) return 'Tea';
                    const n = String(name).toLowerCase();
                    if (n.includes('green')) return 'Green Tea';
                    if (n.includes('lemon')) return 'Lemon Tea';
                    if (n.includes('black tea')) return 'Black Tea';
                    if (n.includes('black coffee')) return 'Black Coffee';
                    if (n.includes('coffee')) return 'Coffee';
                    return 'Tea'; 
                };

                const isBeverage = (name) => {
                    if (!name) return false;
                    const n = String(name).toLowerCase();
                    return bevCols.some(b => n.includes(b.toLowerCase())) || n.includes('milk') || n.includes('soup') || n.includes('bournvita');
                };

                if (type === 'regular') {
                    const filtered = logsData.filter(l => l.date && parseDMYToYMD(l.date).startsWith(month) && (l.supplySource === supplySource || (!l.supplySource && supplySource === 'Contractor')));
                    
                    filtered.forEach(log => {
                        if (selectedPantryId !== 'All' && log.pantryId !== selectedPantryId) return;
                        
                        const ymd = parseDMYToYMD(log.date);
                        const drink = mapBeverageType(log.drink);
                        
                        if (!reportData[ymd]) reportData[ymd] = { 'Tea':0, 'Coffee':0, 'Green Tea':0, 'Lemon Tea':0, 'Black Tea':0, 'Black Coffee':0 };
                        reportData[ymd][drink] += 1;
                    });
                } else if (type === 'meeting') {
                    const flatMeetingItems = [];
                    
                    eventLogsData.forEach(ev => {
                        if (!ev.date || !parseDMYToYMD(ev.date).startsWith(month)) return;

                            ev.items.forEach(item => {
                                const vName = String(item.vendor || ev.canteenSource || '').toLowerCase();
                                const isDAU = vName.includes('dau direct') || vName === 'dau direct purchase';
                                if ((supplySource === 'DAU Direct Purchase' && isDAU) || (supplySource === 'Contractor' && !isDAU)) {
                                    if (isBeverage(item.name)) {
                                        flatMeetingItems.push({
                                            date: item.itemSpecificDate || ev.date,
                                            pantryName: item.servedBy || ev.servedByName || ev.pantryName || 'Unknown',
                                            drink: item.name,
                                            qty: Number(item.qty) || 0
                                        });
                                    }
                                }
                            });
                        }
                    });

                    mgRecordsData.forEach(rec => {

                        const recYMD = rec.DateFormatted && rec.DateFormatted.includes('/') ? parseDMYToYMD(rec.DateFormatted) : (rec.RawDate || new Date(rec.Timestamp).toISOString().split('T')[0]);
                        if(!recYMD.startsWith(month)) return;
                        
                        const vName = String(rec.Vendor || '').toLowerCase();
                        const isDAU = vName.includes('dau direct') || vName === 'dau direct purchase';

                            if (isBeverage(rec.Item)) {
                                flatMeetingItems.push({
                                    date: rec.DateFormatted || convertYMDtoDMY(rec.RawDate),
                                    pantryName: rec.ServedBy || 'Unknown',
                                    drink: rec.Item,
                                    qty: Number(rec.Qty) || 0
                                });

                        }
                    });

                    flatMeetingItems.forEach(item => {

                }

                let trs = '';
                let grandTotals = { 'Tea':0, 'Coffee':0, 'Green Tea':0, 'Lemon Tea':0, 'Black Tea':0, 'Black Coffee':0 };
                let excelData = [];
                const bStyle = { style: 'thin', color: { rgb: "000000" } };

                const cellCenter = { alignment: { horizontal: "center", vertical: "center" }, border: { top: bStyle, bottom: bStyle, left: bStyle, right: bStyle } };
                
                excelData.push([{ v: title, s: { font: { bold: true, sz: 14 }, alignment: { horizontal: 'center' } } }, '', '', '', '', '', '']);
                excelData.push([

                        window.renderPantryLiveUpcomingEventsCard = function() {
                const stream = document.getElementById('pantryDashboardUpcomingStream');
                const card = document.getElementById('livePantryBroadcastCard');
                if (!stream || !card) return;
                
                const today = new Date().setHours(0, 0, 0, 0);
                
                // નવો ફેરફાર: હવે નોટિફિકેશન સીધું eventLogsData માંથી આવશે અને માત્ર ત્યારે જ દેખાશે જો showNotification માં ટિક કર્યું હશે 
                const active = eventLogsData.filter(ev => {
                    const isFutureOrToday = new Date(parseDMYToYMD(ev.date)) >= today;
                    return isFutureOrToday && ev.showNotification === true;
                });
                
                if (!active.length) { 
                    card.classList.add('hidden');
                    stream.innerHTML = ''; 
                } else {
                    card.classList.remove('hidden');
                    stream.innerHTML = active.map(ev =>
                        `

                    ).join('');
                }
            };


            // ============================================================
            // UNIFIED SPLIT-ROW ROW ARCHIVE LOGIC (DATE & VENDOR WISE SPLIT)
            // ============================================================
            window.generateSplitRowsTableHtml = function(dataSourceArray, canDelete = false) {
                const flatRows = [];
                dataSourceArray.forEach(ev => {
                    if (ev.items && Array.isArray(ev.items) && ev.items.length > 0) {
                        ev.items.forEach(item => {
                            flatRows.push({
                                parentId: ev.id,
                                eventName: ev.eventName,
                                reqBy: ev.orderedBy,
                                pantry: item.servedBy || ev.servedByName || ev.pantryName || '-',
                                date: item.itemSpecificDate || ev.date,
                                vendor: item.vendor || ev.canteenSource || 'Various',
                                itemName: item.name,
                                itemQty: item.qty,
                                itemRate: item.rate,
                                itemAmount: item.amount || (item.qty * item.rate)
                            });
                        });
                    } else {
                        flatRows.push({
                            parentId: ev.id,
                            eventName: ev.eventName,
                            reqBy: ev.orderedBy,
                            pantry: ev.servedByName || ev.pantryName || '-',
                            date: ev.date,
                            vendor: ev.canteenSource || '-',
                            itemName: ev.refreshmentSummary || 'Details',
                            itemQty: '-',
                            itemRate: '-',
                            itemAmount: ev.amount || 0
                        });
                    }
                });

                flatRows.sort((a,b) => parseDMYToYMD(b.date).localeCompare(parseDMYToYMD(a.date)));

                if (!flatRows.length) {
                    return `<p style="padding:20px; text-align:center; color:#64748B;">No record archives found.</p>`;
                }

                let html = `
                  <table class="pro-table" style="width:100%; border-collapse:collapse; text-align:left; font-size:12px;">
                    <thead>
                        <tr style="background:#F1F5F9; border-bottom:2px solid #CBD5E1;">
                            <th style="padding:8px; border:1px solid #CBD5E1;">Date</th>
                            <th style="padding:8px; border:1px solid #CBD5E1;">Vendor</th>
                            <th style="padding:8px; border:1px solid #CBD5E1;">Event Purpose</th>
                            <th style="padding:8px; border:1px solid #CBD5E1;">Requested By</th>
                            <th style="padding:8px; border:1px solid #CBD5E1;">Item Name</th>
                            <th style="padding:8px; border:1px solid #CBD5E1; text-align:center;">Qty</th>
                            <th style="padding:8px; border:1px solid #CBD5E1; text-align:center;">Rate</th>
                            <th style="padding:8px; border:1px solid #CBD5E1; text-align:center;">Amount</th>
                            <th style="padding:8px; border:1px solid #CBD5E1;">Pantry Boy</th>
                            <th style="padding:8px; border:1px solid #CBD5E1; text-align:center;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>`;

                flatRows.forEach(row => {
                    html += `
                        <tr style="border-bottom:1px solid #E2E8F0;">
                            <td style="padding:8px; border:1px solid #E2E8F0; font-weight:600; white-space:nowrap;">${safeStr(row.date)}</td>
                            <td style="padding:8px; border:1px solid #E2E8F0; color:#0A56D0; font-weight:500; cursor:pointer;" onclick="window.openVendorSheet('${row.vendor}','${row.vendor}')"><u>${safeStr(row.vendor)}</u></td>
                            <td style="padding:8px; border:1px solid #E2E8F0; font-weight:700;">${safeStr(row.eventName)}</td>
                            <td style="padding:8px; border:1px solid #E2E8F0;">${safeStr(row.reqBy)}</td>
                            <td style="padding:8px; border:1px solid #E2E8F0; font-weight:600; color:#334155;">${safeStr(row.itemName)}</td>
                            <td style="padding:8px; border:1px solid #E2E8F0; text-align:center;">${row.itemQty}</td>
                            <td style="padding:8px; border:1px solid #E2E8F0; text-align:center;">${row.itemRate !== '-' ? '₹'+row.itemRate : '-'}</td>
                            <td style="padding:8px; border:1px solid #E2E8F0; text-align:center; font-weight:800; color:#1E293B;">₹${Number(row.itemAmount).toFixed(2)}</td>
                            <td style="padding:8px; border:1px solid #E2E8F0; color:#0A56D0; font-weight:600;">${safeStr(row.pantry)}</td>
                            <td style="padding:8px; border:1px solid #E2E8F0; text-align:center;">
                                <div class="action-cell" style="justify-content:center;">
                                    <button class="edit-btn" onclick="window.editMeetingEvent('${row.parentId}')">✏️ Edit Main</button>
                                    ${canDelete ? `<button class="del-btn" onclick="window.pantryDeleteHandler('event','${row.parentId}')">🗑</button>` : ''}
                                </div>
                            </td>
                        </tr>`;
                });

                html += `</tbody></table>`;
                return html;
            };

    if (ev.items && Array.isArray(ev.items) && ev.items.length > 0) {

    document.getElementById('editEvtSaveBtn').onclick = function() {
