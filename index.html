                            </label>`;
                        }
                    });
                    list.innerHTML = html || '<p style="padding:12px; color:#74777F; text-align:center;">No employees found.</p>';
                }

                document.getElementById('locDeptFilter').onchange = renderLocationList;
                document.getElementById('locSearchInput').oninput = renderLocationList;
                
                document.getElementById('selectAllLocTransfer').onchange = function() {
                    document.querySelectorAll('.loc-employee-check').forEach(cb => cb.checked = this.checked);
                };

                modal.classList.remove('hidden');
                renderLocationList();

                document.getElementById('locSaveEmployees').onclick = function() {
                    const checks = list.querySelectorAll('.loc-employee-check:checked');
                    if(checks.length === 0) return appAlert('Notice', 'Please select at least one employee to transfer.');
                    
                    appConfirm('Confirm Transfer', `Move ${checks.length} selected employees to ${locationName}?`, () => {
                        const updates = {};
                        checks.forEach(cb => {
                            updates[cb.dataset.id + '/locationNode'] = locationName;

                            if(typeof renderAdminVenues === 'function') renderAdminVenues();
                        }).catch(err => { appAlert('Error', 'Update failed: ' + err.message); });
                    });
                };
            };

                            const rootUpdates = {};
                            let processedCount = 0;
                            
                            function getSimilarity(s1, s2) {
                                s1 = cleanName(s1); s2 = cleanName(s2);
                                if(s1 === s2) return 1.0; 
                                const words1 = s1.split(/\s+/).sort().join(' ');
                                const words2 = s2.split(/\s+/).sort().join(' ');
                                if(words1 === words2) return 1.0;
                                let longer = s1, shorter = s2;
                                if (s1.length < s2.length) { longer = s2; shorter = s1; }
                                let longerLength = longer.length;
                                if (longerLength === 0) return 1.0;
                                let costs = [];
                                for (let i = 0; i <= longerLength; i++) {
                                    let lastValue = i;
                                    for (let j = 0; j <= shorter.length; j++) {
                                        if (i === 0) costs[j] = j;
                                        else if (j > 0) {
                                            let newValue = costs[j - 1];
                                            if (longer.charAt(i - 1) !== shorter.charAt(j - 1)) newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                                            costs[j - 1] = lastValue; lastValue = newValue;
                                        }
                                    }
                                    if (i > 0) costs[shorter.length] = lastValue;
                                }
                                let levSim = (longerLength - costs[shorter.length]) / parseFloat(longerLength);
                                let wordMatchSim = 0;
                                const arr1 = s1.split(/\s+/); const arr2 = s2.split(/\s+/);
                                const matchCount = arr1.filter(w => arr2.includes(w)).length;
                                wordMatchSim = matchCount / Math.max(arr1.length, arr2.length);

                                    if (item.photoUrl && !existingEmp.photoUrl) rootUpdates['employees/' + bestMatchId + '/photoUrl'] = item.photoUrl; 
                                    
                                } else {

                                }
                                
                                rootUpdates['webSyncPending/' + item.id] = null;

                            if (processedCount > 0) {

                        break;

                    // 🚨 Settings નું નવું ઓપ્શન

const jsonText = JSON.stringify(backup, null, 2);

const base64 = btoa(

}
                    appAlert('Backup Complete', `Backup saved with ${Object.keys(backup.data).length} nodes.`);

            function restoreAllData() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                input.onchange = function(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        try {
                            const backup = JSON.parse(ev.target.result);
                            if (!backup.data || typeof backup.data !== 'object') {
                                return appAlert('Invalid', 'Invalid backup format.');
                            }
                            appConfirm('Restore', 'This will overwrite all existing data. Continue?', () => {
                                const updates = {};
                                for (const [path, val] of Object.entries(backup.data)) {
                                    if (val !== null && val !== undefined) {
                                        updates[path] = val;
                                    }
                                }
                                db.ref().update(updates).then(() => {
                                    appAlert('Restore Complete', 'All data restored successfully!');
                                }).catch(err => appAlert('Restore Failed', err.message));
                            });
                        } catch (err) {
                            appAlert('Error', 'Invalid JSON file.');
                        }
                    };
                    reader.readAsText(file);
                };
                input.click();
            }
            // ============================================================
            // SMART EMPLOYEE DUPLICATE SCANNER (FIXED FOR INITIALS)
            // ============================================================
            window.checkAndShowEmployeeDuplicates = function() {
                const activeEmps = employeeList.filter(e => e.status !== 'Inactive');
                const duplicates = [];
                const seenIds = new Set();

                function isDuplicate(n1, n2) {
                    let clean = (n) => n.toLowerCase().replace(/^(dr\.|prof\.|mr\.|ms\.|mrs\.|dr|prof|mr|ms|mrs)\s+/g, '').replace(/[^a-z0-9\s]/g, '').trim();
                    let s1 = clean(n1);
                    let s2 = clean(n2);
                    if (s1 === s2) return true;

                    let w1 = s1.split(/\s+/);
                    let w2 = s2.split(/\s+/);

                    // સ્માર્ટ અટક (Surname) અને શોર્ટ નામ ચેકર
                    if (w1.length >= 2 && w2.length >= 2) {
                        let last1 = w1[w1.length - 1];
                        let last2 = w2[w2.length - 1];
                        
                        // જો અટક સરખી હોય (જેમ કે supekar == supekar)
                        if (last1 === last2 && last1.length > 2) {
                            let first1 = w1[0];
                            let first2 = w2[0];
                            if (first1 === first2) return true;
                            
                            // 🚨 BUG FIX: જો કોઈ એક નામ શોર્ટ ફોર્મ (1 કે 2 અક્ષરનું) હોય, તો જ પહેલો અક્ષર મેચ કરો!
                            // ઉદાહરણ: 'k' અને 'kesore' મેચ થશે, પણ 'jashvant' અને 'jitendra' મેચ નહિ થાય.
                            let isF1Short = first1.length <= 2;
                            let isF2Short = first2.length <= 2;
                            
                            if ((isF1Short || isF2Short) && first1.charAt(0) === first2.charAt(0)) {
                                if (isF1Short !== isF2Short) return true; // એક શોર્ટ અને એક આખું
                                if (isF1Short && isF2Short) return true; // બંને શોર્ટ
                            }
                        }
                    }
                    
                    // નોર્મલ સ્પેલિંગ મિસ્ટેક માટે (85% મેચિંગ હોવું જરૂરી છે)
                    let longer = s1, shorter = s2;
                    if (s1.length < s2.length) { longer = s2; shorter = s1; }
                    let longerLength = longer.length;
                    if (longerLength === 0) return true;
                    let costs = [];
                    for (let i = 0; i <= longerLength; i++) {
                        let lastValue = i;
                        for (let j = 0; j <= shorter.length; j++) {
                            if (i === 0) costs[j] = j;
                            else if (j > 0) {
                                let newValue = costs[j - 1];
                                if (longer.charAt(i - 1) !== shorter.charAt(j - 1)) newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                                costs[j - 1] = lastValue; lastValue = newValue;
                            }
                        }
                        if (i > 0) costs[shorter.length] = lastValue;
                    }
                    let sim = (longerLength - costs[shorter.length]) / parseFloat(longerLength);
                    
                    // 75% થી વધારીને 85% કર્યું છે, જેથી અલગ અલગ નામ ભેગા ના થઈ જાય
                    if(sim >= 0.85) return true; 
                    
                    return false;
                }

                for (let i = 0; i < activeEmps.length; i++) {
                    if (seenIds.has(activeEmps[i].id)) continue;
                    let group = [activeEmps[i]];
                    for (let j = i + 1; j < activeEmps.length; j++) {
                        if (seenIds.has(activeEmps[j].id)) continue;
                        if (isDuplicate(activeEmps[i].name, activeEmps[j].name)) { 
                            group.push(activeEmps[j]);
                            seenIds.add(activeEmps[j].id);
                        }
                    }
                    if (group.length > 1) {
                        duplicates.push(group);
                        seenIds.add(activeEmps[i].id);
                    }
                }

                const warnBox = document.getElementById('empDuplicateWarningBox');
                if (!warnBox) return;

                if (duplicates.length === 0) {
                    warnBox.innerHTML = '';
                    return;
                }

                let html = `<div style="background:#FEF2F2; border:1px solid #EF4444; border-radius:8px; padding:10px; margin-bottom:10px;">
                    <h4 style="color:#B91C1C; margin:0 0 8px 0; font-size:13px;">⚠️ Duplicate Names Found! (${duplicates.length} groups)</h4>`;
                
                duplicates.forEach((grp, idx) => {
                    const encodedGrp = encodeURIComponent(JSON.stringify(grp)).replace(/'/g, "%27");
                    html += `<div style="background:#fff; border:1px dashed #FCA5A5; padding:8px; border-radius:6px; margin-bottom:6px; font-size:11px;">
                        <div style="color:#7F1D1D; font-weight:bold; margin-bottom:4px;">Group ${idx + 1}: ${safeStr(grp[0].name)}</div>
                        <ul style="margin:0 0 6px 16px; padding:0; color:#475569;">
                            ${grp.map(e => `<li>${safeStr(e.name)} <span style="color:#94A3B8;">[Loc: ${e.locationNode || '-'}, PB: ${pantryTeam.find(p=>p.id===e.assignedPantryId)?.name || '-'}]</span></li>`).join('')}
                        </ul>
                        <button onclick="window.openMergeEmployeeModal('${encodedGrp}')" style="background:#EF4444; color:#fff; border:none; padding:6px 12px; border-radius:4px; font-weight:bold; cursor:pointer; font-size:11px;">🔄 Review & Merge Data</button>
                    </div>`;
                });
                html += `</div>`;
                warnBox.innerHTML = html;
            };

            window.executeEmployeeMerge = function(encodedGrp) {
                const grp = JSON.parse(decodeURIComponent(encodedGrp));
                const keepId = document.getElementById('mergeKeepEmpId').value;
                const keepEmp = grp.find(e => e.id === keepId);
                const deletedEmps = grp.filter(e => e.id !== keepId);
                const deleteIds = deletedEmps.map(e => e.id);
                
                const updates = {};
                let transferCount = 0;
                
                // 1. ડેઈલી ટી (Logs) નો ડેટા ટ્રાન્સફર કરવો
                logsData.forEach(log => {
                    if (deleteIds.includes(log.employeeId)) {
                        updates['logs/' + log.id + '/employeeId'] = keepId;
                        updates['logs/' + log.id + '/employeeName'] = keepEmp.name;
                        transferCount++;
                    }
                });

                // 2. એકસ્ટ્રા ટી (Extra Logs) નો ડેટા ટ્રાન્સફર કરવો
                const allExtra = window.getCombinedExtraTea();
                allExtra.forEach(ex => {
                    if (deleteIds.includes(ex.employeeId)) {
                        const path = ex.isOldLog ? 'extraLogs/' : 'extraTeaRecords/';
                        updates[path + ex.id + '/employeeId'] = keepId;
                        updates[path + ex.id + '/employeeName'] = keepEmp.name;
                        transferCount++;
                    }
                });

                // 3. 🚨 પેન્ટ્રી બોય, લોકેશન અને ફોટો બચાવવા માટેનો નવો કોડ
                deletedEmps.forEach(dEmp => {
                    if (!keepEmp.photoUrl && dEmp.photoUrl) {
                        updates['employees/' + keepId + '/photoUrl'] = dEmp.photoUrl;
                    }
                    if (!keepEmp.category || keepEmp.category === 'Staff') {
                        if (dEmp.category && dEmp.category !== 'Staff') {
                            updates['employees/' + keepId + '/category'] = dEmp.category;
                        }
                    }
                    // પેન્ટ્રી બોય પાછો લાવવા
                    if (!keepEmp.assignedPantryId && dEmp.assignedPantryId) {
                        updates['employees/' + keepId + '/assignedPantryId'] = dEmp.assignedPantryId;
                    }
                    // લોકેશન બચાવવા
                    if ((!keepEmp.locationNode || keepEmp.locationNode === 'No Loc') && dEmp.locationNode) {
                        updates['employees/' + keepId + '/locationNode'] = dEmp.locationNode;
                    }
                });

                // 4. ડુપ્લીકેટ નામ કાઢી નાખવું (Recycle Bin માં મૂકવું)
                deletedEmps.forEach(e => {
                    updates['recycleBin/employees/' + e.id] = e;
                    updates['employees/' + e.id + '/status'] = 'Inactive';
                    // 🚨 અહીથી પેન્ટ્રી બોય ખાલી કરવાનું કાઢી નાખ્યું છે, જેથી બેકઅપ સચવાય
                });

                db.ref().update(updates).then(() => {
                    document.getElementById('mergeEmpModal').remove();
                    appAlert('Success', `Employees merged! ${transferCount} logs, location, and pantry assignment transferred successfully.`);
                    if (window.renderEmployeeList) window.renderEmployeeList();
                    setTimeout(window.checkAndShowEmployeeDuplicates, 500);
                }).catch(err => {
                    appAlert('Error', err.message);
                });
            };

            async function importExcel() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.xlsx,.xls';
                input.onchange = async (e) => {
                    const file = e.target.files[0];
                    const data = await file.arrayBuffer();
                    const wb = XLSX.read(data);
                    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                    let count = 0;
                    rows.forEach((row, idx) => {
                        const name = row['Name'] || row['Employee Name'] || row['EmployeeName'] || '';
                        const cat = row['Category'] || 'Staff';
                        const pantryName = row['Pantry Boy'] || row['PantryBoy'] || row['Pantry Name'] || '';
                        const locNode = row['Location'] || row['Venue'] || row['Location Node'] || '';
                        const dept = row['Department'] || row['Dept'] || '';
                        if (name) {
                            const id = 'emp_' + Date.now() + '_' + idx + '_' + Math.floor(Math.random() *
                                10000);
                            let assignedId = "";
                            if (pantryName) {
                                const found = pantryTeam.find(p => p.name.toLowerCase() === String(
                                    pantryName).toLowerCase().trim());
                                if (found) assignedId = found.id;
                            }
                            db.ref('employees/' + id).set({ id, name: String(name).trim(), category: String(
                                    cat).trim(), assignedPantryId: assignedId, locationNode: String(
                                    locNode).trim(), department: String(dept).trim() });
                            count++;
                        }
                    });
                    appAlert('Import', `✅ ${count} employees imported!`);
                };
                input.click();
            }

            window.previewPantryAllocationReport = function() {
                if (!pantryTeam.length) return appAlert('No Data', 'No pantry boys found.');
                
                let tbodyHtml = '';
                
                // For Excel Export
                const excelData = [
                    ['DAU PANTRY BOY DEPLOYMENT & ALLOCATION LIST', '', '', '', ''],
                    ['Pantry Boy Name', 'Category Summary', 'Location (Building)', 'Loc. Count', 'Employee Name']
                ];
                const merges = [
                    { s: { r: 0, c: 0 }, e: { r: 0, c: 4 } }
                ];
                let currentRow = 2; // Starts from 2

                pantryTeam.forEach(pb => {
                    if (pb.status === 'Inactive') return;
                    const myEmps = employeeList.filter(e => e.status !== 'Inactive' && e.assignedPantryId === pb.id);
                    
                    if(myEmps.length === 0) {
                        tbodyHtml += `<tr>
                            <td style="border:1px solid #000;"><b>${safeStr(pb.name)}</b></td>
                            <td style="border:1px solid #000;">-</td>
                            <td style="border:1px solid #000;"></td>
                            <td style="border:1px solid #000;">0</td>
                            <td style="border:1px solid #000;">-</td>
                        </tr>`;
                        excelData.push([pb.name, '-', '', 0, '-']);
                        currentRow++;
                        return;
                    }
                    
                    const catCount = {};
                    myEmps.forEach(e => {
                        let c = (e.category || 'Other').trim(); // સ્પેસ કાઢવા માટે
                        c = c.charAt(0).toUpperCase() + c.slice(1); // પહેલો અક્ષર કેપિટલ કરવા માટે
                        catCount[c] = (catCount[c] || 0) + 1;
                    });
                    const catStr = Object.entries(catCount).map(([k,v]) => `${k}: ${v}`).join('\n');
                    const catHtml = Object.entries(catCount).map(([k,v]) => `${k}: ${v}`).join('<br>');
                    
                    const grouped = {};
                    myEmps.forEach(emp => {
                        // Unassigned Location હોય તો એમ્પ્ટી રાખવા માટે
                        const loc = (emp.locationNode && emp.locationNode !== 'Unassigned Location') ? emp.locationNode : '';
                        if(!grouped[loc]) grouped[loc] = [];
                        grouped[loc].push(emp.name);
                    });
                    
                    const pbStartRow = currentRow;
                    let pbRowCount = 0;
                    let pbHtml = '';

                    for (const loc in grouped) {
                        const empNamesArr = grouped[loc];
                        const locStartRow = currentRow;
                        
                        empNamesArr.forEach((empName, index) => {
                            if (index === 0 && currentRow === pbStartRow) {
                                excelData.push([pb.name, catStr, loc, empNamesArr.length, empName]);
                            } else if (index === 0) {
                                excelData.push(['', '', loc, empNamesArr.length, empName]);
                            } else {
                                excelData.push(['', '', '', '', empName]);
                            }
                            
                            // HTML building
                            pbHtml += `<tr>`;
                            if (currentRow === pbStartRow) {
                                pbHtml += `<td rowspan="PB_ROWSPAN" style="vertical-align:middle; border:1px solid #000;"><b>${safeStr(pb.name)}</b></td>`;
                                pbHtml += `<td rowspan="PB_ROWSPAN" style="vertical-align:middle; text-align:left; border:1px solid #000;">${catHtml}</td>`;
                            }
                            if (index === 0) {
                                pbHtml += `<td rowspan="${empNamesArr.length}" style="vertical-align:middle; border:1px solid #000;">${safeStr(loc)}</td>`;
                                pbHtml += `<td rowspan="${empNamesArr.length}" style="vertical-align:middle; border:1px solid #000;">${empNamesArr.length}</td>`;
                            }
                            pbHtml += `<td style="text-align:left; padding-left:10px; border:1px solid #000;">${safeStr(empName)}</td>`;
                            pbHtml += `</tr>`;
                            
                            currentRow++;
                            pbRowCount++;
                        });
                        
                        const locEndRow = currentRow - 1;
                        if (locEndRow > locStartRow) {
                            merges.push({ s: { r: locStartRow, c: 2 }, e: { r: locEndRow, c: 2 } });
                            merges.push({ s: { r: locStartRow, c: 3 }, e: { r: locEndRow, c: 3 } });
                        }
                    }
                    
                    const pbEndRow = currentRow - 1;
                    if (pbEndRow > pbStartRow) {
                        merges.push({ s: { r: pbStartRow, c: 0 }, e: { r: pbEndRow, c: 0 } });
                        merges.push({ s: { r: pbStartRow, c: 1 }, e: { r: pbEndRow, c: 1 } });
                    }
                    
                    // Replace PB_ROWSPAN placeholder in HTML
                    pbHtml = pbHtml.replace(/PB_ROWSPAN/g, pbRowCount);
                    tbodyHtml += pbHtml;
                    
                    // Total Row at the end of this Pantry Boy
                    tbodyHtml += `<tr style="background:#E0F2FE; font-weight:bold;">
                        <td colspan="2" style="text-align:right; padding-right:10px; border:1px solid #000;">TOTAL:</td>
                        <td style="border:1px solid #000;"></td>
                        <td style="color:#0A56D0; font-size:14px; border:1px solid #000;">${myEmps.length}</td>
                        <td style="border:1px solid #000;"></td>
                    </tr>`;
                    
                    excelData.push(['', 'TOTAL:', '', myEmps.length, '']);
                    merges.push({ s: { r: currentRow, c: 0 }, e: { r: currentRow, c: 1 } }); // Merge TOTAL label
                    currentRow++;
                });

                // Set export function globally so the button can call it
                window._currentAllocExcelData = { data: excelData, merges: merges };

                const fullHtml = `
                    <div style="text-align:center; margin-bottom:15px;">
                        <h2 style="color:#0A56D0; font-size:16px;">DAU PANTRY BOY DEPLOYMENT & ALLOCATION LIST</h2>
                    </div>
                    <table class="print-table" style="width:100%; border-collapse:collapse; font-size:12px; text-align:center;">
                        <thead>
                            <tr style="background:#F1F5F9;">
                                <th style="border:1px solid #000; padding:8px;">Pantry Boy Name</th>
                                <th style="border:1px solid #000; padding:8px;">Category Summary</th>
                                <th style="border:1px solid #000; padding:8px;">Location (Building)</th>
                                <th style="border:1px solid #000; padding:8px;">Loc. Count</th>
                                <th style="border:1px solid #000; padding:8px;">Employee Name</th>
                            </tr>
                        </thead>
                        <tbody>${tbodyHtml}</tbody>
                    </table>
                `;

                const container = document.getElementById('printAreaContainer');
                container.style.zIndex = "999999999";
                container.innerHTML = `
                    <div class="preview-card" style="max-width:1000px; width:95vw; height:90vh;">
                        <div class="preview-header hide-on-print">
                            <button onclick="window.print()" class="success" style="font-size:.9rem; padding:10px 18px; border-radius:10px; min-height:40px;">🖨️ Print</button>
                            <button onclick="window.exportPantryAllocationExcel()" class="btn" style="font-size:.9rem; padding:10px 18px; border-radius:10px; min-height:40px; background:#0A56D0; color:white;">📊 Download Excel</button>
                            <button onclick="document.getElementById('printAreaContainer').classList.add('hidden')" class="danger" style="font-size:.9rem; padding:10px 18px; border-radius:10px; min-height:40px;">✕ Close</button>
                        </div>
                        <div class="preview-content" style="padding: 15px; overflow-x: auto; background:#fff;">
                            ${fullHtml}
                        </div>
                    </div>
                `;
                container.style.display = 'flex';
                container.classList.remove('hidden');
            };

            window.exportPantryAllocationExcel = function() {
                if (!window._currentAllocExcelData) return;
                const { data, merges } = window._currentAllocExcelData;
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.aoa_to_sheet(data);
                ws['!merges'] = merges;
                
                const bStyle = { style: 'thin', color: { rgb: "000000" } };
                const titleStyle = { font: { bold: true, sz: 14, color: { rgb: "0A56D0" } }, alignment: { horizontal: "center", vertical: "center" }, fill: { fgColor: { rgb: "E0F2FE" } }, border: { top: bStyle, bottom: bStyle, left: bStyle, right: bStyle } };
                const headStyle = { font: { bold: true }, alignment: { horizontal: "center", vertical: "center", wrapText: true }, border: { top: bStyle, bottom: bStyle, left: bStyle, right: bStyle }, fill: { fgColor: { rgb: "F1F5F9" } } };
                const cellCenter = { alignment: { horizontal: "center", vertical: "center", wrapText: true }, border: { top: bStyle, bottom: bStyle, left: bStyle, right: bStyle } };
                const cellLeft = { alignment: { horizontal: "left", vertical: "center", wrapText: true }, border: { top: bStyle, bottom: bStyle, left: bStyle, right: bStyle } };
                const totalStyle = { font: { bold: true }, alignment: { horizontal: "right", vertical: "center" }, border: { top: bStyle, bottom: bStyle, left: bStyle, right: bStyle }, fill: { fgColor: { rgb: "E0F2FE" } } };
                const totalNumStyle = { font: { bold: true, color: { rgb: "0A56D0" } }, alignment: { horizontal: "center", vertical: "center" }, border: { top: bStyle, bottom: bStyle, left: bStyle, right: bStyle }, fill: { fgColor: { rgb: "E0F2FE" } } };

                for (let R = 0; R < data.length; ++R) {
                    for (let C = 0; C < 5; ++C) {
                        let cellRef = XLSX.utils.encode_cell({c:C, r:R});
                        if(!ws[cellRef]) ws[cellRef] = { t: 's', v: '' }; 
                        
                        if (R === 0) {
                            ws[cellRef].s = titleStyle;
                        } else if (R === 1) {
                            ws[cellRef].s = headStyle;
                        } else {
                            if (String(data[R][1]) === 'TOTAL:') {
                                if (C === 0 || C === 1) ws[cellRef].s = totalStyle;
                                else if (C === 3) ws[cellRef].s = totalNumStyle;
                                else ws[cellRef].s = Object.assign({}, cellCenter, { fill: { fgColor: { rgb: "E0F2FE" } }});
                            } else {
                                ws[cellRef].s = (C === 4 || C === 1) ? cellLeft : cellCenter;
                            }
                        }
                    }
                }
                
                ws['!cols'] = [{wch: 22}, {wch: 18}, {wch: 25}, {wch: 12}, {wch: 35}];
                XLSX.utils.book_append_sheet(wb, ws, "Deployment List");
                window.pantryDownloadExcelFile(wb, `Pantry_Deployment_List_${getTodayInDMY().replace(/\//g,'-')}.xlsx`);
            };

                };
            }

            window.editVendorItem = function(vendor, idx) {
                const key = vendor.toLowerCase().trim();
                const items = vendorItemsCatalog[key] || [];
                const item = items[idx];

                    updates['venues/' + id + '/name'] = newName;
                    
                    // બલ્ક અપડેટ - જે એમ્પ્લોયીમાં આ જૂનું લોકેશન હોય તેને નવું કરી દો
                    employeeList.forEach(emp => {

                            updates['employees/' + emp.id + '/locationNode'] = newName;

                    });

                    db.ref().update(updates).then(() => {
                        modal.remove();

            window.addDeptToVenue = function(vId) {
                const venue = venueList.find(v => v.id === vId);
                if(!venue) return;
                const newDept = prompt(`Enter new department name for location "${venue.name}":`);
                if(newDept && newDept.trim()) {
                    let depts = venue.departments || [];
                    if(!Array.isArray(depts)) depts = Object.values(depts);
                    if(depts.map(d=>d.toLowerCase()).includes(newDept.trim().toLowerCase())) {
                        return appAlert('Duplicate', 'Department already exists in this location.');
                    }
                    depts.push(newDept.trim());
                    db.ref('venues/' + vId + '/departments').set(depts).then(() => {
                        appAlert('Success', 'Department added to location!');
                    });
                }
            };

            window.renderAdminLiveRecords = function() {
                const dateVal = document.getElementById('liveReportDate').value;

                const pantryVal = document.getElementById('liveReportPantry').value;
                const targetDMY = convertYMDtoDMY(dateVal);

                let records = [];
                const supplyVal = document.getElementById('liveReportSupply') ? document.getElementById('liveReportSupply').value : 'All';

                if (typeVal === 'regular') {
                    records = logsData.filter(l => l.date === targetDMY);
                } else {
                    records = window.getCombinedExtraTea().filter(l => l.date === targetDMY);
                }
                
                if (pantryVal !== 'All') records = records.filter(l => l.pantryId === pantryVal);

                if (supplyVal !== 'All') {
                    records = records.filter(l => {
                        const s = l.supplySource || 'Contractor';
                        return s === supplyVal;
                    });
                }

                let tea = 0, coffee = 0, green = 0, lemon = 0, blackT = 0, blackC = 0, total = 0;
                records.forEach(r => {
                    const d = (r.drink || r.beverage || '').toLowerCase();
                    const q = r.qty ? Number(r.qty) : 1;
                    if (d === 'tea') tea += q;
                    else if (d === 'coffee') coffee += q;
                    else if (d === 'green tea') green += q;
                    else if (d === 'lemon tea') lemon += q;
                    else if (d === 'black tea') blackT += q;
                    else if (d === 'black coffee') blackC += q;
                    total += q;
                });

                document.getElementById('liveTeaTotal').innerText = tea;
                document.getElementById('liveCoffeeTotal').innerText = coffee;
                document.getElementById('liveGreenTotal').innerText = green;
                document.getElementById('liveLemonTotal').innerText = lemon;
                document.getElementById('liveBlackTeaTotal').innerText = blackT;
                document.getElementById('liveBlackCoffeeTotal').innerText = blackC;
                document.getElementById('liveGrandTotal').innerText = total;

                    wrapper.innerHTML = `<div style="flex:1; display:flex; justify-content:center; align-items:center; color:#64748B; font-weight:bold;">No employees found for this filter combination.</div>`;
                    return;
                }
                
                const buildCell = (empId, dateDMY, session, currentDrink, logId) => {
                    let disp = currentDrink || '-';
                    return `<div class="l-cell-wrap"><div class="l-cell" tabindex="0" data-emp="${empId}" data-date="${dateDMY}" data-session="${session}" data-logid="${logId || ''}" data-supply="${supplySource}" data-val="${currentDrink || ''}">${disp}</div><div class="fill-handle" title="Drag to copy"></div></div>`;
                };

                const styleBlock = `
                <style>
                    .l-wrap { overflow: auto; background: #fff; border: 1px solid #CBD5E1; border-radius: 8px; flex: 1; min-height: 0; max-height: 100%; position:relative; touch-action: pan-x pan-y; }
                    .l-tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 11px; text-align: center; user-select: none; -webkit-user-select: none; }
                    
                    .l-th-date { min-width: 45px; position: sticky; left: 0; top: 0; z-index: 20; background: #E0F2FE; border-bottom: 2px solid #0A56D0; border-right: 1px solid #CBD5E1; height: 36px; padding: 2px; }
                    .l-th-emp { font-size: 11px; color: #1E293B; line-height: 1.1; white-space: normal; word-wrap: break-word; position: sticky; top: 0; z-index: 10; background: #F1F5F9; border-bottom: 1px solid #CBD5E1; border-right: 1px solid #CBD5E1; height: 36px; padding: 2px; border-top: none; }
                    
                    .l-th-sess { font-weight: 800; color: #44474E; background: #F8FAFC; width: 50px; min-width: 50px; position: sticky; top: 36px; z-index: 9; border-bottom: 2px solid #0A56D0; border-right: 1px dashed #CBD5E1; height: 24px; padding: 2px; }
                    .l-th-sess.aft { border-right: 1px solid #CBD5E1; }
                    
                    .l-td-date { border-bottom: 1px solid #E2E8F0; border-right: 1px solid #CBD5E1; padding: 0 2px; height: 26px; font-weight: bold; position: sticky; left: 0; background: #F8FAFC; z-index: 5; color: #0A56D0; line-height: 1; font-size: 10px; }
                    .l-td-morn { border-bottom: 1px solid #E2E8F0; border-right: 1px dashed #E2E8F0; padding: 0; height: 26px; }
                    .l-td-aft { border-bottom: 1px solid #E2E8F0; border-right: 1px solid #CBD5E1; padding: 0; height: 26px; }
                    
                    /* 🚨 EXCEL CELL CSS */
                    .l-cell-wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
                    .l-cell { width: 100%; height: 100%; display:flex; align-items:center; justify-content:center; font-size: 10px; font-weight: 700; color: #0A56D0; cursor: cell; box-sizing: border-box; outline:none; }
                    
                    .l-cell.active-cell { border: 2px solid #0A56D0; background: #E0F2FE; color: #0369A1; }
                    .cell-highlight { background-color: #BAE6FD !important; color: #0284C7 !important; border:1px solid #7DD3FC; }
                    
                    .fill-handle { position: absolute; right: -5px; bottom: -5px; width: 18px; height: 18px; background: #0A56D0; border: 2px solid #fff; cursor: crosshair; z-index: 30; border-radius: 50%; display:none; touch-action: none; }
                    .l-cell-wrap:has(.active-cell) .fill-handle { display:block; }
                    
                    .l-tot-lbl { border-bottom: 1px solid #CBD5E1; border-top: 2px solid #0A56D0; border-right: 1px solid #CBD5E1; padding: 0 2px; height: 24px; font-weight: 800; position: sticky; left: 0; z-index: 6; font-size: 10px; line-height: 1; }
                    .l-tot-val { border-bottom: 1px solid #CBD5E1; border-top: 2px solid #0A56D0; border-right: 1px solid #CBD5E1; padding: 0; height: 24px; font-weight: 900; font-size: 11px; line-height: 1; }
                </style>`;

                let htmlArr = [styleBlock];

                htmlArr.push(`<div class="l-wrap" id="adminGridScroller"><table class="l-tbl" style="min-width:${emps.length * 100 + 45}px;" id="adminLiveGridTable">`);
                htmlArr.push(`<thead class="l-thead"><tr><th rowspan="2" class="l-th-date">Date</th>`);
                emps.forEach(emp => {
                    htmlArr.push(`<th colspan="2" class="l-th-emp">${safeStr(emp.name)}</th>`);
                });
                htmlArr.push(`</tr><tr>`);
                emps.forEach(() => {
                    htmlArr.push(`<th class="l-th-sess">Morn</th><th class="l-th-sess aft">Aft</th>`);
                });
                htmlArr.push(`</tr></thead><tbody>`);

                const fastLogMap = {};
                logsData.forEach(l => {
                    if (l.supplySource === supplySource || (!l.supplySource && supplySource === 'Contractor')) {
                        fastLogMap[l.employeeId + '_' + l.date + '_' + l.session] = l;
                    }
                });

                for (let d = 1; d <= daysInMonth; d++) {
                    const dd = String(d).padStart(2,'0');
                    const dmy = `${dd}/${mm}/${yy}`;
                    const dObj = new Date(yy, mm - 1, d);
                    const dayName = dObj.toLocaleDateString('en-US', { weekday: 'short' });
                    
                    htmlArr.push(`<tr><td class="l-td-date">${dd} <span style="font-size:8px; font-weight:normal; color:#64748B;">${dayName}</span></td>`);
                    
                    emps.forEach(emp => {
                        const mLog = fastLogMap[emp.id + '_' + dmy + '_Morning'];
                        const aLog = fastLogMap[emp.id + '_' + dmy + '_Afternoon'];
                        
                        htmlArr.push(`<td class="l-td-morn">${buildCell(emp.id, dmy, 'Morning', mLog ? mLog.drink : '', mLog?.id)}</td>`);
                        htmlArr.push(`<td class="l-td-aft">${buildCell(emp.id, dmy, 'Afternoon', aLog ? aLog.drink : '', aLog?.id)}</td>`);
                    });
                    htmlArr.push(`</tr>`);
                }
                htmlArr.push(`</tbody><tbody id="adminLiveGridTotals"></tbody></table></div>`);

                wrapper.innerHTML = htmlArr.join('');

                // 🚨 EXCEL 2D DRAG TO COPY, AUTO SCROLL, KEYBOARD & UNDO/REDO LOGIC
                setTimeout(() => {
                    window.recalcAdminLiveGridTotals();
                    
                    const scroller = document.getElementById('adminGridScroller');
                    if (!scroller) return;
                    
                    if (!window.liveGridExcelModeInit) {
                        window.liveGridExcelModeInit = true;
                        let clipboardValue = ''; 
                        let activeCell = null;
                        let selectedCellsList = [];
                        
                        // 1. UNDO / REDO MEMORY LOGIC
                        window.updateLgUndoRedoUI = function() {
                            const btnU = document.getElementById('btnLgUndo');
                            const btnR = document.getElementById('btnLgRedo');
                            if(btnU) {
                                btnU.disabled = window.lgPast.length === 0;
                                btnU.style.opacity = window.lgPast.length === 0 ? '0.5' : '1';
                                btnU.style.borderColor = window.lgPast.length === 0 ? '#CBD5E1' : '#0A56D0';
                                btnU.style.color = window.lgPast.length === 0 ? '#64748B' : '#0A56D0';
                            }
                            if(btnR) {
                                btnR.disabled = window.lgFuture.length === 0;
                                btnR.style.opacity = window.lgFuture.length === 0 ? '0.5' : '1';
                                btnR.style.borderColor = window.lgFuture.length === 0 ? '#CBD5E1' : '#10B981';
                                btnR.style.color = window.lgFuture.length === 0 ? '#64748B' : '#10B981';
                            }
                        };

                        window.lgRecordChange = function(changes) {
                            if(window.lgIsReverting) return;
                            window.lgPast.push(changes);
                            window.lgFuture = [];
                            window.updateLgUndoRedoUI();
                        };

                        window.lgUndo = function() {
                            if(!window.lgPast.length) return;
                            const changes = window.lgPast.pop();
                            window.lgIsReverting = true;
                            
                            const redoChanges = [];
                            changes.forEach(ch => {
                                const cell = document.querySelector(`.l-cell[data-emp="${ch.emp}"][data-date="${ch.date}"][data-session="${ch.session}"]`);
                                if(cell) {
                                    redoChanges.push({ emp: ch.emp, date: ch.date, session: ch.session, oldVal: ch.newVal, newVal: ch.oldVal });
                                    cell.dataset.val = ch.oldVal;
                                    cell.innerText = ch.oldVal || '-';
                                    window.saveGridCellChange(cell, ch.oldVal);
                                }
                            });
                            window.lgFuture.push(redoChanges);
                            window.lgIsReverting = false;
                            window.updateLgUndoRedoUI();
                        };

                        window.lgRedo = function() {
                            if(!window.lgFuture.length) return;
                            const changes = window.lgFuture.pop();
                            window.lgIsReverting = true;
                            
                            const undoChanges = [];
                            changes.forEach(ch => {
                                const cell = document.querySelector(`.l-cell[data-emp="${ch.emp}"][data-date="${ch.date}"][data-session="${ch.session}"]`);
                                if(cell) {
                                    undoChanges.push({ emp: ch.emp, date: ch.date, session: ch.session, oldVal: ch.newVal, newVal: ch.oldVal });
                                    cell.dataset.val = ch.oldVal;
                                    cell.innerText = ch.oldVal || '-';
                                    window.saveGridCellChange(cell, ch.oldVal);
                                }
                            });
                            window.lgPast.push(undoChanges);
                            window.lgIsReverting = false;
                            window.updateLgUndoRedoUI();
                        };

                        // 2. CLEAR SELECTION
                        function clearSelection() {
                            document.querySelectorAll('.l-cell').forEach(c => {
                                c.classList.remove('active-cell', 'cell-highlight');
                            });
                            selectedCellsList = [];
                            activeCell = null;
                        }

                        // 3. APPLY MENU VALUE WITH UNDO/REDO & AUTO-ADVANCE
                        window.applyExcelMenuVal = function(val) {
                            let nextCell = null;
                            if(selectedCellsList.length > 0) {
                                const changes = [];
                                selectedCellsList.forEach(c => {
                                    const oldVal = c.dataset.val || '';
                                    if(oldVal !== val) {
                                        changes.push({ emp: c.dataset.emp, date: c.dataset.date, session: c.dataset.session, oldVal: oldVal, newVal: val });
                                        c.dataset.val = val;
                                        c.innerText = val || '-';
                                        window.saveGridCellChange(c, val);
                                    }
                                });
                                if(changes.length) window.lgRecordChange(changes);
                                clearSelection();
                            } else if(activeCell) {
                                const oldVal = activeCell.dataset.val || '';
                                if(oldVal !== val) {
                                    window.lgRecordChange([{ emp: activeCell.dataset.emp, date: activeCell.dataset.date, session: activeCell.dataset.session, oldVal: oldVal, newVal: val }]);
                                    activeCell.dataset.val = val;
                                    activeCell.innerText = val || '-';
                                    window.saveGridCellChange(activeCell, val);
                                }
                                
                                const allCells = Array.from(document.querySelectorAll('.l-cell'));
                                const currentIndex = allCells.indexOf(activeCell);
                                
                                if (currentIndex >= 0 && currentIndex < allCells.length - 1) {
                                    nextCell = allCells[currentIndex + 1];
                                }
                                
                                activeCell.classList.remove('active-cell');
                                
                                if (nextCell) {
                                    activeCell = nextCell;
                                    activeCell.classList.add('active-cell');
                                    nextCell.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
                                } else {
                                    activeCell = null;
                                }
                            }
                        };

                        // 4. CELL CLICK -> ACTIVE CELL
                        scroller.addEventListener('click', function(e) {
                            if (e.target.classList.contains('l-cell')) {
                                clearSelection();
                                activeCell = e.target;
                                activeCell.classList.add('active-cell');
                            }
                        });

                        // 5. KEYBOARD ACTIONS
                        document.addEventListener('keydown', function(e) {
                            if (activeCell) {
                                if (e.key === 'Backspace' || e.key === 'Delete') {
                                    e.preventDefault();
                                    const oldVal = activeCell.dataset.val || '';
                                    if(oldVal !== '') {
                                        window.lgRecordChange([{ emp: activeCell.dataset.emp, date: activeCell.dataset.date, session: activeCell.dataset.session, oldVal: oldVal, newVal: '' }]);
                                        activeCell.dataset.val = '';
                                        activeCell.innerText = '-';
                                        window.saveGridCellChange(activeCell, '');
                                    }
                                }
                                if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'C')) {
                                    e.preventDefault();
                                    clipboardValue = activeCell.dataset.val;
                                    activeCell.style.backgroundColor = '#FEF08A';
                                    setTimeout(() => activeCell.style.backgroundColor = '', 300);
                                }
                                if ((e.ctrlKey || e.metaKey) && (e.key === 'v' || e.key === 'V')) {
                                    e.preventDefault();
                                    window.applyExcelMenuVal(clipboardValue);
                                }
                            }
                        });
                        
                        // 6. 2D DRAG TO FILL
                        let isDragging = false;
                        let startColIndex = -1;
                        let startRowIndex = -1;
                        let fillValue = '';
                        let scrollInterval = null;
                        let lastX = 0, lastY = 0;

                        function getEventPos(e) {
                            if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                            if (e.changedTouches && e.changedTouches.length > 0) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
                            return { x: e.clientX, y: e.clientY };
                        }

                        function handleDragStart(e) {
                            if (e.target.classList.contains('fill-handle')) {
                                e.preventDefault(); 
                                e.stopPropagation();
                                isDragging = true;

                                const wrap = e.target.closest('.l-cell-wrap');
                                const startSelect = wrap.querySelector('.l-cell');
                                fillValue = startSelect.dataset.val || '';

                                const td = wrap.closest('td');
                                const tr = td.closest('tr');
                                startColIndex = Array.from(tr.children).indexOf(td);
                                startRowIndex = Array.from(tr.parentElement.children).indexOf(tr);
                                
                                selectedCellsList = [startSelect];
                                startSelect.classList.add('cell-highlight');

                                if (scrollInterval) clearInterval(scrollInterval);
                                scrollInterval = setInterval(() => {
                                    if(!isDragging) return;
                                    const rect = scroller.getBoundingClientRect();
                                    let scrolled = false;
                                    
                                    if(lastY > rect.bottom - 40) { scroller.scrollTop += 25; scrolled = true; }
                                    else if(lastY < rect.top + 40) { scroller.scrollTop -= 25; scrolled = true; }
                                    
                                    if(lastX > rect.right - 40) { scroller.scrollLeft += 25; scrolled = true; }
                                    else if(lastX < rect.left + 40) { scroller.scrollLeft -= 25; scrolled = true; }
                                    
                                    if(scrolled) processDragMove(lastX, lastY);
                                }, 40);
                            }
                        }

                        function processDragMove(clientX, clientY) {
                            const handle = document.querySelector('.active-cell + .fill-handle');
                            if(handle) handle.style.visibility = 'hidden';

                            const elem = document.elementFromPoint(clientX, clientY);
                            
                            if(handle) handle.style.visibility = 'visible';

                            if (!elem) return;
                            const td = elem.closest('td');
                            if (!td) return;
                            const tr = td.closest('tr');
                            if (!tr || !tr.parentElement) return;
                            
                            const currentColIndex = Array.from(tr.children).indexOf(td);
                            const currentRowIndex = Array.from(tr.parentElement.children).indexOf(tr);
                            const tbody = tr.parentElement;
                            
                            if(currentColIndex < 1 || currentRowIndex < 0) return; 

                            selectedCellsList.forEach(s => s.classList.remove('cell-highlight'));
                            selectedCellsList = [];
                            
                            const minRow = Math.min(startRowIndex, currentRowIndex);
                            const maxRow = Math.max(startRowIndex, currentRowIndex);
                            const minCol = Math.min(startColIndex, currentColIndex);
                            const maxCol = Math.max(startColIndex, currentColIndex);
                            
                            for (let r = minRow; r <= maxRow; r++) {
                                const row = tbody.children[r];
                                if (row) {
                                    for (let c = minCol; c <= maxCol; c++) {
                                        const targetTd = row.children[c];
                                        if (targetTd) {
                                            const sel = targetTd.querySelector('.l-cell');
                                            if (sel) {
                                                sel.classList.add('cell-highlight');
                                                selectedCellsList.push(sel);
                                            }
                                        }
                                    }
                                }
                            }
                        }

                        function handleDragMove(e) {
                            if (!isDragging) return;
                            e.preventDefault(); 
                            const pos = getEventPos(e);
                            lastX = pos.x;
                            lastY = pos.y;
                            processDragMove(lastX, lastY);
                        }

                        function handleDragEnd(e) {
                            if (isDragging) {
                                isDragging = false;
                                clearInterval(scrollInterval);
                                
                                if (selectedCellsList.length > 0) {
                                    const changes = [];
                                    selectedCellsList.forEach(sel => {
                                        sel.classList.remove('cell-highlight');
                                        const oldVal = sel.dataset.val || '';
                                        if (oldVal !== fillValue) {
                                            changes.push({ emp: sel.dataset.emp, date: sel.dataset.date, session: sel.dataset.session, oldVal: oldVal, newVal: fillValue });
                                            sel.dataset.val = fillValue;
                                            sel.innerText = fillValue || '-';
                                            window.saveGridCellChange(sel, fillValue);
                                        }
                                    });
                                    if(changes.length) window.lgRecordChange(changes);
                                }
                                selectedCellsList = [];
                                clearSelection();
                            }
                        }

                        scroller.addEventListener('touchstart', handleDragStart, {passive: false});
                        scroller.addEventListener('mousedown', handleDragStart);
                        document.addEventListener('touchmove', handleDragMove, {passive: false});
                        document.addEventListener('mousemove', handleDragMove);
                        document.addEventListener('touchend', handleDragEnd);
                        document.addEventListener('mouseup', handleDragEnd);
                    }
                }, 500);
            };

            window.saveGridCellChange = function(cellEl, val) {
                const empId = cellEl.dataset.emp;
                const dateDMY = cellEl.dataset.date;
                const session = cellEl.dataset.session;
                const supplySource = cellEl.dataset.supply;
                const existingLogId = cellEl.dataset.logid;

                cellEl.style.backgroundColor = '#FEF3C7';

                if (existingLogId) {
                    if (val && val !== '-') {
                        db.ref('logs/' + existingLogId).update({ drink: val }).then(() => {
                            cellEl.style.backgroundColor = '#DCFCE7';
                            setTimeout(() => cellEl.style.backgroundColor = 'transparent', 1000);
                            window.recalcAdminLiveGridTotals();
                        });
                    } else {
                        db.ref('logs/' + existingLogId).remove().then(() => {
                            cellEl.dataset.logid = '';
                            cellEl.style.backgroundColor = 'transparent';
                            window.recalcAdminLiveGridTotals();
                        });
                    }
                } else {
                    if (val && val !== '-') {
                        const empObj = employeeList.find(e => e.id === empId);
                        const empName = empObj ? empObj.name : 'Unknown';
                        let pId = empObj ? empObj.assignedPantryId : 'admin';
                        let pName = 'Admin';
                        if (pId && pId !== 'admin') {
                            const pb = pantryTeam.find(p => p.id === pId);
                            if (pb) pName = pb.name;
                        }
                        const newId = 'log_live_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
                        
                        db.ref('logs/' + newId).set({
                            id: newId, employeeId: empId, employeeName: empName,
                            drink: val, session: session, date: dateDMY,
                            pantryId: pId || 'admin', pantryName: pName,
                            supplySource: supplySource
                        }).then(() => {
                            cellEl.dataset.logid = newId;
                            cellEl.style.backgroundColor = '#DCFCE7';
                            setTimeout(() => cellEl.style.backgroundColor = 'transparent', 1000);
                            window.recalcAdminLiveGridTotals();
                        });
                    } else {
                        cellEl.style.backgroundColor = 'transparent';
                    }
                }
            };

            window.recalcAdminLiveGridTotals = function() {
                const table = document.getElementById('adminLiveGridTable');
                if(!table) return;
                const tbodyTotals = document.getElementById('adminLiveGridTotals');
                if(!tbodyTotals) return;

                const allCells = table.querySelectorAll('.l-cell');
                const empTotals = {};
                
                allCells.forEach(cell => {
                    const emp = cell.dataset.emp;
                    if(!empTotals[emp]) {
                        empTotals[emp] = { tea:0, coffee:0, green:0, lemon:0, blackTea:0, blackCoffee:0, total:0 };
                    }
                    const val = (cell.dataset.val || '').toLowerCase();
                    if(val === 'tea') empTotals[emp].tea++;
                    else if(val === 'coffee') empTotals[emp].coffee++;
                    else if(val === 'green tea') empTotals[emp].green++;
                    else if(val === 'lemon tea') empTotals[emp].lemon++;
                    else if(val === 'black tea') empTotals[emp].blackTea++;
                    else if(val === 'black coffee') empTotals[emp].blackCoffee++;
                    
                    if(val && val !== '-') empTotals[emp].total++;
                });

                const firstTr = table.querySelector('tbody tr');
                if (!firstTr) return;
                const firstRowCells = firstTr.querySelectorAll('.l-cell');
                const empsInOrder = [];
                for(let i=0; i<firstRowCells.length; i+=2) {
                    empsInOrder.push(firstRowCells[i].dataset.emp);
                }

                const drinksArr = [
                    { key: 'tea', label: 'Tea', color: '#1E3A8A', bg: '#EFF6FF' },
                    { key: 'coffee', label: 'Coffee', color: '#475569', bg: '#F1F5F9' },
                    { key: 'green', label: 'Green Tea', color: '#065F46', bg: '#ECFDF5' },
                    { key: 'lemon', label: 'Lemon Tea', color: '#92400E', bg: '#FFFBEB' },
                    { key: 'blackTea', label: 'Black Tea', color: '#5B21B6', bg: '#F5F3FF' },
                    { key: 'blackCoffee', label: 'Black Coffee', color: '#991B1B', bg: '#FEF2F2' }
                ];

                let totalsHtmlArr = [];
                drinksArr.forEach(d => {
                    let anyDrank = false;
                    empsInOrder.forEach(empId => { if(empTotals[empId] && empTotals[empId][d.key] > 0) anyDrank = true; });
                    
                    if (anyDrank) {
                        totalsHtmlArr.push(`<tr><td class="l-tot-lbl" style="background:${d.bg}; color:${d.color};">${d.label}</td>`);
                        empsInOrder.forEach(empId => {
                            let val = (empTotals[empId] && empTotals[empId][d.key]) ? empTotals[empId][d.key] : '-';
                            totalsHtmlArr.push(`<td colspan="2" class="l-tot-val" style="background:${d.bg}; color:${d.color};">${val}</td>`);
                        });
                        totalsHtmlArr.push(`</tr>`);
                    }
                });

                tbodyTotals.innerHTML = totalsHtmlArr.join('');
            };
            // ============================================================
            // DELIVERY REPORT (REGULAR & MEETINGS - DATE WISE TOTALS)
            // ============================================================
            window.generateFreshPBDeliveryReport = function(type, isExcel, overridePantryVal = null, meetingDeptFilter = 'All') {
                let month, supplySource, pantryId, pantryName;                
                if (currentUser.role === 'admin') {
                    month = document.getElementById('reportMonth').value;
                    supplySource = document.getElementById('reportSupplySource').value;
                    if(type === 'regular') {
                        pantryId = overridePantryVal || 'All';
                        pantryName = pantryId === 'All' ? 'All Pantry Boys' : pantryTeam.find(p=>p.id===pantryId)?.name || 'Unknown';
                    } else {
                        pantryName = overridePantryVal || 'All'; 
                        pantryId = pantryName; 
                    }
                } else {
                    month = document.getElementById('pbReportMonth').value;
                    supplySource = document.getElementById('pbReportSupplySource').value;
                    pantryId = currentUser.id;
                    pantryName = currentUser.name;
                }

                if (!month) return appAlert('Error', 'Please select a month.');

                const [yy, mm] = month.split('-');
                const daysInMonth = new Date(yy, mm, 0).getDate();
                const monthStr = new Date(month + '-01').toLocaleString('en-US', { month: 'long', year: 'numeric' }).toUpperCase();
                const supplyText = supplySource === 'Contractor' ? 'IA CATERERS' : 'DAU DIRECT PURCHASE';

                let dailyTotals = {};
                for(let d=1; d<=daysInMonth; d++) {
                    let dd = String(d).padStart(2,'0');
                    dailyTotals[`${dd}/${mm}/${yy}`] = { 
                        tea: 0, coffee: 0, green: 0, lemon: 0, blackTea: 0, blackCoffee: 0, other: 0
                    };
                }

            // 4. ADMIN MONTHLY GRID EXPORT (EXCEL / PDF)
            // ============================================================
            window.adminExportMonthlyGrid = function(format, overrideMonth, overrideSupply, overridePantry, overrideCat) {
                const month = overrideMonth || document.getElementById('reportMonth')?.value;
                const pantryId = overridePantry || document.getElementById('gridExportPantrySelect')?.value;
                const categoryVal = overrideCat || document.getElementById('gridExportCategorySelect')?.value;
                const supplySource = overrideSupply || document.getElementById('reportSupplySource')?.value || 'Contractor';
                const supplyText = supplySource === 'Contractor' ? 'IA CATERERS' : 'DAU DIRECT PURCHASE';
                
                if (!month) return appAlert('Error', 'Select month.');

                const [yy, mm] = month.split('-');
                const daysInMonth = getDaysInMonth(yy, mm);
                
                let emps = employeeList;
                if (pantryId !== 'All') {
                    emps = emps.filter(e => e.assignedPantryId === pantryId);
                }
                
                if (categoryVal !== 'All') {
                    const catMatch = categoryVal.trim().toLowerCase();
                    emps = emps.filter(e => {
                        const c = (e.category || '').trim().toLowerCase();
                        if (catMatch === 'outsourced' || catMatch === 'outsource') return c.includes('outsource');
                        return c === catMatch;
                    });
                }
                
                if(!emps.length) return appAlert('Notice', 'No employees found for this selection.');

                if (format === 'excel') {
                    const bStyle = { style: 'thin', color: { rgb: "000000" } };
                    const cellStyle = { alignment: { horizontal: "center", vertical: "center" }, border: { top: bStyle, bottom: bStyle, left: bStyle, right: bStyle } };
                    const headStyle = { font: { bold: true }, alignment: { horizontal: "center", vertical: "center" }, border: { top: bStyle, bottom: bStyle, left: bStyle, right: bStyle }, fill: { fgColor: { rgb: "F1F5F9" } } };

                    let headers1 = [{ v: 'Date', s: headStyle }];
                    let headers2 = [{ v: '', s: headStyle }];
                    
                    const colWidths = [{ wch: 12 }];
                    const merges = [];

                    emps.forEach((emp, i) => {
                        const baseIdx = 1 + (i * 2);
                        headers1.push({ v: emp.name, s: headStyle });
                        headers1.push({ v: '', s: headStyle }); 
                        
                        headers2.push({ v: 'Morn', s: headStyle });
                        headers2.push({ v: 'Aft', s: headStyle });
                        
                        colWidths.push({ wch: 10 }, { wch: 10 });
                        merges.push({ s: { r: 0, c: baseIdx }, e: { r: 0, c: baseIdx + 1 } });
                    });

                    let data = [headers1, headers2];

                    const fastLogMap = {};
                    logsData.forEach(l => {
                        if (l.supplySource === supplySource || (!l.supplySource && supplySource === 'Contractor')) {
                            fastLogMap[l.employeeId + '_' + l.date + '_' + l.session] = l;
                        }
                    });

                    for (let d = 1; d <= daysInMonth; d++) {
                        const dmy = `${String(d).padStart(2,'0')}/${mm}/${yy}`;
                        let row = [{ v: dmy, s: { font: { bold: true }, alignment: { horizontal: "center", vertical: "center" }, border: { top: bStyle, bottom: bStyle, left: bStyle, right: bStyle } } }];
                        
                        emps.forEach(emp => {
                            const mLog = fastLogMap[emp.id + '_' + dmy + '_Morning'];
                            const aLog = fastLogMap[emp.id + '_' + dmy + '_Afternoon'];
                            row.push({ v: mLog ? mLog.drink : '-', s: cellStyle });
                            row.push({ v: aLog ? aLog.drink : '-', s: cellStyle });
                        });
                        data.push(row);
                    }

                    const wb = XLSX.utils.book_new();
                    const ws = XLSX.utils.aoa_to_sheet(data);
                    ws['!merges'] = merges;
                    ws['!cols'] = colWidths;
                    
                    XLSX.utils.book_append_sheet(wb, ws, 'Monthly Grid');
                    window.pantryDownloadExcelFile(
    wb,
    `Monthly_Grid_${categoryVal}_${supplySource.replace(/\s+/g,'_')}_${month}.xlsx`
);
                    appAlert('Downloaded', 'Monthly Grid Excel downloaded successfully!');

                } else {
                    let html = '';
                    const chunkSize = 8;
                    const dateObj = new Date(month + '-01');
                    const monthStr = dateObj.toLocaleString('en-US', { month: 'long', year: 'numeric' }); 
                    const displayCat = categoryVal === 'All' ? 'All Categories' : categoryVal;

                    for (let i = 0; i < emps.length; i += chunkSize) {
                        const chunkEmps = emps.slice(i, i + chunkSize);
                        
                        html += `<div style="page-break-after: always; padding-bottom: 20px;">`;
                        html += `<h2 style="text-align:center; color:#0A56D0; margin-bottom: 12px; font-family: sans-serif; font-size: 16px;">Monthly Grid Export - ${displayCat} (${supplyText}) - ${monthStr} (Page ${Math.floor(i/chunkSize) + 1})</h2>`;
                        
                        html += `<table class="print-table" style="font-size:11px; width:100%; min-width:880px; text-align:center; border-collapse:collapse; table-layout:fixed; margin-bottom: 20px;"><thead><tr>`;
                        
                        html += `<th rowspan="2" style="border:1px solid #000; padding:6px 4px; background:#F1F5F9; width:95px; font-weight:700;">Date</th>`;
                        
                        chunkEmps.forEach(emp => {
                            html += `<th colspan="2" style="border:1px solid #000; padding:6px 4px; background:#F1F5F9; font-size:11px; line-height:1.3; word-break:normal;">${safeStr(emp.name)}</th>`;
                        });
                        html += `</tr><tr>`;
                        
                        chunkEmps.forEach(() => {
                            html += `<th style="border:1px solid #000; padding:4px; background:#F8FAFC; width:49px; min-width:49px; max-width:49px; font-weight:600;">Morn</th>`;
                            html += `<th style="border:1px solid #000; padding:4px; background:#F8FAFC; width:49px; min-width:49px; max-width:49px; font-weight:600;">Aft</th>`;
                        });
                        html += `</tr></thead><tbody>`;
                        
                        // ઓપ્ટિમાઇઝેશન: સ્પીડ વધારવા માટે Hash Map પ્રિન્ટ પેજ માટે પણ
                        const fastLogMap = {};
                        logsData.forEach(l => {
                            if (l.supplySource === supplySource || (!l.supplySource && supplySource === 'Contractor')) {
                                fastLogMap[l.employeeId + '_' + l.date + '_' + l.session] = l;
                            }
                        });

                        for (let d = 1; d <= daysInMonth; d++) {
                            const dmy = `${String(d).padStart(2,'0')}/${mm}/${yy}`;
                            const currentDayDate = new Date(yy, mm - 1, d);
                            const dayName = currentDayDate.toLocaleDateString('en-US', { weekday: 'long' });

                            html += `<tr>`;
                            html += `<td style="border:1px solid #000; padding:6px 4px; font-weight:bold; line-height:1.3; background:#F8FAFC;">${dmy}<br><span style="font-size:9px; font-weight:normal; color:#44474E;">${dayName}</span></td>`;
                            
                            chunkEmps.forEach(emp => {
                                const mLog = fastLogMap[emp.id + '_' + dmy + '_Morning'];
                                const aLog = fastLogMap[emp.id + '_' + dmy + '_Afternoon'];
                                
                                html += `<td style="border:1px solid #000; padding:4px; width:49px; min-width:49px; max-width:49px;">${mLog ? mLog.drink : '-'}</td>`;
                                html += `<td style="border:1px solid #000; padding:4px; width:49px; min-width:49px; max-width:49px;">${aLog ? aLog.drink : '-'}</td>`;
                            });
                            html += `</tr>`;
                        }
                        html += `</tbody></table></div>`;
                    }
                    
                    const container = document.getElementById('printAreaContainer');
                    container.innerHTML = `
                      <div class="preview-card" style="max-width:100%; width:98vw; height:95vh; max-height:95vh;">
                        <div class="preview-header hide-on-print">
                          <button onclick="window.print()" class="success">🖨️ Print Landscape</button>
                          <button onclick="document.getElementById('printAreaContainer').classList.add('hidden')" class="danger">✕ Close</button>
                        </div>
                        <div class="preview-content" style="overflow-x:auto; -webkit-overflow-scrolling:touch; padding: 10px; background:#fff;">
                          ${html}
                        </div>
                      </div>
                      <style>
                        @media print {
                          @page { size: A4 landscape; margin: 8mm; }
                          body { -webkit-print-color-adjust: exact; print-color-adjust: exact; background:#fff !important; }
                          .print-table { min-width: 100% !important; width: 100% !important; table-layout: fixed !important; }
                          .print-table th, .print-table td { padding: 4px !important; font-size: 10px !important; }
                        }
                      </style>
                    `;
                    container.classList.remove('hidden');
                }
            };

                            parentId: ev.id,

    document.getElementById('editEvtSaveBtn').onclick = function() {
        const name = document.getElementById('editEvtName').value.trim();
        const orderedBy = document.getElementById('editEvtOrderedBy').value.trim();
        if (!name || !orderedBy) return appAlert('Error', 'Organizer and Event Purpose are required.');

        const newItems = [];
        let finalTotalAmount = 0;
        const summarySegments = [];
        let hasError = false;

        itemsContainer.querySelectorAll('.dynamic-item-row-edit').forEach((row, index) => {
            const dateVal = row.querySelector('.e-item-date').value;
            const locVal = row.querySelector('.e-item-location').value.trim();
            const vdr = row.querySelector('.e-item-vendor').value.trim();
            const iName = row.querySelector('.e-item-name').value.trim();
            const iQty = parseInt(row.querySelector('.e-item-qty').value, 10) || 0;
            const iRate = parseFloat(row.querySelector('.e-item-rate').value) || 0;

                if (!srv) { appAlert('Error', `Select Pantry Boy for item ${index+1}`); hasError = true; }

                const finalRowDate = convertYMDtoDMY(dateVal);
                const itemAmt = iQty * iRate;
                
                finalTotalAmount += itemAmt;
                summarySegments.push(`${iQty} ${iName} (${locVal})`);

                if (locVal && !venueList.some(v => v.name.toLowerCase() === locVal.toLowerCase())) {
                    const vId = 'vnu_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
