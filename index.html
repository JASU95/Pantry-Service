                filterValue.addEventListener('input', renderLogsHistoryData);
                renderLogsHistoryData();
            }

            function renderLogsHistoryData() {
                const filterType = document.getElementById('filterType');
                const filterValue = document.getElementById('filterValue');
                if (!filterType || !filterValue) return;
                const type = filterType.value;
                let val = filterValue.value;
                if (type === 'date' && val.includes('-')) val = convertYMDtoDMY(val);

                const myLogs = logsData.filter(l => l.pantryId === currentUser.id);
                let filtered = myLogs.filter(l => {
                    if (!val) return true;
                    if (type === 'date') return l.date === val;
                    const ymd = parseDMYToYMD(l.date);
                    return ymd.startsWith(val);
                });

                let tea = 0,
                    coffee = 0,
                    green = 0,
                    lemon = 0,
                    blackTea = 0,
                    blackCoffee = 0;
                filtered.forEach(l => {
                    const d = (l.drink || '').toLowerCase().trim();
                    if (d === 'tea') tea++;
                    else if (d === 'coffee') coffee++;
                    else if (d === 'green tea') green++;
                    else if (d === 'lemon tea') lemon++;
                    else if (d === 'black tea') blackTea++;
                    else if (d === 'black coffee') blackCoffee++;
                });
                document.getElementById('statTeaCups').innerText = tea;
                document.getElementById('statCoffeeCups').innerText = coffee;
                document.getElementById('statGreenTeaCups').innerText = green;
                document.getElementById('statLemonTeaCups').innerText = lemon;
                document.getElementById('statBlackTeaCups').innerText = blackTea;
                document.getElementById('statBlackCoffeeCups').innerText = blackCoffee;
                document.getElementById('filteredTotalText').innerText = `Grand Total: ${filtered.length} Distributed`;

                const grouped = {};
                filtered.forEach(l => {
                    const key = l.date + '_' + l.employeeId;
                    if (!grouped[key]) grouped[key] = { empName: l.employeeName, date: l.date, mDrink: null,
                        aDrink: null, mId: null, aId: null };
                    if (l.session === 'Morning') { grouped[key].mDrink = l.drink;
                        grouped[key].mId = l.id; }
                    if (l.session === 'Afternoon') { grouped[key].aDrink = l.drink;
                        grouped[key].aId = l.id; }
                });

                const arr = Object.values(grouped).sort((a, b) => new Date(parseDMYToYMD(b.date)) - new Date(
                    parseDMYToYMD(a.date)));
                const targetList = document.getElementById('logsList');
                if (!targetList) return;
                if (!arr.length) {
                    targetList.innerHTML =
                        `<p style="text-align:center; padding:20px; color:#74777F; font-size:.85rem;">No entries.</p>`;
                    return;
                }

                targetList.innerHTML = arr.map(g => `
              <div class="log-item" style="display:flex; flex-direction:column; align-items:flex-start; margin:8px 2px; padding:12px; border-left:4px solid #0A56D0;">
                <div style="width:100%; display:flex; justify-content:space-between; margin-bottom:8px; border-bottom:1px solid #E2E8F0; padding-bottom:6px;">
                  <strong style="color:#0A56D0; font-size:1rem;">${safeStr(g.empName)}</strong>
                  <small style="color:#74777F; font-weight:700;">${safeStr(g.date)}</small>
                </div>
                ${g.mDrink ? `<div style="width:100%; display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;"><span style="color:#44474E; font-size:.85rem;">🌅 Morning: <strong>${safeStr(g.mDrink)}</strong></span><span><button onclick="window.pantryEditLogHandler('${g.mId}','${safeStr(g.mDrink)}')" style="background:transparent; color:#0A56D0; padding:4px 8px; border:none; border-radius:8px; font-size:1.1rem; cursor:pointer;">✏️</button><button onclick="window.pantryDeleteHandler('regular_log','${g.mId}')" style="background:transparent; color:#DC3545; padding:4px 8px; border:none; border-radius:8px; font-size:1.1rem; cursor:pointer;">🗑</button></span></div>` : ''}
                ${g.aDrink ? `<div style="width:100%; display:flex; justify-content:space-between; align-items:center;"><span style="color:#44474E; font-size:.85rem;">🌇 Afternoon: <strong>${safeStr(g.aDrink)}</strong></span><span><button onclick="window.pantryEditLogHandler('${g.aId}','${safeStr(g.aDrink)}')" style="background:transparent; color:#0A56D0; padding:4px 8px; border:none; border-radius:8px; font-size:1.1rem; cursor:pointer;">✏️</button><button onclick="window.pantryDeleteHandler('regular_log','${g.aId}')" style="background:transparent; color:#DC3545; padding:4px 8px; border:none; border-radius:8px; font-size:1.1rem; cursor:pointer;">🗑</button></span></div>` : ''}
              </div>
            `).join('');
            }

            // ============================================================
            //  FIREBASE REALTIME LISTENERS
            // ============================================================
            db.ref('sessionDevices').on('value', snap => { cloudSessions = snap.val() || {};
                renderIfNeeded(); });
            db.ref('adminSecurityConfig').on('value', snap => {
                if (snap.exists()) adminSecurity = snap.val();
                else db.ref('adminSecurityConfig').set({ password: "admin123" });
            });
            db.ref('employees').on('value', snap => { employeeList = parseSnap(snap);
                renderIfNeeded(); });
            db.ref('pantryTeam').on('value', snap => { pantryTeam = parseSnap(snap);
                renderIfNeeded(); });
            db.ref('logs').on('value', snap => { logsData = parseSnap(snap);
                renderIfNeeded(); });
            db.ref('eventLogs').on('value', snap => { eventLogsData = parseSnap(snap);
                renderIfNeeded(); });
            db.ref('extraLogs').on('value', snap => { extraLogsData = parseSnap(snap);
                renderIfNeeded(); });
            db.ref('canteens').on('value', snap => { canteenList = parseSnap(snap);
                renderIfNeeded(); });
            db.ref('venues').on('value', snap => { venueList = parseSnap(snap);
                renderIfNeeded(); });
            db.ref('upcomingEvents').on('value', snap => { upcomingEventsData = parseSnap(snap);
                renderIfNeeded(); });
            db.ref('recycleBin').on('value', snap => {
                binData = snap.exists() ? snap.val() : { employees: {}, pantryTeam: {}, extraLogs: {},
                    eventLogs: {}, logs: {} };
                renderIfNeeded();
            });

            // ============================================================
            //  RENDER COORDINATOR
            // ============================================================
            function renderIfNeeded() {
                if (isRendering) return;
                isRendering = true;
                if (renderTimeout) clearTimeout(renderTimeout);
                renderTimeout = setTimeout(() => {
                    try {
                        if (!currentUser) renderLogin();
                        else if (currentUser.role === 'admin') {
                            if (adminScreen.classList.contains('hidden')) renderAdminConsole();
                            if (activeAdminTab && !document.getElementById('adminContentArea').classList
                                .contains('hidden')) {
                                switch (activeAdminTab) {
                                    case 'employees':
                                        renderEmployeeList();
                                        break;
                                    case 'pantry':
                                        renderPantryList();
                                        break;
                                    case 'canteens':
                                        renderAdminCanteens();
                                        break;
                                    case 'events':
                                        window.populateSharedEventSectionDataViews?.('admEvt');
                                        break;
                                    case 'reports':
                                        window.renderAdminLiveRecords?.();
                                        break;
                                    case 'locations':
                                        renderAdminVenues();
                                        break;
                                    case 'bin':
                                        renderRecycleBinLists();
                                        break;
                                }
                            }
                        } else if (currentUser.role === 'pantry') {
                            if (pantryScreen.classList.contains('hidden')) renderPantryDashboard();
                            if (!document.getElementById('pantryContentArea').classList.contains('hidden')) {
                                switch (activePantryTab) {
                                    case 'serve':
                                        populateServe();
                                        break;
                                    case 'monthly':
                                        window.renderMonthlyEntry();
                                        break;
                                    case 'extra':
                                        renderExtraTeaSection(true);
                                        break;
                                    case 'event':
                                        window.populateSharedEventSectionDataViews?.('pntEvt');
                                        break;
                                    case 'logs':
                                        renderLogsHistoryData();
                                        break;
                                }
                            }
                            if (!activePantryTab) window.renderPantryLiveUpcomingEventsCard?.();
                        }
                    } catch (e) { console.error(e); }
                    isRendering = false;
                }, 50);
            }

            // ============================================================
            //  INIT
            // ============================================================
            renderLogin();
        })();
    </script>
</body>
</html>
